# Closes the other half of metrics-server's TODO (see
# argocd/apps/metrics-server/application.yaml and
# todo/DONE.md#metrics-instant-metrics-metrics-server--kube-prometheus-stack): OpenLens's own visual metrics
# (the "Cluster" dashboard's CPU/Memory graphs, and even the plain usage bars
# on the Nodes list) all run through a Prometheus it can query, separately
# from the Kubernetes Metrics API metrics-server provides for `kubectl top`.
#
# Grafana still disabled deliberately for now:
# - grafana.enabled: false — dashboards live in SigNoz (terraform/signoz/);
#   the Compose-stack Grafana on the 16GB Pi was retired 2026-10-01.
#
# Alertmanager enabled 2026-09-20, once ntfy actually landed in the cluster
# (argocd/apps/ntfy/) — see argocd/README.md's kube-prometheus-stack section
# for the full story: Prometheus had real alerts firing for ~2 days with
# nowhere to send them (confirmed via its own `PrometheusNotConnectedToAlertmanagers`
# alert) before this was noticed. Routes through `ntfy-alertmanager`
# (argocd/apps/ntfy-alertmanager/) rather than a raw webhook straight to
# ntfy — Alertmanager's webhook_configs can't template its POST body into
# something ntfy's publish API would accept.
#
# Namespace is `monitoring`, not a per-app namespace like the rest of
# apps/ — this is the ecosystem-standard name and what OpenLens's own
# "Prometheus Operator" auto-detect option looks for.
#
# crds.enabled: true — ArgoCD applies this chart's CRDs (Prometheus,
# Alertmanager, etc.) with server-side apply. Six of the ten are 600-900KB as
# authored, and client-side apply copies the whole manifest into the
# last-applied-configuration annotation, which blows Kubernetes' 256KiB
# annotation cap ("metadata.annotations: Too long"). ServerSideApply=true
# (syncOptions below) tracks ownership in managedFields instead and works at
# this size (retested 2026-10-02 on ArgoCD v3.5.3, including taking over CRDs
# originally created by `kubectl create`). Replace=true is not needed.
#
# The compare-options annotation is also load-bearing: without
# ServerSideDiff the CRDs sync fine but sit OutOfSync forever, because the
# client-side diff doesn't account for API-server defaulting.
#
# prune: true + these CRDs means removing them from the chart (or flipping
# crds.enabled back to false) would DELETE the CRDs and every Prometheus,
# Alertmanager, ServiceMonitor and PrometheusRule with them. To go back to
# managing CRDs by hand, first add `argocd.argoproj.io/sync-options:
# Prune=false` to each live CRD, or turn off prune for this app.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.3.0
    helm:
      releaseName: kube-prometheus-stack
      valuesObject:
        crds:
          enabled: true
        grafana:
          enabled: false
        alertmanager:
          enabled: true
          alertmanagerSpec:
            # Public URL from httproute-alertmanager.yaml, so the links in
            # alert notifications (e.g. "silence this") open in a browser.
            # The chart default is the in-cluster Service address.
            externalUrl: https://alertmanager.jakerobb.org
            # Single replica, no HA gossip — matches this being a
            # best-effort home notification path, not a paged on-call
            # system. Trivial resource footprint either way.
            replicas: 1
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
          config:
            route:
              receiver: ntfy
              group_by: ["alertname", "namespace"]
              group_wait: 30s
              # 5m (the chart's unset-but-effective default) sat between a
              # 2026-09-21 incident's FIRING and RESOLVED ntfy messages —
              # once a group has sent its first notification, Alertmanager
              # won't send another update for it (including a resolve)
              # until group_interval passes, regardless of how fast the
              # underlying alert actually cleared. Prometheus's own
              # evaluationInterval/scrapeInterval are both 30s (not the
              # bottleneck), so 1m here gets a resolved notification out
              # about as fast as this pipeline can detect one. Deliberately
              # NOT touching global.resolve_timeout (still the chart's
              # default 5m) — that one governs how long Alertmanager waits
              # before assuming an alert resolved because Prometheus itself
              # went silent, which is a different failure mode; lowering it
              # would trade a slow-but-correct resolve for a fast-but-wrong
              # "all clear" during an actual Prometheus outage.
              group_interval: 1m
              # Home-lab pace, not paging pace — a still-firing alert gets
              # re-sent at most every 4h instead of Alertmanager's 4h
              # chart-default-adjacent-but-unset behavior, made explicit.
              repeat_interval: 4h
              routes:
                # The chart's Watchdog alert (always firing by design, to
                # prove the pipeline itself works) would otherwise repeat
                # every 4h forever — inhibit at the route instead of
                # dropping the rule, so it's still visible in the
                # Prometheus/Alertmanager UI if ever checked by hand.
                - receiver: "null"
                  matchers:
                    - alertname = "Watchdog"
                # InfoInhibitor is a meta-alert, not a real one — it fires
                # whenever a severity="info" alert is active with nothing
                # more severe alongside it in the same namespace, and per
                # its own annotation is meant to be routed to null (its
                # actual job, inhibiting other info-level alerts, is done by
                # `inhibit_rules` below). Found live 2026-09-22: a SigNoz
                # rollout produced one transient info-level condition, and
                # this alert — meant to
                # be invisible — reached ntfy instead
                # (github.com/prometheus-operator/kube-prometheus's
                # default rule set assumes the null-routing is already
                # there).
                - receiver: "null"
                  matchers:
                    - alertname = "InfoInhibitor"
            receivers:
              - name: ntfy
                webhook_configs:
                  - url: http://ntfy-alertmanager.monitoring.svc.cluster.local:8080
                    send_resolved: true
              - name: "null"
            # Same four rules as the chart's own default values. They were
            # already live before this block existed: Helm deep-merges maps,
            # and this `config:` never set `inhibit_rules`, so the chart's
            # defaults stayed in effect. Written out here (2026-09-24) so
            # they're visible in the repo and a chart bump can't change them
            # without showing up in a diff. Net effect:
            #   1-2. A critical alert suppresses the warning/info version of
            #        the *same* alert in the same namespace (and warning
            #        suppresses info). `alertname` is in `equal`, so an
            #        unrelated critical alert doesn't hide a different warning.
            #   3.   InfoInhibitor (firing = info alerts present with nothing
            #        warning/critical in that namespace) suppresses those info
            #        alerts. Info alerts therefore only notify as context for
            #        a warning/critical alert in the same namespace.
            #   4.   InfoInhibitor can't suppress itself. It's routed to
            #        "null" above anyway; this is the chart's belt-and-braces.
            inhibit_rules:
              - source_matchers: ["severity = critical"]
                target_matchers: ["severity =~ warning|info"]
                equal: ["namespace", "alertname"]
              - source_matchers: ["severity = warning"]
                target_matchers: ["severity = info"]
                equal: ["namespace", "alertname"]
              - source_matchers: ["alertname = InfoInhibitor"]
                target_matchers: ["severity = info"]
                equal: ["namespace"]
              - target_matchers: ["alertname = InfoInhibitor"]
        # KubeProxyDown/KubeProxy* are permanent false positives on this
        # cluster — Cilium runs in kube-proxy-replacement mode (see
        # talos/README.md's "Ingress: Gateway API" section), so there's no
        # kube-proxy DaemonSet to ever be up or scrape. Drops the whole rule
        # group rather than silencing the symptom in Alertmanager, so it
        # never fires (or gets scraped as a dead target) in the first place.
        defaultRules:
          rules:
            kubeProxy: false
          # Replaced by the two rules in node-memory below.
          disabled:
            NodeMemoryHighUtilization: true
        # Mac host disk space (added 2026-09-24). A UTM VM's disk file only
        # grows on the Mac as the VM writes to it, so the Mac running out of
        # space is what stops the VM: QEMU pauses it and its Talos node goes
        # NotReady with no explanation from inside Kubernetes. Kubelet's own
        # image cleanup can't prevent this, because it measures the VM's
        # 66GB virtual disk, not the Mac's free space. It happened on
        # 2026-09-24 (see todo/DONE.md "Mac host disk alert"): a burst of image
        # pulls stalled talos-worker-mbp after the Mac had sat below 1GB free
        # for hours. Thresholds are absolute: one busy rollout pulled ~8GB of
        # images, so 40GiB gives days of warning and 15GiB is "act now". Both
        # share an alertname so the critical one inhibits the warning (see
        # inhibit_rules above).
        additionalPrometheusRulesMap:
          mac-hosts:
            groups:
              - name: mac-hosts
                rules:
                  - alert: MacHostDiskSpaceLow
                    expr: disk_free{job="mac-hosts", path="/"} < 40 * 1024^3
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: Mac host {{ $labels.host }} is low on disk space.
                      # Don't start a line with a {{ template }}: Renovate strips
                      # templates before parsing, which breaks a folded block's
                      # indentation and silently drops this whole file from
                      # Renovate (scripts/ci/check-renovate-parse.py catches it).
                      description: >-
                        Mac host {{ $labels.host }} has {{ $value | humanize1024 }}B free.
                        The Talos VM it hosts pauses if the Mac fills up. Free
                        space on the Mac (Time Machine local snapshots are a
                        common hidden cost: tmutil listlocalsnapshots /).
                  - alert: MacHostDiskSpaceLow
                    expr: disk_free{job="mac-hosts", path="/"} < 15 * 1024^3
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: Mac host {{ $labels.host }} is nearly out of disk space.
                      description: >-
                        Mac host {{ $labels.host }} has only {{ $value | humanize1024 }}B
                        free. The Talos VM it hosts will pause (node NotReady)
                        once the Mac fills up. Free space now; don't force-stop
                        the VM if it has already paused.
          # iSCSI volumes (hexos-iscsi) show up on workers as sdb, sdc, ...;
          # sda is each worker's own system disk, which legitimately queues
          # deep during image pulls, so it's excluded. On 2026-09-29 around
          # 00:00 EDT, writes to Prometheus's own PVC on talos-worker-mbp
          # hung for 180s (the SCSI command timeout), twice, with no iSCSI
          # connection error and HexOS otherwise healthy. The kernel failed
          # the writes with EIO, ext4 logged "potential data loss", and an
          # hour later Prometheus panicked on the deferred fsync error and
          # lost head-chunk data. Nothing alerted: one restart isn't
          # KubePodCrashLooping, and kernel logs aren't collected anywhere.
          # Weighted I/O time is summed per request when it completes
          # (including a timeout), so ~10 writes stuck 180s each push the
          # 5m rate to ~6 (the incident peaked at 7.1). The worst normal
          # value on any iSCSI disk over the prior week was 3.3.
          iscsi-volumes:
            groups:
              - name: iscsi-volumes
                rules:
                  - alert: ISCSIVolumeIOStall
                    expr: >-
                      rate(node_disk_io_time_weighted_seconds_total{job="node-exporter",
                      instance=~"192\\.168\\.102\\.3[0-9]:9100", device=~"sd[b-z]"}[5m]) > 5
                    labels:
                      severity: warning
                    annotations:
                      summary: An iSCSI volume on {{ $labels.instance }} stalled.
                      description: >-
                        Disk {{ $labels.device }} on {{ $labels.instance }} had an
                        average of {{ $value | humanize }} requests waiting over 5 minutes.
                        Writes that time out fail with EIO and can lose data
                        silently. Check the node's dmesg for "timing out
                        command" or "I/O error, dev", find the pod that
                        mounts the device, and restart it if it logged write
                        errors. Then check HexOS for what stalled.
          # NodeMemoryHighUtilization, split by host (2026-10-05). The chart's
          # rule fires above 90% used for 15m everywhere. That's right for the
          # Talos nodes, but the MS-A2 (192.168.102.21) is the Proxmox host
          # for three VMs fixed at 8GiB each with ballooning off (talos-worker-1,
          # talos-worker-2, hexos), so about 24 of its 29GiB is always
          # resident. It idles at 3.2-3.4GiB available (~11%) and dipped to
          # 2.8GiB after a round of reboots, which tripped the 90% rule with
          # nothing wrong and nothing to fix: moving pods between the guests
          # doesn't free host memory. Swap is unused, and the real danger
          # (the host OOM-killing a VM) is well below 5% available.
          #
          # 2026-10-08: hexos went from 8GiB to 10GiB, so the VMs now hold
          # 26 of the ~29GiB and the host idles at ~1.25GiB available (~4%,
          # 95.7% used), which tripped the 95% rule. Nothing grows (all three
          # VMs are fixed-size, ARC is unused, swap is untouched), so the
          # threshold moved to 98% (~600MiB available).
          node-memory:
            groups:
              - name: node-memory
                rules:
                  - alert: NodeMemoryHighUtilization
                    expr: >-
                      100 - (node_memory_MemAvailable_bytes{job="node-exporter",
                      instance!="192.168.102.21:9100"} /
                      node_memory_MemTotal_bytes{job="node-exporter",
                      instance!="192.168.102.21:9100"} * 100) > 90
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: Host is running out of memory.
                      description: >-
                        Memory is filling up at {{ $labels.instance }}, has been
                        above 90% for the last 15 minutes, is currently at
                        {{ printf "%.2f" $value }}%.
                      runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodememoryhighutilization
                  - alert: NodeMemoryHighUtilization
                    expr: >-
                      100 - (node_memory_MemAvailable_bytes{job="node-exporter",
                      instance="192.168.102.21:9100"} /
                      node_memory_MemTotal_bytes{job="node-exporter",
                      instance="192.168.102.21:9100"} * 100) > 98
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: The MS-A2 Proxmox host is running out of memory.
                      description: >-
                        The Proxmox host {{ $labels.instance }} has been above
                        98% memory used for 15 minutes, currently
                        {{ printf "%.2f" $value }}%. Its three VMs hold about
                        26GiB of the 29GiB and it normally idles near 96%, so
                        this is a real change: check for a host process
                        (backups, a stuck qm task) or a VM that grew.
        kubeProxy:
          enabled: false
        # etcd is a Talos host service, not a pod, so the chart's default
        # selector (component=etcd) matches nothing. Point the Service at the
        # control-plane node IPs instead; :2381 is the plain-HTTP metrics
        # listener from talos/patches/control-plane/cp{1,2,3}.yaml.
        kubeEtcd:
          enabled: true
          endpoints:
            - 192.168.102.11
            - 192.168.102.12
            - 192.168.102.13
          service:
            enabled: true
            port: 2381
            targetPort: 2381
        prometheusOperator:
          # See revisionHistoryLimit policy in argocd/README.md. Prometheus
          # itself is an Operator-managed StatefulSet, not a Helm-templated
          # Deployment, so this chart doesn't expose an equivalent knob for
          # it — same "not worth chasing" call as local-path-provisioner's.
          revisionHistoryLimit: 2
          # Requests here and below from 7-day peaks (2026-09-24); the chart
          # sets none for any of these.
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
          # Covers the config-reloader sidecar in both Prometheus and
          # Alertmanager.
          prometheusConfigReloader:
            resources:
              requests:
                cpu: 5m
                memory: 64Mi
        kube-state-metrics:
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
        prometheus:
          # Headlamp's bundled Prometheus plugin (manifests/headlamp/deployment.yaml)
          # auto-detects a Prometheus Service by this exact label — added
          # 2026-09-22 so every browser session finds it automatically,
          # instead of each one needing a manual, localStorage-only
          # Settings > Plugins > Prometheus override (Headlamp has no
          # cluster-side/ConfigMap way to set that declaratively as of
          # v0.45.0 — see kubernetes-sigs/headlamp#3979, still an open
          # proposal). This is the chart's own `service.labels`, so it's
          # part of the declared Helm values ArgoCD's selfHeal enforces —
          # unlike a raw `kubectl label` on this Service, which selfHeal
          # would just strip back out on the next reconcile.
          service:
            labels:
              headlamp-prometheus: "true"
          prometheusSpec:
            # Public URL from httproute.yaml, so alert "source" links point
            # somewhere a browser can open instead of the pod's hostname.
            # No path component, so the UI keeps serving from /.
            externalUrl: https://prometheus.jakerobb.org
            # Cluster-wide discovery — without this, only the chart's own
            # bundled ServiceMonitors get scraped, and a future app's
            # ServiceMonitor would be silently ignored.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            # No VictoriaMetrics remote-write yet (see
            # todo/READY.md#log-and-metrics-aggregation), so keep
            # local retention/storage modest — this is a bridge, not the
            # long-term store.
            retention: 10d
            # Physical Macs underneath UTM-hosted Talos workers. Telegraf runs
            # natively on each Mac (scripts/mac-host-metrics/, see
            # docs/mac-host-metrics.md) and exposes /metrics on :9273 alongside
            # its OTLP feed to SigNoz. Scraped here so the rules in
            # additionalPrometheusRulesMap below can alert through Alertmanager.
            # The IP is a DHCP reservation on the UCG (set 2026-09-24). The
            # Telegraf `host` label carries the node-naming-convention name.
            # If a scrape fails, the chart's default TargetDown rule fires.
            additionalScrapeConfigs:
              - job_name: mac-hosts
                scrape_interval: 60s
                static_configs:
                  - targets:
                      - 192.168.102.9:9273   # 2018 MacBook Pro, host of talos-worker-mbp
              # Physical hosts outside the cluster running Debian's
              # prometheus-node-exporter package (docs/proxmox-host-metrics.md).
              # Named `node-exporter` on purpose: that puts them under the
              # same node-exporter alert rules as the cluster's nodes, and in
              # SigNoz's federation match (argocd/apps/signoz/application.yaml).
              # `node` matches the label the in-cluster node-exporter gets.
              - job_name: node-exporter
                static_configs:
                  - targets:
                      - 192.168.102.21:9100  # MS-A2, the Proxmox host
                    labels:
                      node: ms-a2
            # Steady at ~1.7Gi (7-day peak 1.68Gi).
            resources:
              requests:
                cpu: 100m
                memory: 2Gi
              limits:
                memory: 3Gi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: hexos-iscsi
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      # 20Gi (was 10Gi): at 10Gi the volume reached ~85% full
                      # (2026-09-30) with the 10d retention window still
                      # filling; ~240k series grow it ~0.4GB/12h. Expanded
                      # in place (hexos-iscsi allows volume expansion).
                      storage: 20Gi
        prometheus-node-exporter:
          # Chart default tolerations are empty, so node-exporter wouldn't
          # otherwise run on the (tainted) control-plane nodes — tolerate it
          # explicitly for full-cluster host metrics coverage.
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
          # Adds a `node` label (talos-cp-1, ...) to every node-exporter
          # series. Without it, the only host identifier is `instance`
          # (192.168.102.11:9100), which is what SigNoz legends would show.
          # Not `nodename`, the chart's example: node_uname_info already has
          # a `nodename` label, which would get renamed to exported_nodename.
          # Recording rules that join `group_left(node)` from kube_pod_info
          # overwrite it with the same value, so they're unaffected.
          prometheus:
            monitor:
              relabelings:
                - sourceLabels: [__meta_kubernetes_pod_node_name]
                  targetLabel: node
                  action: replace
        # kubelet.serviceMonitor.tlsConfig.insecureSkipVerify is already the
        # chart default (Talos's self-signed-per-node kubelet certs are
        # exactly the case it's defaulted on for) — same call already made
        # for metrics-server, nothing to override here.
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
      # Load-bearing: the large CRDs (see crds.enabled above) can't be
      # applied client-side.
      - ServerSideApply=true
    # Talos's cluster-wide PodSecurity default enforces `baseline` on every
    # namespace except kube-system (confirmed via
    # `talosctl get admissioncontrolconfig`) — node-exporter needs
    # hostNetwork/hostPID/hostPath/hostPort, all blocked at `baseline`.
    # First workload in this cluster to actually need host-level access, so
    # nothing else has hit this default before. Overridden per-namespace
    # here rather than touching the cluster-wide exemptions list.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
