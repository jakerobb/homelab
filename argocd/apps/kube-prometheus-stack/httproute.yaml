# Prometheus's own web UI at prometheus.jakerobb.org, for ad-hoc PromQL and
# checking rule/alert state. Sits alongside application.yaml for the same
# reason as argocd/apps/signoz/httproute.yaml: the app is sourced entirely
# from an external Helm chart, and root's recursive scan over argocd/apps/
# picks this file up directly.
#
# Gated by Authelia forward-auth (ExternalAuth): Prometheus has no login of
# its own, and external-dns publishes a real public DNS record. Requires the
# matching ReferenceGrant entry (argocd/apps/authelia/referencegrant.yaml)
# and access_control rule (argocd/apps/authelia/application.yaml) for
# prometheus.jakerobb.org. In-cluster consumers (Glance, SigNoz's federation
# scrape) keep using the Service directly and aren't affected.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: gateway-system
  hostnames:
    - prometheus.jakerobb.org
  rules:
    - filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              group: ""
              kind: Service
              name: authelia
              namespace: authelia
              port: 80
            http:
              path: /api/authz/ext-authz/
              allowedHeaders:
                - authorization
                - proxy-authorization
                - cookie
                - accept
                - host
                - x-forwarded-proto
                - x-forwarded-for
              allowedResponseHeaders:
                - remote-user
                - remote-groups
                - remote-name
                - remote-email
      backendRefs:
        - name: kube-prometheus-stack-prometheus
          port: 9090
