# A second ARC runner scale set, registered to jakerobb/restock-radar. Scale
# sets are bound to one repo (a personal account has no org-level pool), so
# restock-radar's workflows can't use the homelab one (arc-runners/). Workflows
# say `runs-on: arc-runner-restock-radar`.
#
# Same shape as arc-runners/: ephemeral pods, minRunners 0, the same runner
# image and GitHub App credentials (the App is installed on both repos, so the
# installation ID and the arc-github-app Secret are shared). Differences:
#   - maxRunners: 2. CI runs two jobs at once (go, ui); the publish workflow's
#     test job is one.
#   - A shared NFS cache volume (manifests/arc-runners-restock-radar/pvc.yaml)
#     mounted at /cache, so setup-go, setup-node, `go` and `npm` only download
#     what's new. Workflows set `cache: false` on setup-go/setup-node, since
#     their own caching goes through GitHub's cache service instead.
#   - Docker jobs stay on GitHub-hosted runners: these pods have no Docker, are
#     amd64-only, and the publish job holds registry credentials.
#
# The NetworkPolicy in manifests/arc-runners/ selects every pod in the
# arc-runners namespace, so it already covers these pods (DNS and public
# internet only). The listener runs in arc-systems with the other scale set's.
#
# Wave 1, like arc-runners: after arc-controller (CRDs) and external-secrets-config.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runners-restock-radar
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: ghcr.io/actions/actions-runner-controller-charts
      chart: gha-runner-scale-set
      targetRevision: 0.15.1
      helm:
        # Distinct from arc-runners' "arc-runner", or the two releases'
        # resources collide in the shared arc-runners namespace.
        releaseName: arc-runner-restock-radar
        valuesObject:
          githubConfigUrl: https://github.com/jakerobb/restock-radar
          githubConfigSecret: arc-github-app
          runnerScaleSetName: arc-runner-restock-radar
          minRunners: 0
          maxRunners: 2
          # See arc-runners/application.yaml: Helm `lookup` returns nothing
          # under ArgoCD, so name the controller's ServiceAccount explicitly.
          controllerServiceAccount:
            namespace: arc-systems
            name: arc-controller
          listenerTemplate:
            spec:
              containers:
                - name: listener
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 65532
                    runAsGroup: 65532
                    allowPrivilegeEscalation: false
                  resources:
                    requests:
                      cpu: 10m
                      memory: 32Mi
                    limits:
                      memory: 128Mi
          template:
            spec:
              automountServiceAccountToken: false
              nodeSelector:
                kubernetes.io/arch: amd64
              volumes:
                - name: ci-cache
                  persistentVolumeClaim:
                    claimName: restock-radar-ci-cache
              containers:
                - name: runner
                  # Same image as arc-runners/. It has no Go, so setup-go
                  # downloads it (once, into the cache volume). Bumped in
                  # lockstep by Renovate: keep the two pins on the same tag.
                  # renovate: datasource=docker depName=ghcr.io/jakerobb/homelab-arc-runner
                  image: ghcr.io/jakerobb/homelab-arc-runner:1.76@sha256:9c7f837faf2351ca21abf241d109c79c9302ef22d75af20f41dedcbdbf045344
                  command: ["/home/runner/run.sh"]
                  env:
                    # The runner derives RUNNER_TOOL_CACHE from this; setup-go
                    # and setup-node look there before downloading.
                    - name: AGENT_TOOLSDIRECTORY
                      value: /cache/toolcache
                    - name: GOMODCACHE
                      value: /cache/go/mod
                    # Compiled packages (govulncheck is built from source on
                    # every run). Go trims entries it hasn't used in days.
                    - name: GOCACHE
                      value: /cache/go/build
                    - name: npm_config_cache
                      value: /cache/npm
                  volumeMounts:
                    - name: ci-cache
                      mountPath: /cache
                  resources:
                    requests:
                      cpu: "1"
                      memory: 1Gi
                    limits:
                      memory: 3Gi
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop: ["ALL"]
                    seccompProfile:
                      type: RuntimeDefault
    - repoURL: https://github.com/jakerobb/homelab.git
      targetRevision: main
      path: manifests/arc-runners-restock-radar
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
