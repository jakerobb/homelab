# Homepage's own config files, one ConfigMap key per file, mounted
# individually via subPath in deployment.yaml (see gethomepage.dev/installation/k8s/).
#
# All of them are mounted, even the ones we don't use (docker.yaml,
# bookmarks.yaml, custom.css/js) — found out the hard way (2026-09-16) that
# this isn't optional: `services.yaml`/`settings.yaml`/`bookmarks.yaml`/
# `widgets.yaml` ship pre-baked as defaults in the image, but `docker.yaml`
# doesn't, so Homepage lazily tries to *write* a default copy into
# /app/config on first use — which fails EACCES under this pod's
# ownership/securityContext and crash-loops the whole container
# (`checkAndCopyConfig` in src/utils/config/config.js calls
# `process.exit(1)` on that failure). Mounting an empty string for every
# config file up front means `existsSync` is always true and that code path
# never runs, matching the upstream example manifest we should have just
# copied verbatim here to begin with.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Homelab

  # `mode: cluster` = discover via this pod's own ServiceAccount (see
  # clusterrole.yaml) rather than a mounted kubeconfig. `gateway: true` turns
  # on HTTPRoute discovery specifically — this cluster is Gateway-API-only
  # (no Ingress controller), so `ingress`/`traefik` are deliberately left off.
  # To opt an app already running in the cluster into auto-discovery instead
  # of a manual entry below, annotate its HTTPRoute:
  #   gethomepage.dev/enabled: "true"
  #   gethomepage.dev/name: "My App"
  #   gethomepage.dev/icon: "my-app.png"
  #   gethomepage.dev/description: "..."
  # Discovered services render in their own group, above the manual list
  # below, in whatever order the Kubernetes API returns them (not
  # alphabetical) — a known Homepage limitation, not something to chase here.
  kubernetes.yaml: |
    mode: cluster
    gateway: true

  # Manually-entered apps, alphabetical by name. This is deliberately a
  # snapshot of everything currently proxied by docker-compose/caddy/Caddyfile
  # plus the two apps already live in the cluster (ArgoCD, Authelia) — as
  # each Compose app migrates into the cluster per TODO.md's "Compose workload
  # migration" plan, delete its entry here and annotate its new HTTPRoute
  # instead (see kubernetes.yaml above) so it becomes self-maintaining.
  #
  # Icon names are homarr-labs/dashboard-icons slugs
  # (https://github.com/homarr-labs/dashboard-icons), verified to exist as of
  # 2026-09-15. A few homelab-specific tools (Modbus Controller/Relay,
  # Network Optimizer, Rack LED, Scrypted) have no dedicated icon in that set
  # — they're on generic `mdi-*` (Material Design Icons, also bundled) for
  # now. Swap those for a real custom icon any time by dropping an SVG in
  # icons-configmap.yaml and changing `icon:` here to `/icons/<file>.svg`.
  services.yaml: |
    - Homelab:
        - ArgoCD:
            icon: argo-cd.png
            href: https://argocd.jakerobb.org
        - Authelia:
            icon: authelia.png
            href: https://auth.jakerobb.org
        - Change Detection:
            icon: changedetection.png
            href: https://changedetection.jakerobb.org
        - Grafana:
            icon: grafana.png
            href: https://grafana.jakerobb.org
        - Home Assistant:
            icon: home-assistant.png
            href: https://homeassistant.jakerobb.org
        - InfluxDB:
            icon: influxdb.png
            href: https://influxdb.jakerobb.org
        - JetKVM:
            icon: jetkvm.png
            href: https://jetkvm.jakerobb.org
        - Logs:
            icon: victorialogs.png
            href: https://logs.jakerobb.org
        - Modbus Controller:
            icon: mdi-chip
            href: https://modbus.jakerobb.org
        - Modbus Relay:
            icon: mdi-swap-horizontal
            href: https://modbus-relay.jakerobb.org
        - Network Optimizer:
            icon: mdi-speedometer
            href: https://optimizer.jakerobb.org
        - ntfy:
            icon: ntfy.png
            href: https://ntfy.jakerobb.org
        - NUT (UPS Monitoring):
            icon: nut.png
            href: https://nut.jakerobb.org
        - Rack LED:
            icon: mdi-led-strip-variant
            href: https://rack-led.jakerobb.org
        - Scrypted:
            icon: mdi-cctv
            href: https://scrypted.jakerobb.org
        - UniFi Gateway:
            icon: unifi.png
            href: https://gateway.jakerobb.org
        - Z-Wave JS UI:
            icon: z-wave-js-ui.png
            href: https://zwave.jakerobb.org
        - Zigbee2MQTT:
            icon: zigbee2mqtt.png
            href: https://zigbee.jakerobb.org

  # Cluster/node widget deliberately omitted: needs metrics-server, which
  # isn't installed (see clusterrole.yaml). Just a search bar for now.
  widgets.yaml: |
    - search:
        provider: duckduckgo
        target: _blank

  # Empty on purpose (see the top-of-file comment) — these just need to
  # *exist* to stop Homepage from trying to write its own default copy and
  # crash-looping. Full set per `src/skeleton/` in the homepage repo as of
  # v2.3.0 — docker.yaml wasn't enough (see deployment.yaml's history);
  # proxmox.yaml turned out to be the same story, found live 2026-09-15.
  # If a future Homepage version adds another skeleton file, expect the same
  # crash for it too until it's added here.
  bookmarks.yaml: ""
  docker.yaml: ""
  proxmox.yaml: ""
  custom.css: ""
  custom.js: ""
