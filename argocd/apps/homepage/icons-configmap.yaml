# Empty scaffold for custom icons (the ones with no entry in
# homarr-labs/dashboard-icons — see the comment on `services.yaml` in
# configmap.yaml). Mounted at /app/public/icons/ in deployment.yaml.
#
# To add one: drop an SVG's contents in as a new key below (key name = the
# filename Homepage will serve it as, e.g. `rack-led.svg`), then reference it
# in services.yaml as `icon: /icons/rack-led.svg`. Stick to SVG — as plain
# text it stays a readable git diff, unlike PNG/JPG which would need
# `binaryData:` + base64.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-icons
  namespace: homepage
data: {}
