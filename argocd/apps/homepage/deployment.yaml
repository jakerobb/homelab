# Bare Deployment, no Helm chart — there's no official chart (only a couple
# of unofficial community ones), and this is a single Deployment with no
# per-environment variation, so Helm wouldn't earn its keep here (matches
# argocd-ingress's precedent of plain manifests for something simple).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
    spec:
      serviceAccountName: homepage
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.3.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Homepage refuses requests whose Host header isn't in this list
            # (anti-DNS-rebinding). The pod IP entry is for the
            # liveness/readiness probes below; home.jakerobb.org is the real
            # one, added by hand since it can't be derived from MY_POD_IP.
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "$(MY_POD_IP):3000,home.jakerobb.org"
            # stdout only, no log file: avoids winston's file transport
            # (src/utils/logger.js) ever trying to create /app/config/logs,
            # which is what actually 500'd every request (EACCES — non-root
            # UID, no writable volume there). Also just the right call for a
            # k8s app: let whatever aggregates container stdout handle this
            # (see TODO.md's Kubernetes log aggregation item) instead of a
            # log file nothing ever reads.
            - name: LOG_TARGETS
              value: "stdout"
          ports:
            - name: http
              containerPort: 3000
          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - mountPath: /app/config/settings.yaml
              name: homepage-config
              subPath: settings.yaml
            - mountPath: /app/config/kubernetes.yaml
              name: homepage-config
              subPath: kubernetes.yaml
            - mountPath: /app/config/services.yaml
              name: homepage-config
              subPath: services.yaml
            - mountPath: /app/config/widgets.yaml
              name: homepage-config
              subPath: widgets.yaml
            - mountPath: /app/public/icons
              name: homepage-icons
      volumes:
        - name: homepage-config
          configMap:
            name: homepage-config
        - name: homepage-icons
          configMap:
            name: homepage-icons
