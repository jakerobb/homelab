# Bare Deployment, no Helm chart — there's no official chart (only a couple
# of unofficial community ones), and this is a single Deployment with no
# per-environment variation, so Helm wouldn't earn its keep here (matches
# argocd-ingress's precedent of plain manifests for something simple).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
    spec:
      serviceAccountName: homepage
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.3.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Homepage refuses requests whose Host header isn't in this list
            # (anti-DNS-rebinding). The pod IP entry is for the
            # liveness/readiness probes below; home.jakerobb.org is the real
            # one, added by hand since it can't be derived from MY_POD_IP.
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "$(MY_POD_IP):3000,home.jakerobb.org"
            # stdout only, no log file: avoids winston's file transport
            # (src/utils/logger.js) ever trying to create /app/config/logs,
            # which is what actually 500'd every request (EACCES — non-root
            # UID, no writable volume there). Also just the right call for a
            # k8s app: let whatever aggregates container stdout handle this
            # (see TODO.md's Kubernetes log aggregation item) instead of a
            # log file nothing ever reads.
            - name: LOG_TARGETS
              value: "stdout"
            # HOMEPAGE_FILE_XXX reads the *contents* of the file at this
            # path and substitutes it for {{HOMEPAGE_FILE_XXX}} wherever that
            # appears in services.yaml/widgets.yaml — keeps the actual
            # secret values out of `kubectl describe pod`'s env dump, unlike
            # HOMEPAGE_VAR_XXX (see gethomepage.dev's env-substitution docs).
            # Sourced from the three Secrets mounted below (argocd/secrets/
            # {proxmox-api-token,truenas-api-key,unifi-credentials}.homepage.sops.yaml).
            - name: HOMEPAGE_FILE_PROXMOX_TOKEN_ID
              value: /run/secrets/proxmox/token-id
            - name: HOMEPAGE_FILE_PROXMOX_TOKEN_SECRET
              value: /run/secrets/proxmox/token-secret
            - name: HOMEPAGE_FILE_TRUENAS_API_KEY
              value: /run/secrets/truenas/api-key
            - name: HOMEPAGE_FILE_UNIFI_API_KEY
              value: /run/secrets/unifi/api-key
          ports:
            - name: http
              containerPort: 3000
          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - mountPath: /app/config/settings.yaml
              name: homepage-config
              subPath: settings.yaml
            - mountPath: /app/config/kubernetes.yaml
              name: homepage-config
              subPath: kubernetes.yaml
            - mountPath: /app/config/services.yaml
              name: homepage-config
              subPath: services.yaml
            - mountPath: /app/config/widgets.yaml
              name: homepage-config
              subPath: widgets.yaml
            # Empty, unused, but must exist — see configmap.yaml's top comment.
            - mountPath: /app/config/bookmarks.yaml
              name: homepage-config
              subPath: bookmarks.yaml
            - mountPath: /app/config/docker.yaml
              name: homepage-config
              subPath: docker.yaml
            - mountPath: /app/config/custom.css
              name: homepage-config
              subPath: custom.css
            - mountPath: /app/config/custom.js
              name: homepage-config
              subPath: custom.js
            - mountPath: /app/config/proxmox.yaml
              name: homepage-config
              subPath: proxmox.yaml
            - mountPath: /app/public/icons
              name: homepage-icons
            - mountPath: /run/secrets/proxmox
              name: proxmox-credentials
              readOnly: true
            - mountPath: /run/secrets/truenas
              name: truenas-credentials
              readOnly: true
            - mountPath: /run/secrets/unifi
              name: unifi-credentials
              readOnly: true
      volumes:
        - name: homepage-config
          configMap:
            name: homepage-config
        - name: homepage-icons
          configMap:
            name: homepage-icons
        # Applied out-of-band via `sops -d ... | kubectl apply -f -` — see
        # each secret's own comment header. Not ArgoCD-managed (no KSOPS
        # yet, see TODO.md), so these Secrets must already exist in the
        # `homepage` namespace before this Deployment will come up healthy.
        - name: proxmox-credentials
          secret:
            secretName: homepage-proxmox-credentials
        - name: truenas-credentials
          secret:
            secretName: homepage-truenas-credentials
        - name: unifi-credentials
          secret:
            secretName: homepage-unifi-credentials
