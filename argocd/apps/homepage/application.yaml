# Own Application rather than raw manifests under root — isolates
# homepage's sync/health status so a problem here doesn't show up as root
# itself being unhealthy. See argocd/README.md's app-of-apps section.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homepage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jakerobb/homelab.git
    targetRevision: main
    path: manifests/homepage
  destination:
    server: https://kubernetes.default.svc
    namespace: homepage
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
