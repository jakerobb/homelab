# Trimmed from Homepage's own published RBAC example
# (https://gethomepage.dev/installation/k8s/) to what this cluster actually
# uses: Gateway API only (the cluster deliberately has no Ingress controller
# and no Traefik — see talos/README.md#ingress-gateway-api-decided-and-deployed-2026-09-13),
# so the upstream example's `networking.k8s.io/ingresses` and
# `traefik.io/ingressroutes` rules are dropped. `metrics.k8s.io` is also
# dropped: no metrics-server is installed on this cluster yet (verified via
# `kubectl top nodes` -> "Metrics API not available"), so granting it would
# be dead weight — add it back if that ever changes (see TODO.md's metrics
# item).
#
# Read-only (get/list) everywhere; Homepage never needs to mutate cluster
# state, only enumerate it for discovery + the (currently unused) cluster
# widget.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
rules:
  - apiGroups: [""]
    # `services` isn't required by the gateway-only discovery path below, but
    # is cheap to include for future flexibility (e.g. a Service with no
    # HTTPRoute in front of it).
    resources: [namespaces, pods, nodes, services]
    verbs: [get, list]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes, gateways]
    verbs: [get, list]
