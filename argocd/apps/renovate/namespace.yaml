# Same pattern as argocd-ingress/httproute.yaml and homepage/namespace.yaml:
# plain resource applied directly by the root Application, no child
# Application of its own. Default `baseline` PodSecurity is fine — Renovate
# needs no host access, just outbound network to GitHub and the various
# registries/chart repos it checks.
apiVersion: v1
kind: Namespace
metadata:
  name: renovate
