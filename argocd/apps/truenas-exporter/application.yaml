# Own Application rather than raw manifests under root — isolates the
# exporter's sync/health status, same reasoning as homepage's own
# Application. See argocd/README.md's app-of-apps section.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: truenas-exporter
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jakerobb/homelab.git
    targetRevision: main
    path: manifests/truenas-exporter
  destination:
    server: https://kubernetes.default.svc
    namespace: truenas-exporter
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
