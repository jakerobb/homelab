# Own Application rather than raw manifests under root: isolates scrypted's
# sync/health status. See argocd/README.md's app-of-apps section.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scrypted
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jakerobb/homelab.git
    targetRevision: main
    path: manifests/scrypted
  destination:
    server: https://kubernetes.default.svc
    namespace: scrypted
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
