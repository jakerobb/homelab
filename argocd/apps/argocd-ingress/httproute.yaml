# First real HTTPRoute on homelab-gateway (see talos/cilium/gateway.yaml).
# Hostname is a real public domain (Cloudflare-managed, external-dns creates
# the record automatically — see argocd/apps/external-dns/) rather than a
# manually-added local DNS entry. No sectionName pinned to a specific
# listener, so this attaches to both the http and https listeners.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: gateway-system
  hostnames:
    - argocd.jakerobb.org
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
