# Own Application rather than raw manifests under root — isolates glance's
# sync/health status, same reasoning as homepage's own Application. See
# argocd/README.md's app-of-apps section.
#
# `manifests/glance` is a Kustomize directory (kustomization.yaml), not
# plain YAML — ArgoCD detects that automatically, no `source.kustomize`
# block needed. See that file for why.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: glance
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jakerobb/homelab.git
    targetRevision: main
    path: manifests/glance
  destination:
    server: https://kubernetes.default.svc
    namespace: glance
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
