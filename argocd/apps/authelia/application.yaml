# Authelia, fronting ArgoCD only for now (see argocd/README.md for the
# full writeup and todo/READY.md for the Compose-workload migrations this doesn't
# cover yet). Deliberately light: file-based user database (SQLite via
# `storage.local`, no Postgres) and memory-based sessions (no Redis) — see
# argocd/README.md for why that's an acceptable trade for a homelab.
#
# ArgoCD gets real OIDC (see the oidc.config block added to
# argocd/install/values.yaml) rather than Gateway-level forward-auth —
# ArgoCD supports OIDC natively, so there's no need for Cilium's
# ExternalAuth HTTPRoute filter (which isn't available yet at the cluster's
# current Cilium version anyway — see todo/DONE.md).
#
# Secrets: authelia-secrets / users-database / oidc-jwk come from 1Password
# via External Secrets Operator (manifests/external-secrets-config/
# authelia.yaml) and must exist before this Application comes up healthy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authelia
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://charts.authelia.com
    chart: authelia
    targetRevision: "0.11.22"
    helm:
      releaseName: authelia
      valuesObject:
        image:
          # renovate: datasource=docker depName=authelia/authelia
          tag: '4.39.28'

        pod:
          kind: 'StatefulSet'
          replicas: 1
          # See revisionHistoryLimit policy in argocd/README.md.
          revisionHistoryLimit: 2
          resources:
            requests:
              cpu: 50m
              memory: 224Mi
            limits:
              memory: 384Mi

        ingress:
          enabled: true
          gatewayAPI:
            enabled: true
            parentRefs:
              - name: homelab-gateway
                namespace: gateway-system

        persistence:
          enabled: true
          # Moved from local-path to hexos-iscsi (2026-09-15) — deliberately
          # a clean start, not a migration: single admin account, zero active
          # sessions, so the old SQLite DB/2FA registrations weren't worth
          # preserving. storageClassName is immutable on an existing PVC, so
          # this requires deleting the old `authelia` PVC once synced (see
          # todo/READY.md/session notes) before the chart can recreate it here.
          storageClass: hexos-iscsi
          size: 200Mi

        secret:
          existingSecret: authelia-secrets
          additionalSecrets:
            users-database:
              items:
                - key: 'users_database.yml'
                  path: 'users_database.yml'
            oidc-jwk:
              items:
                - key: 'oidc.jwk.RS256.pem'
                  path: 'oidc.jwk.RS256.pem'

        configMap:
          authentication_backend:
            file:
              enabled: true
              path: '/secrets/users-database/users_database.yml'

          # No SMTP configured — password-reset/notification links get
          # written to /config/notification.txt in the pod instead of
          # emailed (`kubectl exec` to read it). Fine for a single-admin
          # homelab; revisit if that gets old.
          notifier:
            filesystem:
              enabled: true
              filename: '/config/notification.txt'

          storage:
            local:
              enabled: true
              path: '/config/db.sqlite3'

          # Homelab-appropriate long-lived sessions (changed 2026-09-17) — no
          # documented way to fully disable `inactivity` (unlike remember_me's
          # `-1`), so the practical equivalent is setting it equal to
          # `expiration`, which then always triggers first and makes
          # inactivity a no-op. Also matters more than it might seem because
          # ArgoCD uses real OIDC, not Gateway forward-auth: Authelia never
          # sees ArgoCD-usage traffic, only the initial login and whatever
          # redirects happen when ArgoCD's own OIDC token needs refreshing —
          # so `inactivity` was really measuring "time since last touched
          # auth.jakerobb.org directly", not actual activity.
          session:
            expiration: '1 month'
            inactivity: '1 month'
            remember_me: '6 months'
            cookies:
              - domain: 'jakerobb.org'
                subdomain: 'auth'
                default_redirection_url: 'https://argocd.jakerobb.org'

          # Deny-by-default. ArgoCD uses native OIDC (its own client below);
          # home.jakerobb.org (Homepage, argocd/apps/homepage/) is the first
          # app gated via the Gateway-level ExternalAuth filter instead —
          # this rule is what it's actually checking against. Add a rule per
          # app as each one moves off Compose and gets its own HTTPRoute (see
          # todo/READY.md).
          access_control:
            default_policy: 'deny'
            rules:
              - domain: 'auth.jakerobb.org'
                policy: 'bypass'
              - domain: 'argocd.jakerobb.org'
                policy: 'two_factor'
              - domain: 'home.jakerobb.org'
                policy: 'two_factor'
              - domain: 'search.jakerobb.org'
                policy: 'two_factor'
              - domain: 'headlamp.jakerobb.org'
                policy: 'two_factor'
              - domain: 'signoz.jakerobb.org'
                policy: 'two_factor'
              - domain: 'glance.jakerobb.org'
                policy: 'two_factor'

          identity_providers:
            oidc:
              enabled: true
              jwks:
                - key_id: 'rsa'
                  algorithm: 'RS256'
                  use: 'sig'
                  key:
                    path: '/secrets/oidc-jwk/oidc.jwk.RS256.pem'
              # Authelia 4.38+ puts no identity-revealing claims (email,
              # name, etc.) in the ID token by default, regardless of the
              # client's requested `scopes` — found the hard way (2026-09-22):
              # kube-apiserver's OIDC authenticator only ever reads the ID
              # token itself (never calls /userinfo), so Headlamp's
              # `oidc-username-claim: email` (talos/patches/control-plane/oidc.yaml)
              # rejected every token with "claim not present" until a
              # client explicitly references a policy here. Named generically
              # (not `headlamp`) since ArgoCD's client below requests the
              # same `email` scope for its own RBAC subject matching
              # (argocd/README.md's "RBAC" section) and likely has this
              # exact same latent gap — not fixed here since that's
              # unverified and a separate change, but this policy is ready
              # to reuse for it.
              claims_policies:
                email_identity:
                  id_token:
                    - 'email'
                    - 'email_verified'
                    - 'preferred_username'
              clients:
                - client_id: 'argocd'
                  client_name: 'ArgoCD'
                  # pbkdf2-sha512 hash of the client secret ArgoCD itself
                  # holds in plaintext (Secret argocd-oidc-authelia, synced
                  # from 1Password item argocd-oidc-client-secret — see
                  # argocd/README.md).
                  client_secret: '$pbkdf2-sha512$310000$zU.R9zGKBboxkc1zlxfNpQ$weqxt6tHx8YcX83ZhuBaLElD6n/3YN60LLmbO.dbtSjCERquTToS67ixm8YhCgFW0jNJDYWsoAydYMjR05xo1w'
                  public: false
                  redirect_uris:
                    - 'https://argocd.jakerobb.org/auth/callback'
                  # Confirmed 2026-09-22: this was the same missing-claim
                  # gap that broke Headlamp's login (see claims_policies
                  # above) — ArgoCD's RBAC subject-matching
                  # (argocd/README.md's "RBAC" section) reads the `email`
                  # claim, which Authelia never put in the ID token without
                  # this reference. Reuses the same policy rather than a
                  # dedicated one; it doesn't cover `groups` (ArgoCD
                  # requests that scope too, below), but no policy.csv rule
                  # uses groups today, so that's a latent-not-active gap,
                  # not part of this fix.
                  claims_policy: 'email_identity'
                  scopes:
                    - 'openid'
                    - 'profile'
                    - 'email'
                    - 'groups'
                  grant_types:
                    - 'authorization_code'
                    - 'refresh_token'
                  response_types:
                    - 'code'
                  token_endpoint_auth_method: 'client_secret_basic'
                  authorization_policy: 'two_factor'
                - client_id: 'headlamp'
                  client_name: 'Headlamp'
                  # pbkdf2-sha512 hash of the plaintext secret Headlamp
                  # itself holds via the headlamp-oidc-client-secret Secret
                  # (synced from 1Password by External Secrets Operator —
                  # see argocd/README.md's Headlamp section). Computed 2026-09-21 by feeding the
                  # already-applied Secret's value into the running
                  # Authelia pod's own `authelia crypto hash generate
                  # pbkdf2` — matches the Secret exactly, never printed
                  # anywhere as plaintext.
                  client_secret: '$pbkdf2-sha512$310000$RZRmapFtgOZGwSpzvBKNHQ$9DmfwtdpdeFlYrzHPXtUi5xaXULRgHYtCuno/jDC6kmnG4kWr65Zptmp8ifo22yO97hbojifZLlngaGG/zQO1Q'
                  public: false
                  redirect_uris:
                    - 'https://headlamp.jakerobb.org/oidc-callback'
                  claims_policy: 'email_identity'
                  scopes:
                    - 'openid'
                    - 'profile'
                    - 'email'
                  grant_types:
                    - 'authorization_code'
                    - 'refresh_token'
                  response_types:
                    - 'code'
                  token_endpoint_auth_method: 'client_secret_basic'
                  authorization_policy: 'two_factor'
  destination:
    server: https://kubernetes.default.svc
    namespace: authelia
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
