# Machine-to-machine OTLP ingestion, separate from httproute.yaml (the
# human-facing UI, Authelia-gated) on purpose — an interactive login filter
# would just break plain POST requests from a log/metric shipper, and mixing
# an authenticated and an unauthenticated rule under one hostname is easy to
# get wrong later. Same trust model as every other app on this Gateway: the
# LB pool IP is LAN-only regardless of the public DNS record, so this isn't
# a materially bigger exposure than signoz.jakerobb.org itself.
#
# First consumer: Vector on rpi5-1 (docker-compose/vector/vector.yaml),
# shipping rpi5-1's own host logs here via its native `opentelemetry` sink
# (OTLP/HTTP, `/v1/logs`) — see argocd/README.md's SigNoz section. Generic
# hostname (not vector-specific) since any future OTLP-speaking source
# outside the cluster can reuse this same route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: signoz-otel-ingest
  namespace: signoz
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: gateway-system
  hostnames:
    - otel.jakerobb.org
  rules:
    - backendRefs:
        - name: signoz-otel-collector
          port: 4318
