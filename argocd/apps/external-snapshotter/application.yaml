# CRDs only (VolumeSnapshotClass/Content/Snapshot), not the snapshot-controller
# deployment or webhook -- democratic-csi's controller watches these CRDs
# unconditionally and was spamming ~1900 failed-watch log lines/day because
# they didn't exist in the cluster (see talos/README.md's health-check
# runbook, 2026-09-19). Installing just the CRDs stops that silent-failure
# spam. Actually reconciling VolumeSnapshot -> VolumeSnapshotContent still
# needs the snapshot-controller + validating webhook added separately if/when
# snapshots are actually wanted.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-snapshotter
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jakerobb/homelab.git
    targetRevision: main
    path: manifests/external-snapshotter
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
