# Own Application rather than raw manifests under root, same as restock-radar.
# See argocd/README.md's change-detection section.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: change-detection
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jakerobb/homelab.git
    targetRevision: main
    path: manifests/change-detection
  destination:
    server: https://kubernetes.default.svc
    namespace: change-detection
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
