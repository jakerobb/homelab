# Own Application, same reasoning as pv-janitor's. The manifests are Kustomize
# (for the script's configMapGenerator); see manifests/eso-restarter/README.md
# for what the job does.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eso-restarter
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jakerobb/homelab.git
    targetRevision: main
    path: manifests/eso-restarter
  destination:
    server: https://kubernetes.default.svc
    namespace: eso-restarter
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
