# External Secrets Operator (ESO): syncs values from 1Password into plain
# Kubernetes Secrets, replacing the old "sops -d ... | kubectl apply" step
# for the SOPS files that used to live under argocd/secrets/. The ClusterSecretStore and every
# ExternalSecret live in a separate Application (apps/external-secrets-config,
# wave 0) — same chart-then-config split as cert-manager/cert-manager-config.
# See argocd/README.md's "External Secrets Operator" section.
#
# Wave -1 so it's ahead of everything whose Secrets it provides.
#
# installCRDs: false — CRDs are installed manually, out-of-band, same
# blanket rule as kube-prometheus-stack/SigNoz (see argocd/README.md's
# "External Secrets Operator CRDs" section). ClusterSecretStore/SecretStore
# are ~724KB each as rendered (every provider's schema inlined), far past
# the 256KiB last-applied annotation limit. Consequence: bumping
# targetRevision needs a manual CRD re-apply — ESO changes its CRDs in most
# minor releases, so assume yes unless the release notes say otherwise.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.14.0
    helm:
      releaseName: external-secrets
      valuesObject:
        installCRDs: false
        # See revisionHistoryLimit policy in argocd/README.md. Set per
        # Deployment; the chart has no global knob.
        revisionHistoryLimit: 2
        # All three Deployments keep their service account token (the webhook
        # is annotated rather than tested; a broken webhook would block every
        # ExternalSecret change), and the annotation tells Radar that's
        # deliberate.
        deploymentAnnotations:
          radarhq.io/ignore-checks: automountServiceAccountToken,livenessProbeMissing
        # Chart sets no requests. Placeholders from ESO's typical footprint
        # at this scale (~15 ExternalSecrets); resize from real usage once
        # there's history — see todo/FUTURE.md's memory-request items.
        resources:
          requests:
            # 10m -> 25m on 2026-10-25: peaked at 0.078 cores (bursts on
            # restart, when every ExternalSecret resyncs).
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 1Gi
        webhook:
          revisionHistoryLimit: 2
          deploymentAnnotations:
            radarhq.io/ignore-checks: automountServiceAccountToken,livenessProbeMissing
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 384Mi
        certController:
          revisionHistoryLimit: 2
          deploymentAnnotations:
            radarhq.io/ignore-checks: automountServiceAccountToken,livenessProbeMissing
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 512Mi
        serviceMonitor:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
