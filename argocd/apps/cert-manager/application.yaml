# Wave 0: chart + CRDs + controllers only. The ClusterIssuer/Certificate
# (argocd/apps/cert-manager-config) are a separate Application at wave 1 so
# root waits for this one to report Healthy before creating them — otherwise
# the ClusterIssuer's `kind` wouldn't exist yet (CRD race).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.2
    helm:
      releaseName: cert-manager
      valuesObject:
        global:
          # Applies to all of cert-manager's Deployments (controller,
          # webhook, cainjector) — see revisionHistoryLimit policy in
          # argocd/README.md.
          revisionHistoryLimit: 2
        crds:
          enabled: true
        # DNS-01 self-check was failing zone-walk lookups through the
        # cluster's own resolver chain (CoreDNS -> Unbound on the LAN),
        # which returned an unrelated/bogus SOA answer for the query rather
        # than the real jakerobb.org zone. Bypass it entirely for ACME
        # propagation checks by going straight to public recursive resolvers.
        extraArgs:
          - --dns01-recursive-nameservers=1.1.1.1:53,8.8.8.8:53
          - --dns01-recursive-nameservers-only=true
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
