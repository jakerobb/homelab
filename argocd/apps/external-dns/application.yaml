apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns
    chart: external-dns
    targetRevision: "1.22.0"
    helm:
      releaseName: external-dns
      valuesObject:
        # See revisionHistoryLimit policy in argocd/README.md.
        revisionHistoryLimit: 2

        provider:
          name: cloudflare
        sources:
          - gateway-httproute
        policy: sync
        registry: txt
        # Distinguishes records this instance owns from Caddy's existing
        # jakerobb.org records — flat/shared zone was a deliberate choice
        # (migrating most Caddy-managed names into k8s over time), but the
        # TXT registry still means external-dns will only ever touch/prune
        # records carrying its own ownership marker, never Caddy's.
        txtOwnerId: homelab-k8s
        domainFilters:
          - jakerobb.org
        # cloudflare-proxied is NOT set — its own default is already `false`
        # (DNS-only/grey-cloud), which is what we want: these records point
        # at a private LAN IP, so Cloudflare's edge proxy would break
        # resolution entirely. Explicitly passing `--cloudflare-proxied=false`
        # crashes the pod — that flag's custom parser doesn't accept `=false`,
        # only bare presence (meaning true) or omission (meaning false).
        env:
          - name: CF_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: cloudflare-api-token
                key: api-token
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
