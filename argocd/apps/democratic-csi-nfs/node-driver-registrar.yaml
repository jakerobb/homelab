# Standalone CSI node-driver-registrar for the NFS release of
# democratic-csi, replacing the chart's registrar sidecar (disabled via
# node.driverRegistrar.enabled: false in application.yaml). Identical to
# argocd/apps/democratic-csi/node-driver-registrar.yaml apart from the
# driver name; see that file's header for why the chart's registrar is
# replaced. For NFS the leaked mount doesn't lose writes the way ext4 does,
# but it still keeps every old NFS mount alive in the registrar's mount
# namespace after the volume moves off the node.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: democratic-csi-nfs-node-driver-registrar
  namespace: democratic-csi
  labels:
    app.kubernetes.io/name: democratic-csi-nfs-node-driver-registrar
    app.kubernetes.io/part-of: democratic-csi-nfs
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: democratic-csi-nfs-node-driver-registrar
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: democratic-csi-nfs-node-driver-registrar
        app.kubernetes.io/part-of: democratic-csi-nfs
    spec:
      # Same placement as the chart's node DaemonSet (no tolerations, so
      # workers only).
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName: system-node-critical
      automountServiceAccountToken: false
      containers:
        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.0
          args:
            - --v=2
            - --csi-address=/csi-data/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/org.democratic-csi.nfs/csi.sock
            - --http-endpoint=:9809
          env:
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: healthz
              containerPort: 9809
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Runs as root (the image default) to create its socket in the
          # root-owned host directories, but needs nothing else.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: socket-dir
              mountPath: /csi-data
            - name: registration-dir
              mountPath: /registration
      volumes:
        # Same host paths the chart uses. The driver's csi-proxy container
        # serves csi.sock here.
        - name: socket-dir
          hostPath:
            path: /var/lib/kubelet/plugins/org.democratic-csi.nfs
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
