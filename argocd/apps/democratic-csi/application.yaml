# iSCSI-backed StorageClass against HexOS/TrueNAS, chosen as the cluster's
# default block-storage path (see terraform/proxmox and talos/README.md for
# the iscsi-tools Talos extension this depends on). NFS stays available as a
# separate, later addition for genuinely ReadWriteMany workloads — this app
# only covers iSCSI.
#
# Sourced directly from the maintainer's own chart repo (not an ArtifactHub
# mirror) — same trust reasoning as local-path-provisioner: this runs
# privileged, cluster-wide, and provisions real storage.
#
# driver.existingConfigSecret points at a hand-maintained SOPS-encrypted
# Secret (argocd/secrets/democratic-csi-truenas-iscsi-config.sops.yaml) —
# not applied through ArgoCD sync (no SOPS/KSOPS wired up yet, same gap
# argocd/README.md already flags), so it must be applied out-of-band before
# this Application will go healthy. It contains the TrueNAS API key.
#
# reclaimPolicy: Retain, not the chart's Delete default — same reasoning as
# local-path-provisioner: this is a real PVC-backed StorageClass under
# ArgoCD's automated `prune: true`, so an accidental prune orphans the
# backing zvol on HexOS instead of deleting real data outright.
#
# defaultClass: true (decided 2026-09-15) — local-path-provisioner is no
# longer the cluster default; see its own application.yaml comment.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: democratic-csi
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/democratic-csi/charts.git
    targetRevision: democratic-csi-0.15.1
    path: stable/democratic-csi
    helm:
      releaseName: democratic-csi
      valuesObject:
        csiDriver:
          name: "org.democratic-csi.iscsi"
        storageClasses:
          - name: hexos-iscsi
            defaultClass: true
            reclaimPolicy: Retain
            volumeBindingMode: Immediate
            allowVolumeExpansion: true
            parameters:
              fsType: ext4
            # SELinux label for the whole filesystem (added 2026-09-23).
            # Talos runs SELinux in permissive mode, and a freshly-formatted
            # ext4 LUN has no xattr labels, so every file shows up as
            # unlabeled_t. Each pod write to it is then logged as an AVC
            # denial (allowed, since permissive, but still logged). ClickHouse's
            # constant part churn made that ~25k audit events/sec on
            # talos-worker-mbp, blowing through the kernel's audit rate
            # limit and burying every other audit record. ephemeral_t is
            # the label Talos gives its own user volumes, and pods can read
            # and write it; this
            # is Talos's documented fix for CSI volumes. See talos/README.md
            # "SELinux labels on iSCSI volumes".
            # Applies only to newly-provisioned PVs. Existing PVs need
            # spec.mountOptions patched by hand, plus a pod restart so the
            # volume gets remounted (steps in that README section).
            mountOptions:
              - context=system_u:object_r:ephemeral_t:s0
            secrets: {}
        volumeSnapshotClasses: []
        # Driver image pinned (2026-09-24) instead of the chart's default
        # `latest`, which any node-pod restart could silently re-pull.
        # `latest` was then master HEAD: v1.9.5 plus README-only commits.
        # The controller and node run the same image, so keep both tags in
        # step. Renovate PRs both, via the regex manager in renovate.json.
        # Requests throughout from 7-day peaks (2026-09-24); the chart sets
        # none. Kept deliberately above peak: this is the storage path for
        # every PVC in the cluster.
        controller:
          driver:
            image:
              # renovate: datasource=docker depName=ghcr.io/democratic-csi/democratic-csi
              tag: 'v1.9.5'
            resources:
              requests:
                cpu: 10m
                memory: 192Mi
          externalAttacher:
            resources:
              requests:
                cpu: 5m
                memory: 64Mi
          externalProvisioner:
            resources:
              requests:
                cpu: 5m
                memory: 64Mi
          externalResizer:
            resources:
              requests:
                cpu: 5m
                memory: 64Mi
          externalSnapshotter:
            resources:
              requests:
                cpu: 5m
                memory: 64Mi
        csiProxy:
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
        node:
          # Replaced by node-driver-registrar.yaml (a standalone DaemonSet).
          # The chart's registrar mounts all of /var/lib/kubelet without
          # mount propagation, which pins old copies of iSCSI mounts and
          # loses unflushed writes when a pod moves to another node. See
          # that file's header comment. This also drops the chart's `cleanup`
          # sidecar, which lives in the same template block. The standalone
          # registrar removes its own registration socket on SIGTERM.
          driverRegistrar:
            enabled: false
          driver:
            image:
              # renovate: datasource=docker depName=ghcr.io/democratic-csi/democratic-csi
              tag: 'v1.9.5'
            resources:
              requests:
                cpu: 20m
                memory: 224Mi
            # Without this, libmount drops the StorageClass's context= mount
            # option. See selinux-config.yaml.
            extraVolumeMounts:
              - name: selinux-config
                mountPath: /etc/selinux/config
                subPath: config
                readOnly: true
          extraVolumes:
            - name: selinux-config
              configMap:
                name: selinux-config
        driver:
          # The chart's node DaemonSet template inspects
          # driver.config.driver at Helm render time (contains "iscsi" ...)
          # to decide whether to wire up iSCSI host mounts — it needs this
          # even though existingConfigSecret supplies the real config
          # (including this same value) at runtime. Not sensitive on its
          # own, just the driver name.
          config:
            driver: freenas-api-iscsi
          existingConfigSecret: democratic-csi-truenas-iscsi-config
  destination:
    server: https://kubernetes.default.svc
    namespace: democratic-csi
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
