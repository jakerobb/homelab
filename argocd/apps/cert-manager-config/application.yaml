# Wave 1, created after the cert-manager Application (wave 0). The
# ClusterIssuer/Certificate kinds don't exist until cert-manager's CRDs are
# installed. Root doesn't wait for that, so on a cold bootstrap the first
# syncs can fail, and the retry policy covers it. See argocd/README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/jakerobb/homelab.git
    targetRevision: main
    path: manifests/cert-manager-config
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
