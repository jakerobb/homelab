# Homelab overrides for the argo-cd chart. Only deltas from chart defaults —
# see `helm show values argo/argo-cd --version 10.9.0` for everything else.
# Chart: https://github.com/argoproj/argo-helm, repo https://argoproj.github.io/argo-helm

nameOverride: argocd
fullnameOverride: argocd

global:
  # Chart default is 3 (Deployments); lowered to match the homelab-wide
  # revisionHistoryLimit: 2 policy — see argocd/README.md.
  revisionHistoryLimit: 2

controller:
  # Chart default is 5 for the application-controller StatefulSet; same
  # policy as global above.
  revisionHistoryLimit: 2

configs:
  params:
    # TLS is terminated at the Gateway (wildcard cert, see
    # talos/cilium/gateway.yaml and argocd/README.md's DNS + TLS section) —
    # the backend pod itself still just serves plain HTTP behind that.
    server.insecure: true
  cm:
    # Needed for correct OIDC redirect URIs below — without it ArgoCD
    # doesn't know its own externally-visible URL.
    url: https://argocd.jakerobb.org
    # Authelia SSO (decided 2026-09-13) — see argocd/README.md. ArgoCD talks
    # to Authelia over real OIDC (Authelia has native OIDC-provider support,
    # and ArgoCD has native OIDC-client support), no Gateway-level
    # forward-auth needed. `clientSecret` here is a reference by name, not
    # the value — the actual secret is supplied at `helm upgrade` time via
    # a separate SOPS-encrypted values file
    # (argocd/secrets/argocd-oidc-client-secret.sops.yaml), same pattern as
    # the Cloudflare API token. Do not put the plaintext secret in this
    # committed file.
    oidc.config: |
      name: Authelia
      issuer: https://auth.jakerobb.org
      clientID: argocd
      clientSecret: $oidc.authelia.clientSecret
      requestedScopes:
        - openid
        - profile
        - email
        - groups

dex:
  # No Dex connector — using ArgoCD's native OIDC support directly against
  # Authelia instead (see configs.cm.oidc.config above).
  enabled: false
