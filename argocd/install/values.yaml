# Homelab overrides for the argo-cd chart. Only deltas from chart defaults —
# see `helm show values argo/argo-cd --version <targetRevision in
# apps/argocd/application.yaml>` for everything else.
# Chart: https://github.com/argoproj/argo-helm, repo https://argoproj.github.io/argo-helm

nameOverride: argocd
fullnameOverride: argocd

# Managed by the `argocd` Application (apps/argocd/application.yaml), which
# reads this file; edit it and Sync there. A bad version can still break the
# controller that applies it, so the recovery path is `helm install` against
# this file from rpi5-1 (argocd/README.md, "Bootstrap").
crds:
  # The chart's default is `ServerSideApply=true` (the applicationsets CRD is
  # ~377KB, past the client-side-apply cap), and setting this key replaces that
  # map, so it's repeated here. Prune=false: ArgoCD's own CRDs vanishing would
  # take every Application with them.
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true,Prune=false

global:
  # Chart default is 3 (Deployments); lowered to match the homelab-wide
  # revisionHistoryLimit: 2 policy — see argocd/README.md.
  revisionHistoryLimit: 2

controller:
  # Chart default is 5 for the application-controller StatefulSet; same
  # policy as global above.
  revisionHistoryLimit: 2
  # Requests for every component, from 7-day usage (2026-09-24). The chart
  # sets none. The controller sits at ~450Mi and peaked at 643Mi.
  resources:
    requests:
      cpu: 50m
      memory: 512Mi

repoServer:
  resources:
    requests:
      cpu: 10m
      memory: 256Mi

server:
  resources:
    requests:
      cpu: 10m
      memory: 160Mi

applicationSet:
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
  # The chart's readiness probes are off by default: without one a pod is Ready
  # the moment its container starts. This is a TCP check on the probe port.
  readinessProbe:
    enabled: true

notifications:
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
  # See applicationSet above; a TCP check on the metrics port.
  readinessProbe:
    enabled: true
  # Deploy notifications to ntfy, so an alert says which revision caused it
  # (see argocd/README.md's "Deploy notifications"). ntfy has no auth (see
  # manifests/ntfy/httproute.yaml), so there is no secret to configure. The
  # webhook service POSTs ntfy's JSON publish format to the in-cluster
  # Service (the same path ntfy-alertmanager uses, so it doesn't depend on
  # the Gateway, DNS or TLS), which lets one service carry a per-template
  # topic, priority and tags; a webhook template can't set headers.
  context:
    argocdUrl: https://argocd.jakerobb.org
  notifiers:
    service.webhook.ntfy: |
      url: http://ntfy.ntfy.svc.cluster.local:8080
      headers:
        - name: Content-Type
          value: application/json
  templates:
    # Revision is `status.sync.revision` in all three: the one field that
    # exists whenever ArgoCD has compared the app with Git, even when the
    # sync failed before producing a syncResult (a template that hits a
    # missing key is dropped, not sent). It's a commit SHA for apps from this
    # repo and a chart version for the rest, hence the github.com check before
    # linking a commit. Multi-source apps (cilium, arc-runners) have no
    # `status.sync.revision`, so they show no revision, just the app link.
    template.deploy-failed: |
      webhook:
        ntfy:
          method: POST
          body: |
            {
              "topic": "homelab-alerts",
              "title": {{ printf "Sync failed: %s" .app.metadata.name | toJson }},
              "message": {{ printf "%s at %s\n%s" .app.metadata.name (.app.status.sync.revision | default "?" | trunc 7) (.app.status.operationState.message | default "" | trunc 800) | toJson }},
              "priority": 4,
              "tags": ["x"],
              "click": {{ if and .app.spec.source (contains "github.com/jakerobb/homelab" .app.spec.source.repoURL) }}{{ printf "%s/commit/%s" (call .repo.RepoURLToHTTPS .app.spec.source.repoURL) .app.status.sync.revision | toJson }}{{ else }}{{ printf "%s/applications/%s" .context.argocdUrl .app.metadata.name | toJson }}{{ end }},
              "actions": [{"action": "view", "label": "ArgoCD", "url": {{ printf "%s/applications/%s" .context.argocdUrl .app.metadata.name | toJson }}}]
            }
    template.deploy-degraded: |
      webhook:
        ntfy:
          method: POST
          body: |
            {
              "topic": "homelab-alerts",
              "title": {{ printf "Degraded: %s" .app.metadata.name | toJson }},
              "message": {{ printf "%s at %s\n%s" .app.metadata.name (.app.status.sync.revision | default "?" | trunc 7) (.app.status.health.message | default "" | trunc 800) | toJson }},
              "priority": 4,
              "tags": ["warning"],
              "click": {{ if and .app.spec.source (contains "github.com/jakerobb/homelab" .app.spec.source.repoURL) }}{{ printf "%s/commit/%s" (call .repo.RepoURLToHTTPS .app.spec.source.repoURL) .app.status.sync.revision | toJson }}{{ else }}{{ printf "%s/applications/%s" .context.argocdUrl .app.metadata.name | toJson }}{{ end }},
              "actions": [{"action": "view", "label": "ArgoCD", "url": {{ printf "%s/applications/%s" .context.argocdUrl .app.metadata.name | toJson }}}]
            }
    # Not subscribed by default (a message per merged change is noise next to
    # the alerts): add `on-sync-succeeded` to `subscriptions` below to enable.
    template.deploy-succeeded: |
      webhook:
        ntfy:
          method: POST
          body: |
            {
              "topic": "argocd-deploys",
              "title": {{ printf "Deployed: %s" .app.metadata.name | toJson }},
              "message": {{ printf "%s at %s" .app.metadata.name (.app.status.sync.revision | default "?" | trunc 7) | toJson }},
              "priority": 1,
              "tags": ["white_check_mark"],
              "click": {{ if and .app.spec.source (contains "github.com/jakerobb/homelab" .app.spec.source.repoURL) }}{{ printf "%s/commit/%s" (call .repo.RepoURLToHTTPS .app.spec.source.repoURL) .app.status.sync.revision | toJson }}{{ else }}{{ printf "%s/applications/%s" .context.argocdUrl .app.metadata.name | toJson }}{{ end }}
            }
  triggers:
    # oncePer: an app retries a failed sync up to 10 times (see the Application
    # manifests' retry blocks), and each failure would otherwise notify.
    trigger.on-sync-failed: |
      - when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']
        oncePer: app.status.sync.revision
        send: [deploy-failed]
    trigger.on-health-degraded: |
      - when: app.status.health.status == 'Degraded'
        send: [deploy-degraded]
    trigger.on-sync-succeeded: |
      - when: app.status.operationState != nil and app.status.operationState.phase in ['Succeeded']
        oncePer: app.status.sync.revision
        send: [deploy-succeeded]
  # Every Application, no per-app annotations to forget. ArgoCD's controller
  # only fires on a transition into the trigger's condition.
  # The recipient is the notifier's name, `ntfy`, not `webhook:ntfy`: a
  # destination is `service[:recipient]`, and the service for a
  # `service.webhook.ntfy` notifier is named `ntfy`. `webhook:ntfy` fails with
  # "notification service 'webhook' is not supported" the moment a trigger
  # fires, so nothing is ever sent.
  subscriptions:
    - recipients:
        - ntfy
      triggers:
        - on-sync-failed
        - on-health-degraded

redis:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
  # See applicationSet above; the chart's own script (redis-cli ping, answers in
  # ~20ms). The chart's 30s initial delay is shortened: Redis was Ready as soon as
  # it started when measured (2026-10-18), and the default would add 30s to every
  # restart of the server and repo-server's cache.
  readinessProbe:
    enabled: true
    initialDelaySeconds: 5

configs:
  params:
    # TLS is terminated at the Gateway (wildcard cert, see
    # talos/cilium/gateway.yaml and argocd/README.md's DNS + TLS section) —
    # the backend pod itself still just serves plain HTTP behind that.
    server.insecure: true
  cm:
    # Needed for correct OIDC redirect URIs below — without it ArgoCD
    # doesn't know its own externally-visible URL.
    url: https://argocd.jakerobb.org
    # Authelia SSO (decided 2026-09-13) — see argocd/README.md. ArgoCD talks
    # to Authelia over real OIDC (Authelia has native OIDC-provider support,
    # and ArgoCD has native OIDC-client support), no Gateway-level
    # forward-auth needed. `clientSecret` here is a reference, not the
    # value: `$<secret>:<key>` makes ArgoCD read key `clientSecret` from
    # Secret `argocd-oidc-authelia`, which External Secrets Operator syncs
    # from 1Password (manifests/external-secrets-config/argocd.yaml) with
    # the `app.kubernetes.io/part-of: argocd` label ArgoCD requires. Do not
    # put the plaintext secret in this committed file.
    oidc.config: |
      name: Authelia
      issuer: https://auth.jakerobb.org
      clientID: argocd
      clientSecret: $argocd-oidc-authelia:clientSecret
      requestedScopes:
        - openid
        - profile
        - email
        - groups
    # The chart's default list, minus EndpointSlice. manifests/lan-routes/
    # commits hand-written EndpointSlices (backends outside the cluster), and
    # with the default exclusion ArgoCD silently never applied them: the app
    # showed Synced/Healthy while every route returned 503. Setting this key
    # replaces the default, so recheck it against the chart's on upgrades.
    # Endpoints stays excluded; nothing in the repo uses it.
    resource.exclusions: |
      - apiGroups:
        - ''
        kinds:
        - Endpoints
      - apiGroups:
        - coordination.k8s.io
        kinds:
        - Lease
      - apiGroups:
        - authentication.k8s.io
        - authorization.k8s.io
        kinds:
        - SelfSubjectReview
        - TokenReview
        - LocalSubjectAccessReview
        - SelfSubjectAccessReview
        - SelfSubjectRulesReview
        - SubjectAccessReview
      - apiGroups:
        - certificates.k8s.io
        kinds:
        - CertificateSigningRequest
      - apiGroups:
        - cert-manager.io
        kinds:
        - CertificateRequest
      - apiGroups:
        - cilium.io
        kinds:
        - CiliumIdentity
        - CiliumEndpoint
        - CiliumEndpointSlice
      - apiGroups:
        - kyverno.io
        - reports.kyverno.io
        - wgpolicyk8s.io
        kinds:
        - PolicyReport
        - ClusterPolicyReport
        - EphemeralReport
        - ClusterEphemeralReport
        - AdmissionReport
        - ClusterAdmissionReport
        - BackgroundScanReport
        - ClusterBackgroundScanReport
        - UpdateRequest
  rbac:
    # Without this, ArgoCD's RBAC subject defaults to the OIDC `sub` claim —
    # an opaque UUID Authelia assigns, not anything a policy.csv rule could
    # reasonably target — so a freshly-authenticated user gets no role and
    # no app access. `scopes` tells ArgoCD to also check the `email` (and
    # `groups`, for later) claims as possible policy.csv subjects; the
    # `email` scope is already requested above, so it's already in the ID
    # token — this is purely an RBAC-side change.
    scopes: '[groups, email]'
    policy.csv: |
      g, jakerobb@gmail.com, role:admin

dex:
  # No Dex connector — using ArgoCD's native OIDC support directly against
  # Authelia instead (see configs.cm.oidc.config above).
  enabled: false
