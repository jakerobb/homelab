# The one Application applied by hand. Everything under argocd/apps/ from
# here on is reconciled by ArgoCD itself (recursive directory source, fully
# automated sync) — this is the app-of-apps root.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    # Cascade-delete child-managed resources if this Application is ever deleted.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jakerobb/homelab.git
    targetRevision: main
    path: argocd/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
  # cilium's Application object sets `syncPolicy: {}` explicitly (see
  # argocd/apps/cilium/application.yaml) to keep it manual-sync-only, but
  # ArgoCD's diff engine drops empty structs (omitempty) when normalizing
  # the git-desired side while the live object -- round-tripped through
  # etcd -- keeps the literal `{}`. That makes this Application perpetually
  # show OutOfSync here even though selfHeal has nothing to actually fix
  # (verified via `argocd app diff cilium --core`: zero real drift).
  # Same shape as the cilium-ca/hubble-server-certs ignoreDifferences below,
  # just scoped to root's own comparison instead of cilium's.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      name: cilium
      namespace: argocd
      jsonPointers:
        - /spec/syncPolicy
