# InfluxDB UI for NetworkOptimizer's instance. Took over influxdb.jakerobb.org
# from the Compose InfluxDB on rpi5-1 (manifests/lan-routes/, removed), which
# now holds only Telegraf's host metrics and retires with the rest of the
# Compose observability stack. That one stays reachable at rpi5-1.lan:8086.
#
# Gated by Authelia forward-auth on top of InfluxDB's own login, same as the
# lan-routes version. Needs this namespace in the ReferenceGrant
# (argocd/apps/authelia/referencegrant.yaml); the access_control rule for the
# hostname already existed. NetworkOptimizer itself uses the in-cluster
# Service, not this route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: influxdb
  namespace: network-optimizer
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: gateway-system
  hostnames:
    - influxdb.jakerobb.org
  rules:
    - filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              group: ""
              kind: Service
              name: authelia
              namespace: authelia
              port: 80
            http:
              path: /api/authz/ext-authz/
              allowedHeaders:
                - authorization
                - proxy-authorization
                - cookie
                - accept
                - host
                - x-forwarded-proto
                - x-forwarded-for
              allowedResponseHeaders:
                - remote-user
                - remote-groups
                - remote-name
                - remote-email
      backendRefs:
        - name: influxdb
          port: 8086
