# The web UI and JSON API (no auth of their own) are reached through
# httproute.yaml, which puts Authelia in front.
apiVersion: v1
kind: Service
metadata:
  name: restock-radar
  namespace: restock-radar
  labels:
    app.kubernetes.io/name: restock-radar
spec:
  selector:
    app.kubernetes.io/name: restock-radar
  ports:
    - name: http
      port: 8080
      targetPort: http
