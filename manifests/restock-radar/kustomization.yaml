# Kustomize for configMapGenerator, same reason as nut-exporter's: the app
# reads config.yaml only at startup, and the generator's content-hash suffix
# rolls the pod whenever config.yaml changes. Old hash-suffixed ConfigMaps get
# cleaned up by the Application's `prune: true`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: restock-radar
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: restock-radar-config
    files:
      - config.yaml
