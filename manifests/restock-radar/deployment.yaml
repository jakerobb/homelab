# restock-radar (github.com/jakerobb/restock-radar): polls the UniFi store's
# own JSON endpoints for stock and price changes on the products in
# config.yaml and pushes them to ntfy. Replaces ChangeDetection and
# Browserless's store watches. State is one SQLite file on a PVC, so it must
# stay at one replica with Recreate (never two pods on the database).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restock-radar
  namespace: restock-radar
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: restock-radar
  template:
    metadata:
      labels:
        app.kubernetes.io/name: restock-radar
    spec:
      automountServiceAccountToken: false
      # Matches the image's own USER; fsGroup makes the PVC writable by it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: restock-radar
          # Pinned by digest as well as tag: the app's date tags are UTC days,
          # and a second publish on the same day moves the tag, which would
          # change nothing here and leave nodes running their cached image.
          image: docker.io/jakerobb/restock-radar:20261005@sha256:77e87320e4fa9a8d3a93983eb5e831858013770bd0da2778804ef2b4e427e3d5
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          # /health only says the process is up; it doesn't depend on the
          # store being reachable, so a blocked poller shows in ntfy alerts,
          # not as pod restarts.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          # Without this the Service would route to the pod as soon as it
          # starts, before the server is listening.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - mountPath: /etc/restock-radar
              name: config
              readOnly: true
            - mountPath: /data
              name: data
            - mountPath: /backups
              name: backups
      volumes:
        # Generated from config.yaml by kustomization.yaml; the name gets a
        # content-hash suffix, so a config change rolls the pod.
        - name: config
          configMap:
            name: restock-radar-config
        - name: data
          persistentVolumeClaim:
            claimName: restock-radar-data
        - name: backups
          persistentVolumeClaim:
            claimName: restock-radar-backups
