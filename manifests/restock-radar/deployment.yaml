# restock-radar (github.com/jakerobb/restock-radar): polls the UniFi store's
# own JSON endpoints for stock and price changes on the products in
# config.yaml and pushes them to ntfy. Replaces ChangeDetection and
# Browserless's store watches. State is one SQLite file on a PVC, so it must
# stay at one replica with Recreate (never two pods on the database).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restock-radar
  namespace: restock-radar
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # The pod started in 15s after its last bump (measured 2026-10-18), which
  # includes the volumes. 300s, longer than the stateless apps' 120s, leaves
  # room for an iSCSI detach and attach when the pod lands on another node.
  # With Recreate there's no old pod to fall back on, so a rollout that can't finish is an outage: this turns it
  # into a Degraded app in 5 minutes instead of the default 10. Auto-merged by
  # Renovate; see argocd/README.md.
  progressDeadlineSeconds: 300
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: restock-radar
  template:
    metadata:
      labels:
        app.kubernetes.io/name: restock-radar
    spec:
      automountServiceAccountToken: false
      # Matches the image's own USER; fsGroup makes the PVC writable by it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: restock-radar
          # Pinned by digest as well as tag: the app's date tags are UTC days,
          # and a second publish on the same day moves the tag, which would
          # change nothing here and leave nodes running their cached image.
          image: docker.io/jakerobb/restock-radar:20261029175019@sha256:010fb7bfa70a82f2cfb779430a7f7dcdd6d484a4929487fafb74594679398d37
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          # /health only says the process is up; it doesn't depend on the
          # store being reachable, so a blocked poller shows in ntfy alerts,
          # not as pod restarts.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          # Without this the Service would route to the pod as soon as it
          # starts, before the server is listening.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - mountPath: /etc/restock-radar
              name: config
              readOnly: true
            - mountPath: /data
              name: data
            - mountPath: /backups
              name: backups
      volumes:
        # Generated from config.yaml by kustomization.yaml; the name gets a
        # content-hash suffix, so a config change rolls the pod.
        - name: config
          configMap:
            name: restock-radar-config
        - name: data
          persistentVolumeClaim:
            claimName: restock-radar-data
        - name: backups
          persistentVolumeClaim:
            claimName: restock-radar-backups
