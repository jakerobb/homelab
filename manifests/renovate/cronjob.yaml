# Replaced docker-compose's Watchtower (removed 2026-09-28): instead of
# patching running containers directly, Renovate opens PRs against this repo (container image
# tags, ArgoCD Helm chart versions under argocd/apps/**, docker-compose
# image tags, Terraform provider versions) — merging one is what actually
# changes anything, since ArgoCD's existing auto-sync then picks it up. See
# renovate.json at the repo root for what it scans and how.
#
# Bare CronJob, no Helm chart — single container, no per-environment
# variation (matches glance/argocd-ingress precedent for plain manifests).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: renovate
spec:
  # Two runs a day. 4:30am (off-peak, like the since-removed Watchtower's slot)
  # opens PRs for new releases. 11:30am is inside renovate.json's
  # `automergeSchedule` (after 11am, before 1pm, weekdays): Renovate only merges
  # while it runs, and it can't use GitHub's native auto-merge, which ignores
  # the schedule. So the midday run merges the auto-merge-eligible PRs that
  # passed lint since the morning, on a weekday while the owner is at their desk
  # and the house is quiet, so a bad deploy gets full attention. Both runs share
  # one cron expression, hence the same minute.
  schedule: "30 4,11 * * *"
  timeZone: America/Detroit
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          # The image's user (12021) isn't root, so a fresh PVC's root-owned
          # mount point needs fsGroup to be writable.
          securityContext:
            fsGroup: 12021
          initContainers:
            # Seeds the containerbase PVC from the image (pvc.yaml explains
            # why). Same image as the main container, so the tag is bumped
            # in both places by Renovate. It fingerprints the image's copy of
            # /opt/containerbase instead of being told a version: the PVC is
            # re-seeded (rsync --delete, which also prunes tools installed
            # since) only when that fingerprint differs from the marker. The
            # marker is written last, so an interrupted copy is redone.
            - name: seed-containerbase
              image: renovate/renovate:44.165.2
              command:
                - sh
                - -euc
                - |
                  fp=$(find /opt/containerbase \( -type f -o -type l \) -printf '%p %s %T@\n' | LC_ALL=C sort | sha256sum | cut -d' ' -f1)
                  if [ "$(cat /pvc/.seeded-for 2>/dev/null || true)" = "$fp" ]; then
                    echo "containerbase PVC already matches the image"
                    exit 0
                  fi
                  rm -f /pvc/.seeded-for
                  rsync -rltOE --delete --exclude=/lost+found --exclude=/.seeded-for /opt/containerbase/ /pvc/
                  echo "$fp" > /pvc/.seeded-for
                  echo "seeded containerbase PVC"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - mountPath: /pvc
                  name: containerbase
          containers:
            - name: renovate
              # Pinned, not :latest — this tag is itself now tracked by the
              # kubernetes manager (see renovate.json), so Renovate will open
              # a PR against itself when a new version ships.
              image: renovate/renovate:44.165.2
              args:
                - jakerobb/homelab
                # The Go apps deployed from this repo (manifests/restock-radar/,
                # nut-exporter/, truenas-exporter/, modbus-controller/): their
                # Go and npm dependencies, Actions pins and Dockerfile base
                # images. RENOVATE_TOKEN has to be granted each repository too.
                - jakerobb/restock-radar
                - jakerobb/nut-relay
                - jakerobb/truenas-exporter
                - jakerobb/modbus-eth-controller
              env:
                - name: RENOVATE_PLATFORM
                  value: github
                - name: LOG_LEVEL
                  value: info
                - name: RENOVATE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-github-token
                      key: token
                - name: RENOVATE_GIT_PRIVATE_KEY
                  valueFrom:
                    secretKeyRef:
                      name: renovate-signing-key
                      key: private-key
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  # 100m -> 500m on 2026-10-25: a run holds ~0.8 cores for a few
                  # minutes.
                  cpu: 500m
                  memory: 1Gi
                limits:
                  memory: 4Gi
              # Renovate's clones and caches live under /tmp. Dry-run tested
              # read-only on 2026-10-27 against all five repos with no write
              # errors. The image's preinstalled toolchains are in
              # /opt/containerbase; a bump that needs a tool version the image
              # doesn't have installs it there, so that's the writable PVC the
              # init container seeded (see pvc.yaml), not the read-only root.
              volumeMounts:
                - mountPath: /tmp
                  name: tmp
                - mountPath: /opt/containerbase
                  name: containerbase
          volumes:
            - name: tmp
              emptyDir: {}
            - name: containerbase
              persistentVolumeClaim:
                claimName: renovate-containerbase
