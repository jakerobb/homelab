# Kustomize for configMapGenerator, same as pv-janitor: eso-restarter.py lives
# here as a real file, and the generated ConfigMap's hash suffix means an edit
# to it is picked up on sync. Old hash-suffixed ConfigMaps are pruned by the
# Application. No kustomize-level `namespace:` here: it would rewrite the Role/
# RoleBinding in rbac.yaml out of external-secrets, where they must live.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - networkpolicy.yaml
  - namespace.yaml
  - rbac.yaml
  - cronjob.yaml
configMapGenerator:
  - name: eso-restarter-script
    namespace: eso-restarter
    files:
      - eso-restarter.py
