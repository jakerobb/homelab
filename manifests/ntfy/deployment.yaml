# Bare Deployment, no Helm chart — same reasoning as homepage/deployment.yaml
# (no official chart, single Deployment, no per-environment variation).
#
# Migrated from the docker-compose `ntfy` service on rpi5-1 (2026-09-20) —
# see docker-compose/docker-compose.yml's git history and
# argocd/README.md's ntfy section for the cutover.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: ntfy
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # The alert delivery path, so a rollout that can't finish should show up fast.
  # The pod started in about 10s when last measured (2026-10-18), including its
  # ReadWriteOnce cache volume. 180s leaves room for a volume re-attach.
  progressDeadlineSeconds: 180
  strategy:
    # Not RollingUpdate: the cache PVC is ReadWriteOnce, so a second pod
    # can't schedule (and mount it) until the first one's fully gone.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ntfy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ntfy
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: ntfy
          image: binwiederhier/ntfy:v2.34.0
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --config
            - /etc/ntfy/server.yml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            # Default (1s) is too tight under real node contention — found
            # 2026-09-22 when ntfy crash-looped (7 restarts/hour) purely
            # from missing the default timeout while its node was under
            # memory pressure from unrelated pod churn, not from ntfy
            # itself being unhealthy. 3s gives real slack for transient
            # load without masking an actually-stuck process.
            timeoutSeconds: 3
          # Same endpoint. Gates a rollout (the Recreate strategy has no old pod
          # to keep, but Ready still decides when the Service sends traffic),
          # and drops the pod from the Service if it stops answering. Same 3s
          # timeout as liveness, for the same node-contention reason.
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - mountPath: /etc/ntfy
              name: ntfy-config
              readOnly: true
            - mountPath: /var/cache/ntfy
              name: ntfy-cache
      volumes:
        - name: ntfy-config
          configMap:
            name: ntfy-config
        - name: ntfy-cache
          persistentVolumeClaim:
            claimName: ntfy-cache
