# Bare Deployment, no Helm chart — there's no official chart (only a couple
# of unofficial community ones), and this is a single Deployment with no
# per-environment variation, so Helm wouldn't earn its keep here (matches
# argocd-ingress's precedent of plain manifests for something simple).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
    spec:
      serviceAccountName: homepage
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.4.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Homepage refuses requests whose Host header isn't in this list
            # (anti-DNS-rebinding). The pod IP entry is for the
            # liveness/readiness probes below; home.jakerobb.org is the real
            # one, added by hand since it can't be derived from MY_POD_IP.
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "$(MY_POD_IP):3000,home.jakerobb.org"
            # stdout only, no log file: avoids winston's file transport
            # (src/utils/logger.js) ever trying to create /app/config/logs,
            # which is what actually 500'd every request (EACCES — non-root
            # UID, no writable volume there). Also just the right call for a
            # k8s app: let whatever aggregates container stdout handle this
            # (see todo/READY.md's Kubernetes log aggregation item) instead of a
            # log file nothing ever reads.
            - name: LOG_TARGETS
              value: "stdout"
            # HOMEPAGE_FILE_XXX reads the *contents* of the file at this
            # path and substitutes it for {{HOMEPAGE_FILE_XXX}} wherever that
            # appears in services.yaml/widgets.yaml — keeps the actual
            # secret values out of `kubectl describe pod`'s env dump, unlike
            # HOMEPAGE_VAR_XXX (see gethomepage.dev's env-substitution docs).
            # Sourced from the three Secrets mounted below.
            - name: HOMEPAGE_FILE_PROXMOX_TOKEN_ID
              value: /run/secrets/proxmox/token-id
            - name: HOMEPAGE_FILE_PROXMOX_TOKEN_SECRET
              value: /run/secrets/proxmox/token-secret
            - name: HOMEPAGE_FILE_TRUENAS_API_KEY
              value: /run/secrets/truenas/api-key
            - name: HOMEPAGE_FILE_UNIFI_API_KEY
              value: /run/secrets/unifi/api-key
          ports:
            - name: http
              containerPort: 3000
          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 384Mi
          volumeMounts:
            # Whole-directory mount, deliberately NOT one subPath entry per
            # file (that's how this was originally written). subPath-mounted
            # files are frozen at whatever they were when the pod started —
            # kubelet's periodic ConfigMap-volume refresh explicitly doesn't
            # apply to subPath mounts, a real Kubernetes limitation, not a
            # bug — so no ConfigMap edit, from git+ArgoCD or straight
            # `kubectl apply`, ever reached a running pod without a manual
            # restart. Found live 2026-09-17.
            #
            # Whole-mount trades that for a different constraint: it makes
            # all of /app/config exclusively ConfigMap-owned (replaces
            # whatever the image had there, and stays read-only), so it's
            # only safe because homepage-config's 9 keys are the *complete*
            # skeleton set Homepage ships (confirmed against src/skeleton/ in
            # the homepage repo, v2.3.0) — if a future version adds a 10th
            # skeleton file, expect the same EACCES crash-loop docker.yaml
            # and proxmox.yaml caused earlier until it's added as a key here
            # too. Propagation after a ConfigMap change is near-live, not
            # instant — kubelet's own sync period plus cache TTL, typically
            # up to ~1-2 minutes, not an immediate refresh.
            - mountPath: /app/config
              name: homepage-config
            - mountPath: /app/public/icons
              name: homepage-icons
            - mountPath: /run/secrets/proxmox
              name: proxmox-credentials
              readOnly: true
            - mountPath: /run/secrets/truenas
              name: truenas-credentials
              readOnly: true
            - mountPath: /run/secrets/unifi
              name: unifi-credentials
              readOnly: true
      volumes:
        - name: homepage-config
          configMap:
            name: homepage-config
        - name: homepage-icons
          configMap:
            name: homepage-icons
        # Synced from 1Password by External Secrets Operator
        # (manifests/external-secrets-config/homepage.yaml).
        - name: proxmox-credentials
          secret:
            secretName: homepage-proxmox-credentials
        - name: truenas-credentials
          secret:
            secretName: homepage-truenas-credentials
        - name: unifi-credentials
          secret:
            secretName: homepage-unifi-credentials
