# Custom icons not in homarr-labs/dashboard-icons. Mounted at
# /app/public/icons/ in deployment.yaml; reference as icon: /icons/<key>.
#
# binaryData (not data) since these are PNGs sourced from the real upstream
# projects, not hand-authored SVGs (2026-09-17, Jake picked the exact
# assets):
#   scrypted.png - install/icon.png from github.com/koush/scrypted (the
#     actual app icon, 256x256)
#   wled.png - assets/images/ui/akemi/001_cheerful.png from kno.wled.ge --
#     WLED's mascot "Akemi", 512x512. (WLED's other official graphics are
#     a wide pixel-art wordmark and a small abstract favicon mark, neither
#     as good a fit for a square tile as this.)
#   network-optimizer.png - docs/images/app-logo-v2.png from
#     github.com/Ozark-Connect/NetworkOptimizer -- turns out this Compose
#     app (see todo/READY.md's Compose migration notes) is a published project
#     with its own logo, not the bespoke no-icon-exists tool assumed
#     earlier. 522x319, not square -- will letterbox some in a square tile.
#   modbus.png - the Modbus Organization's own logo (main_logo.png from
#     modbus.org, the wordmark version, 500x200 -- sharper source than
#     their 144x144 square touch-icon crop of the same mark, so used this
#     one despite also needing to letterbox).
#   waveshare.png - avatar of github.com/waveshare (364x364), confirmed as
#     the real account before using it (company: "Waveshare Electronics",
#     blog: www.waveshare.com) since waveshare.com itself 403s on scripted
#     requests. For Modbus Relay, which is Waveshare hardware.
#
# Non-square logos (network-optimizer.png, modbus.png) need `object-fit:
# contain` on .service-icon img in custom.css or they'll stretch/distort to
# fill the square box instead of letterboxing cleanly — added there too.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-icons
  namespace: homepage
data: {}
binaryData:
  scrypted.png: 
  wled.png: 
  network-optimizer.png: 
  modbus.png: 
  waveshare.png: 
