# Homepage's own config files, one ConfigMap key per file. Mounted as a
# single whole-directory volume in deployment.yaml (not one subPath entry
# per file, which is how this originally shipped — subPath mounts don't
# pick up ConfigMap changes on a running pod at all, see the comment on that
# volumeMount) — every key here becomes a file at /app/config/<key>.
#
# All of them are mounted, even the ones we don't use (docker.yaml,
# bookmarks.yaml, custom.css/js) — found out the hard way (2026-09-16) that
# this isn't optional: `services.yaml`/`settings.yaml`/`bookmarks.yaml`/
# `widgets.yaml` ship pre-baked as defaults in the image, but `docker.yaml`
# doesn't, so Homepage lazily tries to *write* a default copy into
# /app/config on first use — which fails EACCES under this pod's
# ownership/securityContext and crash-loops the whole container
# (`checkAndCopyConfig` in src/utils/config/config.js calls
# `process.exit(1)` on that failure). Mounting an empty string for every
# config file up front means `existsSync` is always true and that code path
# never runs, matching the upstream example manifest we should have just
# copied verbatim here to begin with.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  # Four tabs per Jake's grouping (2026-09-17). Each group name here must
  # match a group in services.yaml exactly. Kept the row/4-column grid style
  # Jake already landed on for the single group; `header: false` since the
  # tab label itself already names the group, a repeated heading inside it
  # would be redundant.
  settings.yaml: |
    title: Homelab
    layout:
      Apps:
        tab: Apps
        style: row
        header: false
      Services:
        tab: Services
        style: row
        header: false
      Monitoring:
        tab: Monitoring
        style: row
        header: false
      Infrastructure:
        tab: Infrastructure
        style: row
        header: false

  # `mode: cluster` = discover via this pod's own ServiceAccount (see
  # clusterrole.yaml) rather than a mounted kubeconfig. `gateway: true` turns
  # on HTTPRoute discovery specifically — this cluster is Gateway-API-only
  # (no Ingress controller), so `ingress`/`traefik` are deliberately left off.
  # To opt an app already running in the cluster into auto-discovery instead
  # of a manual entry below, annotate its HTTPRoute:
  #   gethomepage.dev/enabled: "true"
  #   gethomepage.dev/name: "My App"
  #   gethomepage.dev/icon: "my-app.png"
  #   gethomepage.dev/description: "..."
  # Discovered services render in their own group, above the manual list
  # below, in whatever order the Kubernetes API returns them (not
  # alphabetical) — a known Homepage limitation, not something to chase here.
  kubernetes.yaml: |
    mode: cluster
    gateway: true

  # Manually-entered apps, alphabetical by name. This is deliberately a
  # snapshot of everything currently proxied by docker-compose/caddy/Caddyfile
  # plus the two apps already live in the cluster (ArgoCD, Authelia) — as
  # each Compose app migrates into the cluster per todo/READY.md's "Compose workload
  # migration" plan, delete its entry here and annotate its new HTTPRoute
  # instead (see kubernetes.yaml above) so it becomes self-maintaining.
  #
  # Icon names are homarr-labs/dashboard-icons slugs
  # (https://github.com/homarr-labs/dashboard-icons), verified to exist as of
  # 2026-09-15. Everything not in that set (Scrypted, Rack LED which runs
  # WLED, Network Optimizer, Modbus Controller which uses the Modbus
  # Organization's own logo, Modbus Relay which is Waveshare hardware so
  # uses Waveshare's logo) is a real icon sourced from its own upstream
  # project and baked into icons-configmap.yaml as of 2026-09-17 (see that
  # file's header for exactly where each came from), referenced here as
  # `/icons/<name>.png`.
  # Four groups matching the four tabs in settings.yaml.
  services.yaml: |
    - Apps:
        - Home Assistant:
            icon: home-assistant.png
            href: https://homeassistant.jakerobb.org
        - KVM:
            icon: glinet.png
            href: https://kvm.jakerobb.org
    - Services:
        - Authelia:
            icon: authelia.png
            href: https://auth.jakerobb.org
        - Change Detection:
            icon: changedetection.png
            href: https://changedetection.jakerobb.org
        - Modbus Controller:
            icon: /icons/modbus.png
            href: https://modbus.jakerobb.org
        - Modbus Relay:
            icon: /icons/waveshare.png
            href: https://modbus-relay.jakerobb.org
        - Rack LED:
            icon: /icons/wled.png
            href: https://rack-led.jakerobb.org
        - Scrypted:
            icon: /icons/scrypted.png
            href: https://scrypted.jakerobb.org
        - Z-Wave JS UI:
            icon: z-wave-js-ui.png
            href: https://zwave.jakerobb.org
        - Zigbee2MQTT:
            icon: zigbee2mqtt.png
            href: https://zigbee.jakerobb.org
    - Monitoring:
        - Grafana:
            icon: grafana.png
            href: https://grafana.jakerobb.org
        - InfluxDB:
            icon: influxdb.png
            href: https://influxdb.jakerobb.org
        - Logs:
            icon: victorialogs.png
            href: https://logs.jakerobb.org/select/vmui
        - Network Optimizer:
            icon: /icons/network-optimizer.png
            href: https://optimizer.jakerobb.org
        - NUT (UPS Monitoring):
            icon: nut.png
            href: https://nut.jakerobb.org
    - Infrastructure:
        # href and widget.url deliberately point at different places
        # (confirmed 2026-09-16): the tile *links* to HexOS's own dashboard
        # (deck.hexos.com — presumably the UI actually used day-to-day), but
        # the *widget* pulls data straight from the local TrueNAS SCALE API
        # (truenas.lan, plain HTTP) since that's what the API key authenticates
        # against — deck.hexos.com is a separate cloud portal, not something
        # this widget protocol could talk to even if desired.
        - HexOS/TrueNAS:
            icon: truenas-scale.png
            href: https://deck.hexos.com/dash
            widget:
              type: truenas
              url: http://truenas.lan
              version: 2
              key: "{{HOMEPAGE_FILE_TRUENAS_API_KEY}}"
              enablePools: true
              nasType: scale
        - Proxmox:
            icon: proxmox.png
            href: https://proxmox.lan:8006
            widget:
              type: proxmox
              url: https://proxmox.lan:8006
              username: "{{HOMEPAGE_FILE_PROXMOX_TOKEN_ID}}"
              password: "{{HOMEPAGE_FILE_PROXMOX_TOKEN_SECRET}}"
              node: proxmox
              fields:
                - resources.cpu
                - resources.mem
        - UniFi Gateway:
            icon: unifi.png
            href: https://gateway.jakerobb.org
            widget:
              type: unifi
              url: https://gateway.lan
              key: "{{HOMEPAGE_FILE_UNIFI_API_KEY}}"
              fields:
                - uptime
                - wan
                - lan
                - wlan
        - ArgoCD:
            icon: argo-cd.png
            href: https://argocd.jakerobb.org

  # Cluster/node widget reads the Kubernetes Metrics API (metrics-server,
  # argocd/apps/metrics-server/) via this pod's ServiceAccount — needs the
  # `metrics.k8s.io` rule in clusterrole.yaml. Same numbers as `kubectl top
  # nodes`. `href` makes the whole widget a link (any info widget supports
  # it, via the shared Container component) — to Headlamp here.
  #
  # Open-Meteo needs no API key/account (gethomepage.dev/widgets/info/openmeteo/).
  # Coordinates for zip 48864 (Okemos, MI).
  #
  # Search box: `custom` provider pointed at our own SearXNG
  # (argocd/apps/searxng/) instead of duckduckgo — SearXNG's own
  # `/search?q=` endpoint takes the same query-param shape any of the
  # built-in providers use. This is a plain browser navigation (target:
  # _blank), not an XHR, so the existing Authelia SSO session cookie
  # (domain: 'jakerobb.org', see argocd/apps/authelia/application.yaml)
  # covers it with no extra login. Deliberately not setting
  # showSearchSuggestions/suggestionUrl: that's a same-origin XHR fetch from
  # home.jakerobb.org to search.jakerobb.org, which would need both CORS
  # headers on SearXNG (doesn't send any by default) and
  # `credentials: include` support from Homepage's own fetch call to carry
  # the SSO cookie cross-subdomain — not worth the complexity for
  # autocomplete alone.
  widgets.yaml: |
    - search:
        provider: custom
        url: https://search.jakerobb.org/search?q=
        target: _blank
    - openmeteo:
        label: Okemos, MI
        latitude: 42.704994
        longitude: -84.402071
        timezone: America/New_York
        units: imperial
        cache: 5
    - kubernetes:
        href: https://headlamp.jakerobb.org
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: cluster
        nodes:
          show: false

  bookmarks.yaml: ""
  docker.yaml: ""
  proxmox.yaml: ""

  # Fixed physical width, CSS `in` is a real valid unit (96px/in by spec):
  # 2in desktop, 1in under 640px (Tailwind's `sm` breakpoint).
  #
  # The messy sideways layout (2026-09-17 screenshot) was a structural bug,
  # not a sizing one: .service-card has TWO children stacked in the actual
  # DOM — .service-title (icon+name) AND, when a widget is attached,
  # .service-container (the CPU/MEM/etc pills, or the red API-error badge —
  # both siblings of .service-title, not nested inside it, per
  # src/components/services/{item,widget/container}.jsx). Setting
  # flex-direction:column on .service-title alone only stacked the icon+name
  # *within themselves*; .service-card itself was still a default row, so it
  # laid the icon+name block and the widget-pills block side by side. Fixed
  # by making .service-card the column container instead. Also switched
  # height to min-height: fixed height clipped/overflowed on any tile with
  # widget data, which is taller than an icon-only tile — genuinely needs
  # more room, not a bug to fight.
  # Icons at 3x (0.8in -> 2.4in / 0.4in -> 1.2in) per Jake's request
  # (2026-09-17) — flagging directly rather than silently deciding: 2.4in is
  # wider than the 2in tile itself, so the icon will overflow/dominate the
  # box at this size. Left the tile width alone since that wasn't part of
  # the ask; first thing to try if it looks broken is bumping .service-card
  # width up to something like 3in to match.
  #
  # .service-container (the widget-pills row) explicitly stretched via
  # align-self — .service-card's align-items: center (needed to center
  # .service-title, which should shrink-wrap, not stretch) would otherwise
  # also shrink the pills row to its own content width instead of spanning
  # full tile width like Jake wants.
  # Theme-aware overrides (2026-09-18): Homepage toggles a literal `light`/
  # `dark` class on <html> (src/utils/contexts/theme.jsx, persisted in
  # localStorage) — not a media query, and not the --color-N variables in
  # its own theme.css (those vary by color-theme selection like
  # slate/gray/white, a separate setting; light/dark there is baked into
  # which Tailwind dark: class each component uses at build time, not a
  # variable we can hook into). So: structural rules (size/layout) stay
  # unscoped since they're the same either way; only color declarations are
  # split into html.light/html.dark blocks. Dark-mode colors below are a
  # first guess (can't render-check them myself) — tune freely.
  custom.css: |
    .container {
      border-width: 1px;
      border-radius: 16px;
      margin: 10px auto;
    }
    html.light .container {
      background-color: #FCFCFC;
    }
    html.dark .container {
      background-color: #11111A;
    }

    html.light #tabs ul {
      background-color: #EAF2FF;
      border-width: 1px;
    }
    
    html.light #tabs button[aria-selected="true"] {
      background-color: #C8E1FF;
    }
    
    #tabs button[aria-selected="true"] {
      font-weight: bold;
    }
    
    /* Overrides the <ul class="services-list"> Homepage renders per group
       (src/components/services/list.jsx) — normally either a fixed
       `grid grid-cols-N` (layout.style: row + columns: N) or a plain
       vertical list. Neither flows based on available width. Forcing
       flex-wrap here makes the actual number of tiles per row purely a
       function of container width vs. .service-card's own fixed width, so
       layout.columns in settings.yaml no longer matters — style: row can
       stay (harmless) or go, your call, but columns is now a no-op. */
    .services-list {
      display: flex !important;
      flex-wrap: wrap !important;
      gap: 0.5rem;
    }
    .service-card {
      width: 3in;
      min-height: 2in;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      border-width: 1px;
    }
    html.light .service-card {
      border-color: #2A2F44;
      background-color: #F5FAFF;
    }
    html.dark .service-card {
      border-color: #2A3F55;
      background-color: #11192A;
    }
    .service-title {
      flex-direction: column !important;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    
    .service-icon, .service-icon img, .service-icon div {
      width: 2.0in !important;
      height: 2.0in !important;
    }
    /* Non-square source images (network-optimizer.png, modbus.png — see
       icons-configmap.yaml) would otherwise stretch to fill the forced
       square box above and distort. contain letterboxes them instead;
       no effect on the square ones. */
    .service-icon img {
      object-fit: contain !important;
    }
    .service-name {
      text-align: center;
      padding-top: 0.5rem;
    }
    .service-container {
      align-self: stretch;
      width: 100%;
      margin-top: auto;
    }

    @media (max-width: 640px) {
      .service-card {
        width: 1in;
        min-height: 1in;
      }
      .service-icon, .service-icon img, .service-icon div {
        width: 0.8in !important;
        height: 0.8in !important;
      }
      .service-name {
        font-size: 0.7rem;
        padding-top: 0.25rem;
      }
    }
  custom.js: ""
