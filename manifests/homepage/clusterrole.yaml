# Trimmed from Homepage's own published RBAC example
# (https://gethomepage.dev/installation/k8s/) to what this cluster actually
# uses: Gateway API only (the cluster deliberately has no Ingress controller
# and no Traefik — see talos/README.md#ingress-gateway-api-decided-and-deployed-2026-09-13),
# so the upstream example's `traefik.io/ingressroutes` rule is dropped.
# `networking.k8s.io/ingresses`, despite that, is kept: Homepage's discovery
# code unconditionally lists Ingresses on startup regardless of the
# `gateway`/`ingress` toggles in kubernetes.yaml — found live 2026-09-16 as a
# `403 Forbidden` in the logs (non-fatal, just noisy) after trimming it.
# `metrics.k8s.io` backs the cluster/node resource widget in widgets.yaml
# (configmap.yaml) — served by metrics-server (argocd/apps/metrics-server/).
#
# Read-only (get/list) everywhere; Homepage never needs to mutate cluster
# state, only enumerate it for discovery + the cluster widget.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
rules:
  - apiGroups: [""]
    # `services` isn't required by the gateway-only discovery path below, but
    # is cheap to include for future flexibility (e.g. a Service with no
    # HTTPRoute in front of it).
    resources: [namespaces, pods, nodes, services]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes, gateways]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
