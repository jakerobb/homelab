# Explicit, labeled Namespace rather than relying on CreateNamespace=true —
# applied by homepage's own Application (argocd/apps/homepage/application.yaml)
# alongside the rest of this directory.
#
# No PodSecurity override needed here, unlike local-path-provisioner/
# democratic-csi: Homepage's pod runs fully non-root with all capabilities
# dropped (see deployment.yaml), so it's happy under the cluster's default
# `baseline` enforcement.
apiVersion: v1
kind: Namespace
metadata:
  name: homepage
