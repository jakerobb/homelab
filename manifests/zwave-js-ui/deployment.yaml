# Bare Deployment, no Helm chart: single container, no per-environment variation
# (same reasoning as ntfy/deployment.yaml).
#
# Migrated from the docker-compose `zwave-js-ui` service on rpi5-1. The Z-Wave
# controller is a network-attached radio at tcp://192.168.102.20:6638 (in
# settings.json), so nothing is hardware-pinned.
#
# The `restore` init container does two jobs:
#   1. On a store that hasn't been restored yet, it WAITS until a marker file
#      (/store/.restored) appears. Without this the app would start against an empty
#      cache and re-interview every node. The cutover runbook in argocd/README.md
#      streams the old store in with `kubectl exec -c restore` and then creates the marker.
#   2. Seeds settings.json from the ConfigMap if it isn't there yet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zwave-js-ui
  namespace: zwave-js-ui
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    # Not RollingUpdate: the store PVC is ReadWriteOnce, and two instances talking
    # to one controller would fight over its single TCP connection.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: zwave-js-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zwave-js-ui
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: restore
          image: busybox:1.38.0
          command:
            - sh
            - -c
            - |
              if [ ! -e /store/.restored ]; then
                echo "Waiting for the old store to be restored (see argocd/README.md, zwave-js-ui cutover)..."
                until [ -e /store/.restored ]; do sleep 5; done
              fi
              if [ ! -e /store/settings.json ]; then
                echo "Seeding settings.json"
                cp /seed/settings.json /store/settings.json
              fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - mountPath: /store
              name: store
            - mountPath: /seed
              name: seed
              readOnly: true
      containers:
        - name: zwave-js-ui
          image: zwavejs/zwave-js-ui:11.24.3
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: America/Detroit
            # The security keys come from the ExternalSecret and override whatever
            # settings.json holds.
            - name: KEY_S0_Legacy
              valueFrom:
                secretKeyRef:
                  name: zwave-js-ui-security-keys
                  key: S0_Legacy
            - name: KEY_S2_Unauthenticated
              valueFrom:
                secretKeyRef:
                  name: zwave-js-ui-security-keys
                  key: S2_Unauthenticated
            - name: KEY_S2_Authenticated
              valueFrom:
                secretKeyRef:
                  name: zwave-js-ui-security-keys
                  key: S2_Authenticated
            - name: KEY_S2_AccessControl
              valueFrom:
                secretKeyRef:
                  name: zwave-js-ui-security-keys
                  key: S2_AccessControl
            - name: KEY_LR_S2_Authenticated
              valueFrom:
                secretKeyRef:
                  name: zwave-js-ui-security-keys
                  key: LR_S2_Authenticated
            - name: KEY_LR_S2_AccessControl
              valueFrom:
                secretKeyRef:
                  name: zwave-js-ui-security-keys
                  key: LR_S2_AccessControl
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8091
            - name: ws
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - mountPath: /usr/src/app/store
              name: store
      volumes:
        - name: store
          persistentVolumeClaim:
            claimName: zwave-js-ui-store
        - name: seed
          configMap:
            name: zwave-js-ui-seed
