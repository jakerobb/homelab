# Z-Wave JS UI. Web UI through the Gateway; the WebSocket server (ClusterIP :3000) is
# used by Home Assistant, which runs on hostNetwork; the controller is a network radio at 192.168.102.20:6638.
#
# Default-deny both directions, then only the flows below. Gateway traffic
# (Authelia forward-auth and the proxied request) arrives as Cilium's `ingress`
# entity when Envoy and the pod share a node, and as `remote-node` when they
# don't; a standard NetworkPolicy can't match either, hence CiliumNetworkPolicy.
# Kubelet probes come from the node (`host`), which Cilium always allows. See
# argocd/README.md's "NetworkPolicies" section for the whole scheme and how to
# debug a drop (`hubble observe --verdict DROPPED`).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: zwave-js-ui
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: zwave-js-ui
  namespace: zwave-js-ui
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - ingress
        - remote-node
        - host
      toPorts:
        - ports:
            - port: '8091'
              protocol: TCP
    - fromEntities:
        - world
        - remote-node
        - host
      toPorts:
        - ports:
            - port: '3000'
              protocol: TCP
  egress:
    - toCIDR:
        - 192.168.102.20/32
      toPorts:
        - ports:
            - port: '6638'
              protocol: TCP
