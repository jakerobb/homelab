# Z-Wave JS server WebSocket (port 3000), which Home Assistant's Z-Wave integration
# connects to. Home Assistant runs in the cluster, so this is a plain ClusterIP Service:
# point it at ws://zwave-js-ui-ws.zwave-js-ui.svc.cluster.local:3000. (It used to be a
# pinned LoadBalancer VIP, 192.168.102.132, published as zwave-ws.jakerobb.org, back when
# Home Assistant was still in Compose on rpi5-1; dropped 2026-10-10.) The server has no
# authentication.
apiVersion: v1
kind: Service
metadata:
  name: zwave-js-ui-ws
  namespace: zwave-js-ui
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: zwave-js-ui
  ports:
    - name: ws
      port: 3000
      targetPort: ws
