# scfg format — see https://git.xenrox.net/~xenrox/ntfy-alertmanager/tree/master/item/config.scfg
# for the full annotated example this is trimmed from.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-alertmanager-config
  namespace: monitoring
data:
  config: |
    http-address :8080
    log-level info

    # Alerts sharing a group_by key (see kube-prometheus-stack's Alertmanager
    # route config) arrive as one Alertmanager webhook call — send them as
    # one combined ntfy message rather than one notification per alert.
    alert-mode multi

    labels {
        order "severity"

        severity "critical" {
            priority 5
            tags "rotating_light"
        }
        severity "warning" {
            priority 3
            tags "warning"
        }
        severity "none" {
            priority 1
        }
    }

    resolved {
        tags "white_check_mark"
        priority 2
    }

    ntfy {
        # Replaces the default multi-alert body, which dumps every label and
        # annotation of every alert. ntfy rejects bodies over 4 KB (it
        # would store them as an attachment, which is disabled), so a
        # group of 7+ alerts — e.g. every ExternalSecret failing at once in
        # the 2026-09-29 1Password outage — was never delivered at all.
        template-path /etc/ntfy-alertmanager/body.tmpl
        # In-cluster Service DNS, not the public https://ntfy.jakerobb.org
        # hostname — keeps this off the Gateway/DNS/TLS chain entirely, so a
        # problem with any of those can't also take out alert delivery.
        server http://ntfy.ntfy.svc.cluster.local:8080
        topic homelab-alerts
    }
  # One line per alert — the most specific identifier available, then the
  # summary (falling back to description/message) — capped at 10 alerts so
  # the body stays far below ntfy's 4 KB limit however large the group gets.
  # `url` is the label SigNoz's packet-loss alert groups by; an alert with none
  # of these labels (SigNoz rules that aggregate everything away) needs a
  # `name` label of its own, or the line starts with "?". The title already
  # carries status, count, alertname and namespace for Prometheus alerts; for
  # SigNoz's it's the webhook's group label values (the rule's UUID).
  body.tmpl: |
    {{- range $i, $a := .Alerts }}{{ if lt $i 10 }}
    - {{ or $a.Labels.name $a.Labels.pod $a.Labels.persistentvolumeclaim $a.Labels.node $a.Labels.instance $a.Labels.url $a.Labels.namespace "?" }}: {{ or $a.Annotations.summary $a.Annotations.description $a.Annotations.message }}
    {{- end }}{{ end }}
    {{ if gt (len .Alerts) 10 }}
    (showing 10 of {{ len .Alerts }})
    {{- end }}
