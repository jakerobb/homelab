# Bridges Alertmanager's fixed webhook JSON schema to ntfy's publish API —
# see argocd/README.md's kube-prometheus-stack section for why this exists:
# Alertmanager's webhook_configs receiver can't template its POST body, so
# pointing it at ntfy directly doesn't work (ntfy would try to parse
# Alertmanager's JSON as its own publish schema and reject it). No official
# Helm chart, single Deployment — same "bare manifest" call as
# glance/ntfy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy-alertmanager
  namespace: monitoring
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # Small and stateless: the pod started in about 1s when last measured (2026-10-18).
  # 60s covers a cold image pull and turns a rollout that can't finish into a
  # Degraded app in a minute.
  progressDeadlineSeconds: 60
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: ntfy-alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ntfy-alertmanager
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ntfy-alertmanager
          image: xenrox/ntfy-alertmanager:1.0.1
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/ntfy-alertmanager/config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          # /health answers "OK" without calling ntfy, so an ntfy outage doesn't
          # take this pod out of the Service (Alertmanager retries on its own).
          # `/` is 405 (POST only), so it isn't a usable probe path. Without a
          # readiness probe the pod was Ready the moment its container started.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - mountPath: /etc/ntfy-alertmanager
              name: config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: ntfy-alertmanager-config
