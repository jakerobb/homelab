# Scrapes cert-manager's controller (metrics port 9402). Until this existed, no
# certificate metric reached Prometheus, so nothing could warn that the
# wildcard certificate (the TLS for every app behind the Gateway) had failed
# to renew. A PodMonitor rather than the chart's ServiceMonitor option, so no
# change to the cert-manager chart (and no restart of cert-manager). Only the
# controller: it's the component that exports the certificate metrics.
#
# Needs the ingress rule in manifests/network-policies/cert-manager.yaml, or the
# namespace's default-deny drops the scrape. Picked up by Prometheus without
# label matching; the scrape job is "cert-manager/cert-manager".
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
      app.kubernetes.io/component: controller
  podMetricsEndpoints:
    - port: http-metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 10s
