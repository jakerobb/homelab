# Bare Deployment, no Helm chart: single container, no per-environment variation
# (same reasoning as ntfy/deployment.yaml).
#
# Migrated from the docker-compose `scrypted` service on rpi5-1. It exposes two UniFi cameras
# (Doorbell, Garage) to HomeKit, with HomeKit Secure Video, through the unifi-protect,
# prebuffer-mixin, snapshot, webrtc and homekit plugins.
#
# Image pinned to the version Compose ran (v0.147.0-noble-full) on purpose, so the move changes
# the host and nothing else. Let Renovate bump it afterwards.
#
# hostNetwork, like the Compose version's `network_mode: host`. Each camera is a HomeKit
# accessory on its own port, advertised over mDNS (the built-in advertiser; SCRYPTED_DOCKER_AVAHI
# isn't set, so no avahi or dbus is involved), which doesn't cross the pod network. The
# IoT/Cloud IoT -> Server mDNS reflection is the UniFi gateway's mDNS proxy.
#
# No nodeAffinity: any worker will do. HomeKit controllers find accessories by mDNS service
# name, not IP, so a reschedule should only cost a few minutes of "No Response" in Apple Home.
#
# Runs as root: the image's s6 init needs it (the Compose container did too). Capabilities are
# left at the runtime default. The Compose version wasn't privileged either.
#
# The `restore` init container WAITS until /server/volume/.restored exists, then exits. Starting
# on an empty volume would create a fresh Scrypted with new HomeKit identities, next to the
# ones the Apple devices are paired to. The cutover script
# (scripts/scrypted-cutover/restore.sh) copies the old volume in and only then creates the
# marker.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrypted
  namespace: scrypted
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    # Not RollingUpdate: the data PVC is ReadWriteOnce, and two instances would fight over
    # the HomeKit identities and ports.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scrypted
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scrypted
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Scrypted writes scrypted.db on shutdown.
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: restore
          image: busybox:1.38.0
          command:
            - sh
            - -c
            - |
              if [ ! -e /server/volume/.restored ]; then
                echo "Waiting for the old volume to be restored (see argocd/README.md, scrypted cutover)..."
                until [ -e /server/volume/.restored ]; do sleep 5; done
              fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - mountPath: /server/volume
              name: data
      containers:
        - name: scrypted
          image: koush/scrypted:v0.147.0-noble-full
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: America/Detroit
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 11080
          # The login page is served without authentication.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            # ~850Mi on the Pi with two cameras, most of it plugin processes.
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 2560Mi
          volumeMounts:
            - mountPath: /server/volume
              name: data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: scrypted-data
