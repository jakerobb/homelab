# Kustomize for the configMapGenerator: the exporter reads blackbox.yml only at
# startup, and the generator's content-hash suffix rolls the pod automatically
# whenever it changes. Old hash-suffixed ConfigMaps get cleaned up by the
# Application's `prune: true`. Same pattern as nut-exporter's.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml
  - probes.yaml
  - prometheusrule.yaml
configMapGenerator:
  - name: blackbox-exporter-config
    files:
      - blackbox.yml
