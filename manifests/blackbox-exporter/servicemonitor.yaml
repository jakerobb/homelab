# The exporter's own metrics (job "blackbox-exporter"), so the chart's TargetDown
# alert covers the exporter itself. Picked up by Prometheus without label
# matching. The probe results are separate, from probes.yaml.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: blackbox-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: blackbox-exporter
  endpoints:
    - port: http
      path: /metrics
      interval: 60s
