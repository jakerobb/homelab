# ClusterIP only — this only ever receives from SigNoz's webhook channel, never
# from outside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: signoz-alert-relay
  namespace: monitoring
spec:
  selector:
    app.kubernetes.io/name: signoz-alert-relay
  ports:
    - name: http
      port: 8080
      targetPort: http
