# Headless Chromium for the watches that need JavaScript rendered. It has no authentication
# (no TOKEN), so the protection is the network: the Service is a ClusterIP and
# networkpolicy.yaml allows ingress from the change-detection pod only, and egress to public
# addresses only, so nothing that reaches it can pivot to the LAN. The image's own user
# (blessuser) runs Chromium without its sandbox, as in Compose, so it needs no privileges.
#
# /dev/shm is an emptyDir because the container default (64Mi) crashes Chromium on heavy
# pages. The root filesystem stays writable: the image writes under /usr/src/app and /tmp.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: browserless
  namespace: change-detection
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: browserless
  template:
    metadata:
      labels:
        app.kubernetes.io/name: browserless
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: browserless
          image: ghcr.io/browserless/chromium:v2.57.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SCREEN_WIDTH
              value: "1920"
            - name: SCREEN_HEIGHT
              value: "1024"
            - name: SCREEN_DEPTH
              value: "16"
            - name: ENABLE_DEBUGGER
              value: "false"
            - name: TIMEOUT
              value: "60000"
            # Three watches use it, one at a time in practice; Compose's 10 was a leftover from
            # the UniFi store watches.
            - name: CONCURRENT
              value: "3"
            - name: NO_COLOR
              value: "1"
            - name: FORCE_COLOR
              value: "0"
            - name: DEBUG_COLORS
              value: "no"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: ws
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: ws
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: ws
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - mountPath: /dev/shm
              name: shm
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
