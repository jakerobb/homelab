# changedetection.io's web UI at changedetection.jakerobb.org. Gated by Authelia forward-auth
# (the app also has its own password, as a second layer): its UI can fetch arbitrary URLs.
#
# Needs this namespace's entry in argocd/apps/authelia/referencegrant.yaml; the access_control
# rule for changedetection.jakerobb.org in argocd/apps/authelia/application.yaml already exists.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: change-detection
  namespace: change-detection
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: gateway-system
  hostnames:
    - changedetection.jakerobb.org
  rules:
    - filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              group: ""
              kind: Service
              name: authelia
              namespace: authelia
              port: 80
            http:
              path: /api/authz/ext-authz/
              allowedHeaders:
                - authorization
                - proxy-authorization
                - cookie
                - accept
                - host
                - x-forwarded-proto
                - x-forwarded-for
              allowedResponseHeaders:
                - remote-user
                - remote-groups
                - remote-name
                - remote-email
      backendRefs:
        - name: change-detection
          port: 5000
