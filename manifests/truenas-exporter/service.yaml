# Cluster-internal only (no HTTPRoute) — Prometheus is the only consumer.
apiVersion: v1
kind: Service
metadata:
  name: truenas-exporter
  namespace: truenas-exporter
  labels:
    app.kubernetes.io/name: truenas-exporter
spec:
  selector:
    app.kubernetes.io/name: truenas-exporter
  ports:
    - name: http
      port: 8080
      targetPort: http
