# truenas-exporter: websocket API at truenas.lan (192.168.102.33).
#
# Default-deny both directions, then only the flows below. Gateway traffic
# (Authelia forward-auth and the proxied request) arrives as Cilium's `ingress`
# entity when Envoy and the pod share a node, and as `remote-node` when they
# don't; a standard NetworkPolicy can't match either, hence CiliumNetworkPolicy.
# Kubelet probes come from the node (`host`), which Cilium always allows. See
# argocd/README.md's "NetworkPolicies" section for the whole scheme and how to
# debug a drop (`hubble observe --verdict DROPPED`).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: truenas-exporter
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: truenas-exporter
  namespace: truenas-exporter
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: '53'
              protocol: UDP
            - port: '53'
              protocol: TCP
    - toCIDR:
        - 192.168.102.33/32
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP
