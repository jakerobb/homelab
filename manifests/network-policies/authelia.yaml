# Authelia. Only the Gateway calls it (forward-auth and the OIDC endpoints); it has no outbound needs
# (file notifier, local SQLite).
#
# Default-deny both directions, then only the flows below. Gateway traffic
# (Authelia forward-auth and the proxied request) arrives as Cilium's `ingress`
# entity when Envoy and the pod share a node, and as `remote-node` when they
# don't; a standard NetworkPolicy can't match either, hence CiliumNetworkPolicy.
# Kubelet probes come from the node (`host`), which Cilium always allows. See
# argocd/README.md's "NetworkPolicies" section for the whole scheme and how to
# debug a drop (`hubble observe --verdict DROPPED`).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: authelia
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authelia
  namespace: authelia
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - ingress
        - remote-node
        - host
      toPorts:
        - ports:
            - port: '9091'
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: '53'
              protocol: UDP
            - port: '53'
              protocol: TCP
