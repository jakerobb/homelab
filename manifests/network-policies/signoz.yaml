# SigNoz, ClickHouse, ZooKeeper, the otel collector and the k8s-infra agents. Inside the namespace anything
# may talk to anything. Outside: the Gateway reaches the UI (8080) and OTLP ingest (4318); the collector
# federates Prometheus; alerts go to ntfy-alertmanager; the agents read the API server and kubelets (10250
# on the node IPs).
#
# Default-deny both directions, then only the flows below. Gateway traffic
# (Authelia forward-auth and the proxied request) arrives as Cilium's `ingress`
# entity when Envoy and the pod share a node, and as `remote-node` when they
# don't; a standard NetworkPolicy can't match either, hence CiliumNetworkPolicy.
# Kubelet probes come from the node (`host`), which Cilium always allows. See
# argocd/README.md's "NetworkPolicies" section for the whole scheme and how to
# debug a drop (`hubble observe --verdict DROPPED`).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: signoz
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: signoz
  namespace: signoz
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: signoz
    - fromEntities:
        - ingress
        - remote-node
        - host
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP
            - port: '4318'
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: '53'
              protocol: UDP
            - port: '53'
              protocol: TCP
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: signoz
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: '10250'
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: '9090'
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: ntfy-alertmanager
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP
---
# ClickHouse's `signoz-clickhouse-udf-init` init container downloads the histogram-quantile binary from GitHub
# on every pod start (wget from github.com, which redirects to release-assets.githubusercontent.com). Under
# default-deny that fails, and the pod sits in Init:Error until it's allowed: it bit on 2026-10-08, the first
# time the pod restarted after the policies landed. So the ClickHouse pods may reach just those hosts on 443.
# toFQDNs only works when Cilium's DNS proxy sees the lookups, hence the `rules.dns` on the DNS rule. That makes the
# lookups from these pods go through the proxy; the pattern allows every name, so it filters nothing itself.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: signoz-clickhouse-init-egress
  namespace: signoz
spec:
  endpointSelector:
    matchLabels:
      clickhouse.altinity.com/chi: signoz-clickhouse
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: '53'
              protocol: UDP
            - port: '53'
              protocol: TCP
          rules:
            dns:
              - matchPattern: '*'
    - toFQDNs:
        - matchName: github.com
        - matchName: release-assets.githubusercontent.com
        - matchName: objects.githubusercontent.com
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP
