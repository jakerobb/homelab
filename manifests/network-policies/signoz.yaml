# SigNoz, ClickHouse, ZooKeeper, the otel collector and the k8s-infra agents. Inside the namespace anything
# may talk to anything. Outside: the Gateway reaches the UI (8080) and OTLP ingest (4318); the collector
# federates Prometheus; alerts go to ntfy-alertmanager; the agents read the API server and kubelets (10250
# on the node IPs).
#
# Default-deny both directions, then only the flows below. Gateway traffic
# (Authelia forward-auth and the proxied request) arrives as Cilium's `ingress`
# entity, which a standard NetworkPolicy can't match, hence CiliumNetworkPolicy.
# Kubelet probes come from the node (`host`), which Cilium always allows. See
# argocd/README.md's "NetworkPolicies" section for the whole scheme and how to
# debug a drop (`hubble observe --verdict DROPPED`).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: signoz
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: signoz
  namespace: signoz
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: signoz
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP
            - port: '4318'
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: '53'
              protocol: UDP
            - port: '53'
              protocol: TCP
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: signoz
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: '10250'
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: '9090'
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: ntfy-alertmanager
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP
