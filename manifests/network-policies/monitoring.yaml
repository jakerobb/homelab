# kube-prometheus-stack (Prometheus, Alertmanager, operator, kube-state-metrics), ntfy-alertmanager and the blackbox exporter.
# Node-exporter is hostNetwork, so no pod policy applies to it.
#
# Default-deny both directions, then only the flows below. Gateway traffic
# (Authelia forward-auth and the proxied request) arrives as Cilium's `ingress`
# entity when Envoy and the pod share a node, and as `remote-node` when they
# don't; a standard NetworkPolicy can't match either, hence CiliumNetworkPolicy.
# Kubelet probes come from the node (`host`), which Cilium always allows. See
# argocd/README.md's "NetworkPolicies" section for the whole scheme and how to
# debug a drop (`hubble observe --verdict DROPPED`).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Everything in the namespace: talk to each other and to the API server (the operator, kube-state-metrics
# and the config reloaders), receive the API server's admission-webhook calls, and receive the Gateway on
# Prometheus (9090) and Alertmanager (9093). SigNoz federates Prometheus (9090) and sends alerts to
# ntfy-alertmanager (8080). Glance queries Prometheus (9090) for its Kubernetes widget. ntfy-alertmanager pushes to ntfy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: monitoring
  namespace: monitoring
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
    - fromEntities:
        - kube-apiserver
        - remote-node
        - host
      toPorts:
        - ports:
            - port: '10250'
              protocol: TCP
    - fromEntities:
        - ingress
        - remote-node
        - host
      toPorts:
        - ports:
            - port: '9090'
              protocol: TCP
            - port: '9093'
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: signoz
      toPorts:
        - ports:
            - port: '9090'
              protocol: TCP
            - port: '8080'
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: glance
      toPorts:
        - ports:
            - port: '9090'
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: '53'
              protocol: UDP
            - port: '53'
              protocol: TCP
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ntfy
            app.kubernetes.io/name: ntfy
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP
---
# Prometheus scrapes every ServiceMonitor target in the cluster, the kubelets, node-exporters (hostNetwork),
# the API server and etcd, so it may reach anything in-cluster. Outside the cluster it gets only the two static
# scrape targets in the chart values: Telegraf on the MBP (192.168.102.9:9273) and the Proxmox host's
# node-exporter (192.168.102.21:9100).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus-scrape
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  egress:
    - toEntities:
        - cluster
    - toCIDR:
        - 192.168.102.9/32
      toPorts:
        - ports:
            - port: '9273'
              protocol: TCP
    - toCIDR:
        - 192.168.102.21/32
      toPorts:
        - ports:
            - port: '9100'
              protocol: TCP
---
# Alertmanager's Watchdog heartbeat: a webhook POST to Healthchecks.io's ping host every 5 minutes (the
# dead-man's-switch in argocd/README.md). The only thing Alertmanager reaches outside the cluster. Under the
# default-deny above it needs this rule, or the pings never leave and Healthchecks.io emails that they've
# stopped. toFQDNs only works when Cilium's DNS proxy sees the lookups, hence the `rules.dns` on the DNS rule,
# as in signoz-clickhouse-init-egress; the pattern allows every name, so it filters nothing itself.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: alertmanager-healthchecks
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: '53'
              protocol: UDP
            - port: '53'
              protocol: TCP
          rules:
            dns:
              - matchPattern: '*'
    - toFQDNs:
        - matchName: hc-ping.com
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP
---
# The blackbox exporter probes the public hostnames from inside the cluster
# (manifests/blackbox-exporter/), so it has to reach the Gateway on 443 like a client
# does. Same two rules as radar's: `ingress` when Cilium's Envoy runs on the same
# node as the pod, and the Gateway's address when it doesn't. DNS and the rest of the
# namespace are already allowed by the `monitoring` policy above; Prometheus reaches
# the exporter as a member of this namespace.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: blackbox-exporter
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: blackbox-exporter
  egress:
    - toEntities:
        - ingress
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP
    - toCIDR:
        - 192.168.102.128/32
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP
