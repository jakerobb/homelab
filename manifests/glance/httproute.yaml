# Gated by Authelia forward-auth (the ExternalAuth filter, same pattern as
# searxng/httproute.yaml) — Glance's own built-in auth is off (no `auth:` block in glance.yml), since
# a second login in front of an already-SSO'd dashboard would just be
# friction.
#
# Requires a matching ReferenceGrant entry in the `authelia` namespace (see
# argocd/apps/authelia/referencegrant.yaml) and an `access_control` rule for
# home.jakerobb.org in Authelia's config (see
# argocd/apps/authelia/application.yaml) — without either, this route either
# fails to program or falls through to Authelia's default_policy (deny).
#
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: glance
  namespace: glance
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: gateway-system
  hostnames:
    - home.jakerobb.org
  rules:
    - filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              group: ""
              kind: Service
              name: authelia
              namespace: authelia
              port: 80
            http:
              path: /api/authz/ext-authz/
              allowedHeaders:
                - authorization
                - proxy-authorization
                - cookie
                - accept
                - host
                - x-forwarded-proto
                - x-forwarded-for
              allowedResponseHeaders:
                - remote-user
                - remote-groups
                - remote-name
                - remote-email
      backendRefs:
        - name: glance
          port: 8080
