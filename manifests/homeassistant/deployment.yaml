# Bare Deployment, no Helm chart: single container, no per-environment variation
# (same reasoning as ntfy/deployment.yaml).
#
# Migrated from the docker-compose `homeassistant` service on rpi5-1.
#
# Image pinned to the version Compose ran (2026.9.4) on purpose: Home Assistant upgrades the
# recorder database and .storage on first start, and that can't be undone. Moving hosts and
# versions in one step would leave no clean rollback. Let Renovate bump it afterwards.
#
# hostNetwork, like the Compose version's `network_mode: host`. HomeKit bridges (21064-21076,
# advertised over mDNS), and discovery of Apple TV, HEOS, Denon (SSDP), Lutron, ESPHome, WLED,
# Nanoleaf, SMLIGHT and the printer all rely on LAN multicast, which doesn't cross the pod
# network. The IoT/Cloud IoT -> Server mDNS reflection is the UniFi gateway's mDNS proxy.
#
# No nodeAffinity: any worker will do. HomeKit controllers find bridges by mDNS service name,
# not IP, so a reschedule should only cost a few minutes of "No Response" in Apple Home.
#
# Runs as root: the official image's s6 init needs it (the Compose container did too).
# Capabilities are left at the runtime default (CAP_NET_RAW matters for some integrations).
# Dropped from the Compose version: `privileged`, /dev/ttyAMA0 and /dev/serial0 (the Pi's
# GPIO UART, for an integration that never worked), /run/dbus (Bluetooth, unused), and the
# OFFICE_UPS_NUT_PASSWORD variable (the NUT integration keeps its credentials in
# .storage/core.config_entries; nothing in the YAML config reads it).
#
# The `restore` init container WAITS until /config/.restored exists, then exits. Starting on
# an empty /config would create a fresh Home Assistant (onboarding screen, no integrations)
# and, worse, new HomeKit bridge identities next to the ones the Apple devices are paired to.
# The cutover script (scripts/homeassistant-cutover/restore.sh) copies the old config in and
# only then creates the marker.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
  namespace: homeassistant
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    # Not RollingUpdate: the config PVC is ReadWriteOnce, and two instances would fight over
    # the HomeKit ports and the SQLite database.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: homeassistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homeassistant
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Home Assistant writes the recorder database and .storage on shutdown.
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: restore
          image: busybox:1.38.0
          command:
            - sh
            - -c
            - |
              if [ ! -e /config/.restored ]; then
                echo "Waiting for the old config to be restored (see argocd/README.md, homeassistant cutover)..."
                until [ -e /config/.restored ]; do sleep 5; done
              fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - mountPath: /config
              name: config
      containers:
        - name: homeassistant
          image: ghcr.io/home-assistant/home-assistant:2026.9.4
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: America/Detroit
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8123
          # /manifest.json is served without authentication.
          startupProbe:
            httpGet:
              path: /manifest.json
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /manifest.json
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /manifest.json
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            # ~640Mi on the Pi.
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - mountPath: /config
              name: config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: homeassistant-config
