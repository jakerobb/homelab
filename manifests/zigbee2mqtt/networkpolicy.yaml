# Zigbee2MQTT. Web UI through the Gateway; MQTT to the in-cluster Mosquitto; the coordinator is a
# network radio at 192.168.102.4:6638. Egress to raw.githubusercontent.com:443 is for OTA firmware:
# Zigbee2MQTT downloads the zigbee-OTA index and images from there, and without it HA's "update"
# buttons for Zigbee devices fail with "fetch failed". The FQDN rule only works with `rules.dns` on
# the DNS rule beside it (see the FQDN note in argocd/README.md's "NetworkPolicies" section).
#
# Default-deny both directions, then only the flows below. Gateway traffic
# (Authelia forward-auth and the proxied request) arrives as Cilium's `ingress`
# entity when Envoy and the pod share a node, and as `remote-node` when they
# don't; a standard NetworkPolicy can't match either, hence CiliumNetworkPolicy.
# Kubelet probes come from the node (`host`), which Cilium always allows. See
# argocd/README.md's "NetworkPolicies" section for the whole scheme and how to
# debug a drop (`hubble observe --verdict DROPPED`).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: zigbee2mqtt
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: zigbee2mqtt
  namespace: zigbee2mqtt
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - ingress
        - remote-node
        - host
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: '53'
              protocol: UDP
            - port: '53'
              protocol: TCP
          rules:
            dns:
              - matchPattern: '*'
    - toFQDNs:
        - matchName: raw.githubusercontent.com
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: mosquitto
      toPorts:
        - ports:
            - port: '1883'
              protocol: TCP
    - toCIDR:
        - 192.168.102.4/32
      toPorts:
        - ports:
            - port: '6638'
              protocol: TCP
