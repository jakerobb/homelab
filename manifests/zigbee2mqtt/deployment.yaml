# Bare Deployment, no Helm chart: single container, no per-environment variation
# (same reasoning as ntfy/deployment.yaml).
#
# Migrated from the docker-compose `zigbee2mqtt` service on rpi5-1. The Zigbee
# coordinator is a network-attached radio at tcp://192.168.102.4:6638 (set in
# configuration.yaml), so nothing is hardware-pinned.
#
# The `restore` init container WAITS until /store/.restored exists, then exits. Without
# the gate the app would start against an empty data directory, and Zigbee2MQTT's
# default for a missing config is `network_key: GENERATE`, which forms a NEW network on
# the coordinator and orphans every paired device. The cutover script
# (scripts/zigbee2mqtt-cutover/restore.sh) copies the old data in, checks the network key,
# and only then creates the marker.
#
# There is no seed ConfigMap. configuration.yaml carries the device and group names, which
# stay out of this public repo, so it comes from the old data directory instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zigbee2mqtt
  namespace: zigbee2mqtt
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    # Not RollingUpdate: the data PVC is ReadWriteOnce, and two instances talking
    # to one coordinator would fight over its single TCP connection.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: zigbee2mqtt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zigbee2mqtt
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: restore
          image: busybox:1.37.0
          command:
            - sh
            - -c
            - |
              if [ ! -e /store/.restored ]; then
                echo "Waiting for the old data to be restored (see argocd/README.md, zigbee2mqtt cutover)..."
                until [ -e /store/.restored ]; do sleep 5; done
              fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - mountPath: /store
              name: data
      containers:
        - name: zigbee2mqtt
          image: koenkk/zigbee2mqtt:2.14.2
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: America/Detroit
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
          # The coordinator handshake can take a while, and the process exits if it
          # fails, so give it room before the liveness probe applies.
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - mountPath: /app/data
              name: data
            # configuration.yaml refers to the key as `!secret network_key`, so the key
            # stays in this Secret and out of the PVC's copy of the config. Zigbee2MQTT only
            # writes this file when the value changes; a read-only mount is fine (tested).
            - mountPath: /app/data/secret.yaml
              name: network-key
              subPath: secret.yaml
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zigbee2mqtt-data
        - name: network-key
          secret:
            secretName: zigbee2mqtt-network-key
