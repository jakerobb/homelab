# DNS-01 against Cloudflare: no public HTTP-01 exposure needed, and it's the
# only challenge type that supports the wildcard cert below. Requires
# `cloudflare-api-token` to exist in the cert-manager namespace, synced from
# 1Password by External Secrets Operator
# (manifests/external-secrets-config/cloudflare.yaml).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-cloudflare
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: jakerobb@gmail.com
    privateKeySecretRef:
      name: letsencrypt-cloudflare-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
