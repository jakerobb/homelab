# Serves whatever build /site/current points at (see build-loop.sh).
server {
    listen 8080;
    server_name _;
    root /site/current;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # Liveness only. Readiness checks /index.html instead, so the pod isn't
    # Ready until the first build has landed.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
