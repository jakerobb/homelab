# nut-relay (github.com/jakerobb/nut-relay, renamed from
# nut-influx-relay) in its Prometheus output mode, polling both UPSes: the
# rack CyberPower from nut-upsd (which stays on rpi5-1 because the UPS is
# plugged into it over USB) and the office UniFi UPS Tower from its own NUT
# server. Replaces Compose's nut-influx-relay (the same app, writing to
# InfluxDB) and nut-webui; SigNoz gets the data by federation
# (argocd/apps/signoz/application.yaml) and shows it on the Power dashboard
# (terraform/signoz/dashboard-unifi-power.tf). Stateless: no PVC.
#
# Why not DRuggeri/nut_exporter: its NUT client (go.nut) sends LIST CLIENT
# and GET NUMLOGINS before reading anything, and the Tower's NUT server
# answers both with ERR INVALID-ARGUMENT, which go.nut can't handle.
# nut-relay only sends LIST VAR.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nut-exporter
  namespace: nut-exporter
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # The pod starts in about 2s (measured 2026-10-18, image cached). 120s covers
  # a cold pull with room to spare and turns a rollout that can't finish
  # (bad tag, pull failure, crash) into a Degraded app in 2 minutes instead of
  # the default 10. This app is auto-merged by Renovate; see argocd/README.md.
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: nut-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nut-exporter
    spec:
      automountServiceAccountToken: false
      # Matches the image's own USER.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nut-exporter
          image: docker.io/jakerobb/nut-relay:20261014181550
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: metrics
              containerPort: 8080
          # /health doesn't depend on any UPS being reachable, so an
          # unreachable NUT server shows as nut_up 0, not as pod restarts.
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 30
          # Same /health: "the process is serving". Without a readiness probe a
          # pod is Ready the moment its container starts, so the RollingUpdate
          # would retire the old pod for a new one that hasn't opened its port
          # (or never does). It stays independent of the UPSes on purpose.
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 10
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - mountPath: /etc/nut-relay
              name: config
              readOnly: true
      volumes:
        # Generated from config.yaml by kustomization.yaml; the name gets a
        # content-hash suffix, so a config change rolls the pod.
        - name: config
          configMap:
            name: nut-exporter-config
