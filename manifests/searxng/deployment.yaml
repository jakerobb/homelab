# Bare Deployment, no Helm chart — searched for an official one (an earlier
# web search claimed https://charts.searxng.org existed; that domain doesn't
# resolve, and github.com/searxng/searxng-helm-chart 404s, so it was a dead
# end/hallucination, not a real option). No per-environment variation either,
# so plain manifests match homepage's precedent (see manifests/homepage/deployment.yaml).
#
# Image tag is a pinned date-stamped build, not `latest` — SearXNG doesn't do
# semver releases, just a rolling stream of `YYYY.M.D-<sha>` tags (confirmed
# via Docker Hub), so a concrete tag is the closest thing to a "stable
# version" this project publishes.
#
# secret_key/base_url/image_proxy are all set via env vars that
# searx/settings_defaults.py reads directly (SEARXNG_SECRET, SEARXNG_BASE_URL,
# SEARXNG_IMAGE_PROXY take precedence over settings.yml) — confirmed against
# the searxng/searxng source. That means no settings.yml ConfigMap is needed
# at all: the container's entrypoint auto-generates a throwaway settings.yml
# into /etc/searxng from its bundled template on every start (it doesn't
# persist across restarts since that's a plain emptyDir below), and the env
# vars override the values that matter regardless of what's in it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: searxng
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searxng
    spec:
      securityContext:
        runAsNonRoot: true
        # 977:977 is the searxng:searxng user/group baked into the image
        # (container/dist.dockerfile's --chown=977:977). fsGroup makes the
        # emptyDir volumes below group-writable by it, since FORCE_OWNERSHIP's
        # chown in entrypoint.sh only runs when the container starts as root.
        runAsUser: 977
        runAsGroup: 977
        fsGroup: 977
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: searxng
          image: docker.io/searxng/searxng:2026.9.18-c0042add3
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: SEARXNG_BASE_URL
              value: https://search.jakerobb.org/
            # Enables server-side proxying of result thumbnails/images so
            # clients don't leak referer/IP straight to third-party image
            # hosts — matches the tool's own privacy-focused purpose.
            - name: SEARXNG_IMAGE_PROXY
              value: "true"
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: searxng-secret-key
                  key: secret-key
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - mountPath: /etc/searxng
              name: config
            - mountPath: /var/cache/searxng
              name: cache
      volumes:
        - name: config
          emptyDir: {}
        - name: cache
          emptyDir: {}
