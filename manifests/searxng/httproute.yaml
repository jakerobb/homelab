# Gated by Authelia forward-auth, same pattern as homepage/httproute.yaml —
# external-dns creates a real public DNS record for search.jakerobb.org (not
# LAN-only), so leaving SearXNG unauthenticated would make it reachable, and
# abusable as an open search proxy, by anyone on the internet.
#
# Requires a matching ReferenceGrant entry in the `authelia` namespace (see
# argocd/apps/authelia/referencegrant.yaml) and an `access_control` rule for
# search.jakerobb.org in Authelia's config (see
# argocd/apps/authelia/application.yaml) — without either, this route either
# fails to program or falls through to Authelia's default_policy (deny).
#
# gethomepage.dev/* annotations opt this into Homepage's Kubernetes
# discovery (see manifests/homepage/configmap.yaml's kubernetes.yaml) instead
# of a manual services.yaml entry — the first real use of that pattern,
# landing it in the "Apps" group/tab per gethomepage.dev's documented
# `gethomepage.dev/group` annotation.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: searxng
  namespace: searxng
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: SearXNG
    gethomepage.dev/description: Privacy-respecting metasearch engine
    gethomepage.dev/icon: searxng.png
    gethomepage.dev/group: Apps
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: gateway-system
  hostnames:
    - search.jakerobb.org
  rules:
    - filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              group: ""
              kind: Service
              name: authelia
              namespace: authelia
              port: 80
            http:
              path: /api/authz/ext-authz/
              allowedHeaders:
                - authorization
                - proxy-authorization
                - cookie
                - accept
                - host
                - x-forwarded-proto
                - x-forwarded-for
              allowedResponseHeaders:
                - remote-user
                - remote-groups
                - remote-name
                - remote-email
      backendRefs:
        - name: searxng
          port: 8080
