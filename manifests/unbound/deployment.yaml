# Two Unbound replicas serving the same config as Compose's Unbound on rpi5-1
# (local.conf is a copy of docker-compose/unbound/custom.conf.d/local.conf).
# Listens on 1053 (non-root, see kubernetes.conf); service.yaml exposes it on 53
# through the LoadBalancer IP.
#
# The hard anti-affinity keeps the replicas on different workers, so losing
# one node never takes out both. It's "required" rather than "preferred" on
# purpose: two resolvers on one node defeat the point. Consequences: a rolling
# update can't surge (a third pod would have nowhere to go), hence maxSurge 0,
# and with only one worker up the second replica stays Pending.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unbound
  namespace: unbound
  annotations:
    # Tried read-only on 2026-10-27 and it can't run as is: Unbound writes its
    # control socket (control-enable: no fixes that) and then dies updating the
    # RFC 5011 trust anchor (root.key, next to root.hints in /var/unbound).
    # Fixing the second needs a seeded writable anchor file, and this is the
    # LAN's resolver, so it stays flagged-off for now.
    radarhq.io/ignore-checks: readOnlyRootFs
spec:
  replicas: 2
  revisionHistoryLimit: 2
  # Small and stateless: the pod started in about 2s when last measured (2026-10-18).
  # 60s covers a cold image pull and turns a rollout that can't finish into a
  # Degraded app in a minute.
  progressDeadlineSeconds: 60
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: unbound
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unbound
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: unbound
      containers:
        - name: unbound
          # renovate: datasource=docker depName=klutchell/unbound
          image: docker.io/klutchell/unbound:v1.26.2
          imagePullPolicy: IfNotPresent
          # Runs as the image's own `unbound` user (101:102, owner of /var/unbound),
          # so it can't bind :53: kubernetes.conf moves it to 1053 and the Service
          # translates. No capabilities are needed at all that way.
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 102
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: dns-udp
              containerPort: 1053
              protocol: UDP
            - name: dns-tcp
              containerPort: 1053
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: dns-tcp
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: dns-tcp
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - mountPath: /etc/unbound/custom.conf.d
              name: config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: unbound-config
