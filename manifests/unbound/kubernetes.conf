# Kubernetes-only overrides, kept apart from local.conf (a copy of the Compose
# config). Unbound runs as its own non-root user here, so it can't bind :53;
# the Service still exposes 53 and targets this port.
server:
  port: 1053
  # Already non-root, so no privilege drop (and no chroot) to do at startup.
  username: ""
