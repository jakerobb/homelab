# HTTPRoutes for things that run outside the cluster: the Compose apps still
# on rpi5-1, plus LAN devices with their own web UIs. Replaces Caddy
# (docker-compose/caddy/Caddyfile). Each file is one hostname: a Service with
# no selector, a hand-written EndpointSlice with the backend's fixed IP, and
# the HTTPRoute. Not ExternalName Services, which Cilium's Gateway doesn't
# support as backends. The `managed-by` label keeps Kubernetes' EndpointSlice
# controllers from touching the slices. ArgoCD only applies the slices because
# argocd/install/values.yaml removes EndpointSlice from its default
# resource.exclusions.
#
# When a Compose app migrates into the cluster, delete its file here; its
# own manifests take over the hostname.
#
# The IoT VLAN devices (kvm, rack-led, modbus-relay) need a UniFi firewall
# rule allowing the cluster nodes in; see argocd/README.md's lan-routes
# section.
apiVersion: v1
kind: Namespace
metadata:
  name: lan-routes
