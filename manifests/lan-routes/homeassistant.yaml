# Home Assistant (Compose on rpi5-1).
# Deliberately NOT gated by Authelia: the app has its own login, and forward-auth
# would break the Home Assistant companion app, which can't do an Authelia login.
apiVersion: v1
kind: Service
metadata:
  name: homeassistant
  namespace: lan-routes
spec:
  ports:
    - name: http
      port: 8123
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: homeassistant
  namespace: lan-routes
  labels:
    kubernetes.io/service-name: homeassistant
    endpointslice.kubernetes.io/managed-by: argocd
addressType: IPv4
ports:
  - name: http
    port: 8123
endpoints:
  - addresses:
      - 192.168.102.2
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homeassistant
  namespace: lan-routes
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: gateway-system
  hostnames:
    - homeassistant.jakerobb.org
  rules:
    - backendRefs:
        - name: homeassistant
          port: 8123
