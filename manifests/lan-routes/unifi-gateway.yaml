# UniFi gateway (UCG) web UI.
# Deliberately NOT gated by Authelia: the app has its own login.
apiVersion: v1
kind: Service
metadata:
  name: unifi-gateway
  namespace: lan-routes
spec:
  ports:
    - name: http
      port: 80
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: unifi-gateway
  namespace: lan-routes
  labels:
    kubernetes.io/service-name: unifi-gateway
    endpointslice.kubernetes.io/managed-by: argocd
addressType: IPv4
ports:
  - name: http
    port: 80
endpoints:
  - addresses:
      - 192.168.0.1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unifi-gateway
  namespace: lan-routes
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: gateway-system
  hostnames:
    - gateway.jakerobb.org
  rules:
    - backendRefs:
        - name: unifi-gateway
          port: 80
