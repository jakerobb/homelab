# Bound to the built-in read-only `view` ClusterRole, not cluster-admin
# (narrowed 2026-10-21). Headlamp runs in `-in-cluster` mode, but once a
# user logs in through OIDC it sends that user's own ID token to
# kube-apiserver, which trusts the same Authelia issuer
# (talos/patches/control-plane/oidc.yaml) and authorizes the request as
# `jakerobb@gmail.com` via the `oidc-admin` binding
# (clusterrolebinding-oidc-user.yaml). So this ServiceAccount is only what
# Headlamp's backend uses for itself, and a compromised pod shouldn't hand
# over the cluster. Originally cluster-admin (2026-09-21), when the API
# server didn't yet accept OIDC tokens and every call went out as the SA.
# If a Headlamp feature breaks after this, it's still using the SA's token;
# prefer a small custom role over going back to cluster-admin.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: headlamp
