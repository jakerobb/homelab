# Headlamp. Talks to the API server as the logged-in user, and to Authelia for OIDC by its public
# hostname, which resolves to the Gateway VIP (hairpin through the Gateway).
# The hairpin needs two egress rules, not one: the Gateway VIP itself (`ingress`
# entity / VIP CIDR) and the Authelia pods behind it. Cilium's Gateway Envoy
# enforces the *client's* egress policy against the backend it routes to, so
# without the Authelia rule it answers a bare `403 Access denied` and Headlamp's
# login fails with "failed to get provider" (found 2026-10-08; Hubble showed
# `http-request DROPPED` on the Gateway).
#
# Default-deny both directions, then only the flows below. Gateway traffic
# (Authelia forward-auth and the proxied request) arrives as Cilium's `ingress`
# entity when Envoy and the pod share a node, and as `remote-node` when they
# don't; a standard NetworkPolicy can't match either, hence CiliumNetworkPolicy.
# Kubelet probes come from the node (`host`), which Cilium always allows. See
# argocd/README.md's "NetworkPolicies" section for the whole scheme and how to
# debug a drop (`hubble observe --verdict DROPPED`).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: headlamp
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: headlamp
  namespace: headlamp
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - ingress
        - remote-node
        - host
      toPorts:
        - ports:
            - port: '4466'
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: '53'
              protocol: UDP
            - port: '53'
              protocol: TCP
    - toEntities:
        - kube-apiserver
    - toEntities:
        - ingress
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP
    - toCIDR:
        - 192.168.102.128/32
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authelia
      toPorts:
        - ports:
            - port: '9091'
              protocol: TCP
