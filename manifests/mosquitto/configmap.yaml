# Same settings as the pre-migration Compose config
# (docker-compose/mosquitto/config/mosquitto.conf), except logging goes to
# stdout so Vector/SigNoz pick it up instead of a log file on the volume.
#
# allow_anonymous is unchanged from Compose: the broker is only reachable on
# the LAN (Server VLAN VIP), and Zigbee2MQTT / Home Assistant connect without
# credentials today. Adding auth means touching both clients, so it's a
# separate change.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: mosquitto
data:
  mosquitto.conf: |
    listener 1883
    allow_anonymous true
    persistence true
    persistence_location /mosquitto/data/
    log_dest stdout
