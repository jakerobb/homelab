# A failed sync leaves the last good Secret in place, so nothing breaks
# right away. That's exactly why it needs an alert: a rotated value in
# 1Password that never lands, or a revoked/expired service-account token,
# would otherwise go unnoticed until something restarts and gets a stale
# credential rejected. 30m tolerates a transient 1Password blip; with the
# 24h refreshInterval, one failed refresh stays Ready=False until the next
# retry (ESO backs off and retries failures on its own, so this is usually
# much sooner than 24h).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  groups:
    - name: external-secrets
      rules:
        - alert: ExternalSecretNotSynced
          expr: externalsecret_status_condition{condition="Ready", status="False"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} is not syncing from 1Password"
            description: >-
              The Secret still holds its last synced value. Check
              `kubectl -n {{ $labels.namespace }} describe externalsecret {{ $labels.name }}`
              for the provider error (missing item/field, bad token, rate limit).
              A rate limit is 1Password's rolling 24h cap on service-account
              requests (1,000/day on Individual/Families); failed retries count
              against it, so it clears ~24h after the burst that caused it
              (see the 2026-10-02 incident in argocd/README.md).
              If the error says `wasm error: out of bounds memory access`, the
              1Password SDK client is wedged for every ExternalSecret and
              never recovers on its own. eso-restarter
              (manifests/eso-restarter/) restarts ESO automatically within
              about 5 minutes of the first such error, and an ntfy notice
              ("ESO's 1Password client is wedged; restarting it") says so, then
              updates to "ESO is back" once the ExternalSecrets resync. So if
              this alert fires on that error anyway, the automatic restart
              didn't happen or didn't help: check
              `kubectl -n eso-restarter logs job/<latest>`, or restart by hand
              with `kubectl -n external-secrets rollout restart deploy/external-secrets`.
              A DNS blip triggered this on 2026-09-30 (upstream:
              external-secrets/external-secrets#6941).
