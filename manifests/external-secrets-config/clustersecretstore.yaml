# The one store every ExternalSecret in this directory reads from: the
# dedicated `homelab-k8s` 1Password vault, via the 1Password SDK provider
# (no Connect server to run). Authenticates as a 1Password service account
# with read-only access to that vault and nothing else, so a leaked token
# exposes only what the cluster already has.
#
# The token Secret is the one secret ESO can't provide for itself. It's
# SOPS-encrypted in argocd/secrets/onepassword-service-account.sops.yaml
# and applied by hand once. See argocd/README.md's "External Secrets
# Operator" section, and scripts/migrate-to-1password.py, which
# creates it.
#
# Cluster-scoped so ExternalSecrets in any namespace can use it. Fine with
# one admin; revisit with spec.conditions (namespace allow-list) if that
# ever changes, alongside todo/FUTURE.md's Authelia RBAC item.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepasswordSDK:
      vault: homelab-k8s
      auth:
        serviceAccountSecretRef:
          name: onepassword-service-account
          namespace: external-secrets
          key: token
      integrationInfo:
        name: homelab-external-secrets
        version: v1
