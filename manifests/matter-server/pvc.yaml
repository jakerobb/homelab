# The Matter server's storage path. Written by python-matter-server (the fabric JSON with the
# commissioned nodes and the controller's operational identity, chip_*.ini, and the PAA root
# certificate cache), then migrated in place by matterjs-server on its first start, which keeps
# the fabric JSON up to date and adds its own `server`, `ota` and `certificates` directories. Losing
# the fabric means re-commissioning every Matter device, so this is the part that matters.
# A few MB at time of migration.
#
# hexos-iscsi, like the other stateful apps. After a HexOS outage, iSCSI volumes on the mbp
# worker can go silently read-only; delete the pod to recover (see argocd/README.md).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: matter-server-data
  namespace: matter-server
spec:
  storageClassName: hexos-iscsi
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
