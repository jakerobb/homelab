# Template for the Studio unlock watchdog's secret (docs/studio-unlock-watchdog.md). Do not put real values in this
# file or commit them. Instead:
#   cp scripts/secrets/studio-unlock.example.yaml scripts/secrets/studio-unlock.sops.yaml
#   (edit the two values below in the copy)
#   sops --encrypt --in-place scripts/secrets/studio-unlock.sops.yaml
#   scp it to rpi5-1:~/bin/secrets/studio-unlock.sops.yaml
# `user` must be a FileVault-enabled account on the Studio. A dedicated standard (non-admin) account that exists only
# for this is strongly preferred over your own login, so a stolen copy of this secret unlocks the disk and nothing more.
user: REPLACE_ME
password: REPLACE_ME
