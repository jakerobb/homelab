# Native Telegraf on the physical Mac host underneath a Talos worker VM
# running under UTM (see ../../docs/mac-host-metrics.md) -- NOT the same
# Telegraf as ../../docker-compose/telegraf/telegraf.conf (that one runs on
# rpi5-1 and ships to the local InfluxDB/Grafana stack). This instance
# ships straight to SigNoz over OTLP/HTTP, reusing the same otel.jakerobb.org
# route Vector already uses for logs
# (argocd/apps/signoz/httproute-otel.yaml) -- host-level stats macOS itself
# sees that the K8s-side node-exporter can't, since that only ever sees
# inside the Talos VM running on top of this host.
#
# This is a per-host template, not a finished config: @@TELEGRAF_PREFIX@@
# and @@NODE_HOST_NAME@@ get substituted at copy time (see
# ../../docs/mac-host-metrics.md's setup steps). TELEGRAF_PREFIX is
# wherever Telegraf actually got installed on this particular host --
# Homebrew's prefix if that worked, or the manual-install prefix if not
# (e.g. this Mac's 2018 hardware caps out at Sequoia, one OS short of what
# current Homebrew requires). Each Mac also needs its own distinct
# NODE_HOST_NAME -- reusing the same value across hosts (e.g. copying this
# file to the Mac Studio unedited) makes their metrics collide under one
# series in SigNoz.
[agent]
  interval = "60s"
  round_interval = true
  flush_interval = "60s"
  hostname = "@@NODE_HOST_NAME@@"
  # Telegraf's own rotation rather than newsyslog: under launchd the
  # StandardOutPath file stays open by file descriptor, so an external
  # rename-based rotation would leave Telegraf still writing to the
  # rotated-away file. (launchd's stdout/stderr go to a separate file, see
  # com.jakerobb.telegraf.plist, and only catch crashes and startup output.)
  logfile = "@@TELEGRAF_PREFIX@@/var/log/telegraf.log"
  logfile_rotation_max_size = "10MB"
  logfile_rotation_max_archives = 5

[[outputs.opentelemetry]]
  service_address = "https://otel.jakerobb.org/v1/metrics"
  encoding_type = "protobuf"
  compression = "gzip"
  [outputs.opentelemetry.attributes]
    "host.name" = "@@NODE_HOST_NAME@@"

# Catches a host-level crash or thermal shutdown -- that would otherwise
# only be visible indirectly, as the Talos node going NotReady with no
# explanation.
[[inputs.system]]

# Host-level free space for the volume holding the UTM qcow2 -- distinct
# from whatever the VM itself reports as its own disk usage. Just root;
# APFS's synthetic volumes (/System/Volumes/*) would just add noise.
[[inputs.disk]]
  mount_points = ["/"]

# No sudo needed for these two.
[[inputs.exec]]
  commands = ["@@TELEGRAF_PREFIX@@/etc/telegraf/scripts/collect-therm.sh"]
  timeout = "10s"
  data_format = "influx"

[[inputs.exec]]
  commands = ["@@TELEGRAF_PREFIX@@/etc/telegraf/scripts/collect-power.sh"]
  timeout = "10s"
  data_format = "influx"

# Needs the NOPASSWD sudoers rule from telegraf-powermetrics.sudoers --
# powermetrics can't read SMC sensors as a normal user. See
# ../../docs/mac-host-metrics.md.
[[inputs.exec]]
  commands = ["@@TELEGRAF_PREFIX@@/etc/telegraf/scripts/collect-smc.sh"]
  timeout = "10s"
  data_format = "influx"
