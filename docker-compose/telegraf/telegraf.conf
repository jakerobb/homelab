[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "10s"
  hostname = "rpi5-1"
  skip_processors_after_aggregators = false

# All metrics go to SigNoz (InfluxDB was retired as Telegraf's output on
# 2026-09-30). Same OTLP endpoint and host.name attribute as the Macs
# (scripts/mac-host-metrics/telegraf.conf).
[[outputs.opentelemetry]]
  service_address = "https://otel.jakerobb.org/v1/metrics"
  encoding_type = "protobuf"
  compression = "gzip"
  [outputs.opentelemetry.attributes]
    "host.name" = "rpi5-1"

[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = true

[[inputs.mem]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

[[inputs.diskio]]
  devices = ["nvme0n1", "nvme0n1p1", "nvme0n1p2"]

[[inputs.net]]
  interfaces = ["eth0"]

[[inputs.system]]

[[inputs.processes]]

[[inputs.temp]]

[[inputs.netstat]]

[[inputs.swap]]

[[inputs.kernel]]

[[inputs.interrupts]]

[[inputs.linux_sysctl_fs]]

[[inputs.conntrack]]

[[inputs.nstat]]

[[inputs.exec]]
  commands = [["sh", "-c", "cat /hostfs/sys/devices/platform/cooling_fan/hwmon/hwmon*/fan1_input"]]
  name_override = "fan"
  data_format = "value"
  data_type = "integer"
  interval = "30s"

[[inputs.ping]]
  urls = [
    "192.168.0.1",        # UCG Fiber gateway
    "192.168.102.2",      # RPi wired interface
    "1.1.1.1",            # Cloudflare DNS
    "8.8.8.8",            # Google DNS
    "46.110.15.1",        # Metronet WAN gateway
    "100.127.125.128",    # GRE tunnel for T-Mobile
  ]
  count = 4
  ping_interval = 1.0
  timeout = 2.0
  deadline = 10

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  gather_services = false
  source_tag = false
  container_name_include = []
  container_name_exclude = []
  timeout = "5s"
  perdevice_include = ["cpu", "blkio", "network"]
  total_include = ["cpu", "blkio", "network"]
  # Every container label would otherwise become an attribute on every
  # datapoint in SigNoz (io.hass.*, org.opencontainers.*, ...).
  docker_label_include = ["com.docker.compose.service"]
  docker_label_exclude = []
