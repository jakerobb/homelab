[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "10s"
  hostname = "rpi5-1"
  skip_processors_after_aggregators = false

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "home"
  bucket = "telegraf"

[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = true

[[inputs.mem]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

[[inputs.diskio]]
  devices = ["nvme0n1", "nvme0n1p1", "nvme0n1p2"]

[[inputs.net]]
  interfaces = ["eth0"]

[[inputs.system]]

[[inputs.processes]]

[[inputs.temp]]

[[inputs.netstat]]

[[inputs.swap]]

[[inputs.kernel]]

[[inputs.interrupts]]

[[inputs.linux_sysctl_fs]]

[[inputs.conntrack]]

[[inputs.nstat]]

[[inputs.internal]]
  collect_memstats = true

[[inputs.procstat]]
  pattern = ".*"
  pid_finder = "native"

[[inputs.temp]]

[[inputs.exec]]
  commands = ["sh -c 'cat /hostfs/sys/devices/platform/cooling_fan/hwmon/hwmon*/fan1_input'"]
  name_override = "fan"
  data_format = "value"
  data_type = "integer"
  interval = "30s"

[[inputs.ping]]
  urls = [
    "192.168.0.1",        # UCG Fiber gateway
    "192.168.102.2",      # RPi wired interface
    "192.168.102.3",      # RPi Wi-Fi interface
    "1.1.1.1",            # Cloudflare DNS
    "8.8.8.8",            # Google DNS
    "46.110.15.1",        # Metronet WAN gateway
    "100.127.125.128",    # GRE tunnel for T-Mobile
  ]
  count = 4
  ping_interval = 1.0
  timeout = 2.0
  deadline = 10

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  gather_services = false
  source_tag = false
  container_name_include = []
  container_name_exclude = []
  timeout = "5s"
  perdevice_include = ["cpu", "blkio", "network"]
  total_include = ["cpu", "blkio", "network"]
  docker_label_include = []
  docker_label_exclude = []

[[inputs.exec]]
  commands = ["/etc/telegraf/scripts/fetch-poe-budgets.sh"]
  interval = "1h"
  timeout = "30s"
  data_format = "influx"
