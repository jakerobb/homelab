- id: '1771452044660'
  alias: Turn on porch light
  description: ''
  triggers:
  - trigger: webhook
    allowed_methods:
    - POST
    - PUT
    local_only: true
    webhook_id: -Rfy9cEgWEK7UY5XvDjg-rcQy
  conditions: []
  actions:
  - action: system_log.write
    metadata: {}
    data:
      level: error
      message: 'Turn on porch light trigger: {{ trigger }}'
  - if:
    - type: is_on
      condition: device
      device_id: 19146072ca8ec467429cc0dd5633ed18
      entity_id: 84701294aea8d08e4f78aee2b05faff9
      domain: binary_sensor
    then:
    - if:
      - condition: device
        type: is_on
        device_id: 4813cda9108eca5bee6841c3a6082fc5
        entity_id: a66152198561b1232a1a7916b9136b3b
        domain: switch
      then:
      - if:
        - condition: state
          entity_id: timer.front_door_activity_timer
          state:
          - active
        then:
        - action: timer.start
          metadata: {}
          target:
            entity_id: timer.front_door_activity_timer
          data: {}
      else:
      - action: switch.turn_on
        metadata: {}
        target:
          entity_id: switch.front_porch_light
        data: {}
      - action: timer.start
        metadata: {}
        data: {}
        target:
          entity_id: timer.front_door_activity_timer
  mode: single
- id: '1771513028678'
  alias: Turn off porch light
  description: ''
  triggers:
  - trigger: event
