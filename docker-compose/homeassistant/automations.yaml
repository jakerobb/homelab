- id: '1779821876804'
  alias: LR Switch - Up Single -> LR lights on 30% or up 10%
  description: ''
  triggers:
  - domain: mqtt
    device_id: 49e962a06b1d757beb468044e8da225b
    type: action
    subtype: up_single
    trigger: device
  conditions: []
  actions:
  - if:
    - condition: light.is_on
      target:
        entity_id: light.living_room_lights
      options:
        for: 00:00:00
    then:
    - action: light.turn_on
      metadata: {}
      target:
        entity_id: light.living_room_lights
      data:
        transition: 1
        brightness_step_pct: 10
    else:
    - action: light.turn_on
      target:
        entity_id: light.living_room_lights
      data:
        color_temp_kelvin: 3505
        brightness_pct: 30
        transition: 1
  mode: single
