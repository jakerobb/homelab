- id: '1778593416617'
  alias: Tap Dial button 1 press - Living Room East on 30%
  description: ''
  triggers:
  - domain: mqtt
    device_id: 0b32a788dca66e6223fde7cfba235b63
    type: action
    subtype: button_1_press_release
    trigger: device
  conditions: []
  actions:
  - action: light.turn_on
    metadata: {}
    target:
      entity_id:
      - light.northeast
      - light.0x001788010f270056
    data:
      transition: 1
      color_temp_kelvin: 3500
      brightness_pct: 30
  mode: single
- id: '1778593624907'
  alias: Tap Dial Rotation - controls Living Room Brightness
  description: ''
  triggers:
  - trigger: mqtt
    options:
      topic: zigbee2mqtt/Tap Dial Switch
  conditions:
  - condition: template
    value_template: '{{ trigger.payload_json.action is defined and trigger.payload_json.action.startswith(''dial_rotate_'')
      }}'
  actions:
  - variables:
      step_map:
        dial_rotate_right_fast: 25
        dial_rotate_right_slow: 5
        dial_rotate_right_step: 1
        dial_rotate_left_step: -1
        dial_rotate_left_slow: -5
        dial_rotate_left_fast: -25
      step: '{{ step_map.get(trigger.payload_json.action, 0) }}'
  - condition: '{{ step != 0 }}'
  - data:
      step: '{{ step }}'
    action: script.living_room_dial_brightness
  mode: single
