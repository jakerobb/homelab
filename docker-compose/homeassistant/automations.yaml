      entity_id: timer.front_door_activity_timer
  conditions: []
  actions:
  - action: switch.turn_off
    metadata: {}
    data: {}
    target:
      entity_id: switch.front_porch_light
  mode: single
- id: '1771552771114'
  alias: 11pm shut down
  description: ''
  triggers:
  - trigger: time
    at: '23:00:00'
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: timer.front_door_activity_timer
      state:
      - active
  actions:
  - action: switch.turn_off
    metadata: {}
    target:
      entity_id: switch.front_porch_light
    data: {}
  mode: single
