sources:
  docker:
    type: docker_logs
    docker_host: unix:///var/run/docker.sock
    exclude_containers:
      - vector
      - victorialogs

  unifi_syslog:
    type: socket
    mode: udp
    address: 0.0.0.0:514
    decoding:
      codec: bytes

  pi_journal:
    type: journald
    current_boot_only: true
    # Don't double-ingest Docker stdout; the `docker` source already has it.
    exclude_units:
      - docker.service
      - containerd.service

transforms:
  unifi_cef:
    type: remap
    inputs:
      - unifi_syslog
    source: |
      raw = string!(.message)
      # Guard with contains() first: find() returns null when the substring
      # is absent, and `null >= 0` throws. Most syslog lines are NOT CEF.
      if contains(raw, "CEF:0|") {
        idx = find(raw, "CEF:0|")
        parsed, err = parse_cef(slice!(raw, start: idx))
        if err == null {
          . = merge(., parsed)
        }
        del(.message)
      } else {
        parsed, err = parse_syslog(raw)
        if err == null {
          rcv = .timestamp          # Vector's receive time
          . = merge(., parsed)
          .timestamp = rcv          # prefer receive time over parsed time
        }
      }
      .source_type = "unifi"

  pi_journal_tag:
    type: remap
    inputs:
      - pi_journal
    source: |
      .source_type = "pi-journal"
      .host = "rpi5-1"
      # Surface the systemd unit as a clean, stream-friendly field.
      # journald source exposes it as _SYSTEMD_UNIT (may be absent for kernel).
      .unit = to_string(._SYSTEMD_UNIT) ?? "kernel"

  # Reshape into valid OTLP JSON (resourceLogs/scopeLogs/logRecords) before
  # the opentelemetry sink's `otlp` codec — that codec is a passthrough for
  # already-OTLP-shaped events, not a converter; found live (Vector 0.58.0
  # refused every event with "Log event does not contain OTLP top-level
  # fields") before adding these. One per source since each has different
  # field names for its message/attributes (matching the per-sink
  # `_msg_field`/`_stream_fields` VictoriaLogs config below).
  #
  # Gotcha found live (2026-09-22): `to_string(.missing_field) ?? fallback`
  # does NOT fall through the way it looks like it should — VRL's
  # to_string() returns "" (no error at all) for an absent field, so `??`
  # never triggers and just locks onto the empty string from whichever
  # field was checked first. Confirmed via `vector vrl`: `to_string(.msg) ??
  # to_string(.message) ?? to_string(.name)` against `{"message": "hello
  # world"}` returned `""`, not `"hello world"`. Any multi-field fallback
  # below checks emptiness explicitly (`if body == "" { ... }`) instead of
  # relying on `??` to skip a genuinely-absent field.
  docker_otlp:
    type: remap
    inputs:
      - docker
    source: |
      body = to_string(.message) ?? ""
      ts_ns = to_string(to_unix_timestamp!(.timestamp, unit: "nanoseconds"))
      . = {
        "resourceLogs": [{
          "resource": {
            "attributes": [
              # docker_logs source's own `.host` is the *container's* own
              # hostname (Docker defaults that to the short container ID)
              # -- not the Vector host machine. Found live: logs were
              # showing up tagged e.g. "9c01ab64c2a1" instead of "rpi5-1".
              # Hardcode it, same as the other two sources below.
              {"key": "host.name", "value": {"stringValue": "rpi5-1"}},
              {"key": "source_type", "value": {"stringValue": "docker"}}
            ]
          },
          "scopeLogs": [{
            "scope": {},
            "logRecords": [{
              "timeUnixNano": ts_ns,
              "body": {"stringValue": body},
              "attributes": [
                {"key": "container_name", "value": {"stringValue": to_string(.container_name) ?? ""}},
                {"key": "container_id", "value": {"stringValue": to_string(.container_id) ?? ""}},
                {"key": "stream", "value": {"stringValue": to_string(.stream) ?? ""}}
              ]
            }]
          }]
        }]
      }

  unifi_otlp:
    type: remap
    inputs:
      - unifi_cef
    source: |
      body = to_string(.msg) ?? ""
      if body == "" { body = to_string(.message) ?? "" }
      if body == "" { body = to_string(.name) ?? "" }
      ts_ns = to_string(to_unix_timestamp!(.timestamp, unit: "nanoseconds"))
      . = {
        "resourceLogs": [{
          "resource": {
            "attributes": [
              {"key": "host.name", "value": {"stringValue": "unifi"}},
              {"key": "source_type", "value": {"stringValue": "unifi"}}
            ]
          },
          "scopeLogs": [{
            "scope": {},
            "logRecords": [{
              "timeUnixNano": ts_ns,
              "body": {"stringValue": body},
              "attributes": [
                {"key": "deviceVendor", "value": {"stringValue": to_string(.deviceVendor) ?? ""}},
                {"key": "deviceProduct", "value": {"stringValue": to_string(.deviceProduct) ?? ""}}
              ]
            }]
          }]
        }]
      }

  pi_journal_otlp:
    type: remap
    inputs:
      - pi_journal_tag
    source: |
      body = to_string(.message) ?? ""
      ts_ns = to_string(to_unix_timestamp!(.timestamp, unit: "nanoseconds"))
      . = {
        "resourceLogs": [{
          "resource": {
            "attributes": [
              {"key": "host.name", "value": {"stringValue": "rpi5-1"}},
              {"key": "source_type", "value": {"stringValue": "pi-journal"}}
            ]
          },
          "scopeLogs": [{
            "scope": {},
            "logRecords": [{
              "timeUnixNano": ts_ns,
              "body": {"stringValue": body},
              "attributes": [
                {"key": "unit", "value": {"stringValue": to_string(.unit) ?? ""}}
              ]
            }]
          }]
        }]
      }

sinks:
  vlogs:
    type: elasticsearch
    inputs:
      - docker
    endpoints:
      - http://victorialogs:9428/insert/elasticsearch/
    mode: bulk
    api_version: v8
    compression: gzip
    healthcheck:
      enabled: false
    query:
      _msg_field: message
      _time_field: timestamp
      _stream_fields: source_type,host,container_name

  vl_unifi:
    type: elasticsearch
    inputs:
      - unifi_cef
    endpoints:
      - http://victorialogs:9428/insert/elasticsearch/
    mode: bulk
    api_version: v8
    compression: gzip
    healthcheck:
      enabled: false
    query:
      _msg_field: msg,message,name
      _time_field: timestamp
      _stream_fields: source_type,deviceVendor,deviceProduct

  vl_pi_journal:
    type: elasticsearch
    inputs:
      - pi_journal_tag
    endpoints:
      - http://victorialogs:9428/insert/elasticsearch/
    mode: bulk
    api_version: v8
    compression: gzip
    healthcheck:
      enabled: false
    query:
      _msg_field: message
      _time_field: timestamp
      _stream_fields: source_type,host,unit

  # Dual-shipped alongside VictoriaLogs above (decided 2026-09-22) — SigNoz
  # is on trial, VictoriaLogs stays as the proven fallback until it's earned
  # full replacement (same "don't tear down until it's proven" call already
  # made for Alertmanager). One combined sink covers all three sources; OTLP
  # doesn't need VictoriaLogs's per-source _msg_field/_stream_fields
  # juggling — the otlp codec just carries the whole Vector event across as
  # the log record's body/attributes. See argocd/README.md's SigNoz section
  # and argocd/apps/signoz/httproute-otel.yaml for the ingestion endpoint —
  # unauthenticated on purpose (machine-to-machine OTLP, not a human page).
  signoz_otel:
    type: opentelemetry
    inputs:
      - docker_otlp
      - unifi_otlp
      - pi_journal_otlp
    protocol:
      type: http
      uri: https://otel.jakerobb.org/v1/logs
      method: post
      encoding:
        codec: otlp
