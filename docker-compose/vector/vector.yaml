sources:
  docker:
    type: docker_logs
    docker_host: unix:///var/run/docker.sock
    exclude_containers:
      - vector

  unifi_syslog:
    type: socket
    mode: udp
    address: 0.0.0.0:514
    decoding:
      codec: bytes

  # Talos nodes' kernel logs (the `talos.logging.kernel` kernel arg in each
  # worker's Image Factory schematic; see talos/README.md). One JSON object
  # per datagram, and Talos replays the whole boot's buffer once the network
  # is up, so a reboot re-sends about a thousand lines.
  talos_kernel:
    type: socket
    mode: udp
    address: 0.0.0.0:5140
    decoding:
      codec: json

  pi_journal:
    type: journald
    current_boot_only: true
    # Don't double-ingest Docker stdout; the `docker` source already has it.
    exclude_units:
      - docker.service
      - containerd.service

transforms:
  unifi_cef:
    type: remap
    inputs:
      - unifi_syslog
    source: |
      raw = string!(.message)
      # Guard with contains() first: find() returns null when the substring
      # is absent, and `null >= 0` throws. Most syslog lines are NOT CEF.
      if contains(raw, "CEF:0|") {
        idx = find(raw, "CEF:0|")
        parsed, err = parse_cef(slice!(raw, start: idx))
        if err == null {
          . = merge(., parsed)
        }
        del(.message)
      } else {
        parsed, err = parse_syslog(raw)
        if err == null {
          rcv = .timestamp          # Vector's receive time
          . = merge(., parsed)
          .timestamp = rcv          # prefer receive time over parsed time
        }
      }
      .source_type = "unifi"

  pi_journal_tag:
    type: remap
    inputs:
      - pi_journal
    source: |
      .source_type = "pi-journal"
      .host = "rpi5-1"
      # Surface the systemd unit as a clean, stream-friendly field.
      # journald source exposes it as _SYSTEMD_UNIT (may be absent for kernel).
      .unit = to_string(._SYSTEMD_UNIT) ?? "kernel"

  # Reshape into valid OTLP JSON (resourceLogs/scopeLogs/logRecords) before
  # the opentelemetry sink's `otlp` codec — that codec is a passthrough for
  # already-OTLP-shaped events, not a converter; found live (Vector 0.58.0
  # refused every event with "Log event does not contain OTLP top-level
  # fields") before adding these. One per source since each has different
  # field names for its message/attributes (they mirrored the per-sink
  # `_msg_field` settings of the VictoriaLogs sinks, since removed).
  #
  # Gotcha found live (2026-09-22): `to_string(.missing_field) ?? fallback`
  # does NOT fall through the way it looks like it should — VRL's
  # to_string() returns "" (no error at all) for an absent field, so `??`
  # never triggers and just locks onto the empty string from whichever
  # field was checked first. Confirmed via `vector vrl`: `to_string(.msg) ??
  # to_string(.message) ?? to_string(.name)` against `{"message": "hello
  # world"}` returned `""`, not `"hello world"`. Any multi-field fallback
  # below checks emptiness explicitly (`if body == "" { ... }`) instead of
  # relying on `??` to skip a genuinely-absent field.
  docker_otlp:
    type: remap
    inputs:
      - docker
    source: |
      body = to_string(.message) ?? ""
      ts_ns = to_string(to_unix_timestamp!(.timestamp, unit: "nanoseconds"))
      . = {
        "resourceLogs": [{
          "resource": {
            "attributes": [
              # docker_logs source's own `.host` is the *container's* own
              # hostname (Docker defaults that to the short container ID)
              # -- not the Vector host machine. Found live: logs were
              # showing up tagged e.g. "9c01ab64c2a1" instead of "rpi5-1".
              # Hardcode it, same as the other two sources below.
              {"key": "host.name", "value": {"stringValue": "rpi5-1"}},
              {"key": "source_type", "value": {"stringValue": "docker"}}
            ]
          },
          "scopeLogs": [{
            "scope": {},
            "logRecords": [{
              "timeUnixNano": ts_ns,
              "body": {"stringValue": body},
              "attributes": [
                {"key": "container_name", "value": {"stringValue": to_string(.container_name) ?? ""}},
                {"key": "container_id", "value": {"stringValue": to_string(.container_id) ?? ""}},
                {"key": "image", "value": {"stringValue": to_string(.image) ?? ""}},
                {"key": "container_created_at", "value": {"stringValue": to_string(.container_created_at) ?? ""}},
                {"key": "stream", "value": {"stringValue": to_string(.stream) ?? ""}}
              ]
            }]
          }]
        }]
      }

  unifi_otlp:
    type: remap
    inputs:
      - unifi_cef
    source: |
      body = to_string(.msg) ?? ""
      if body == "" { body = to_string(.message) ?? "" }
      if body == "" { body = to_string(.name) ?? "" }
      ts_ns = to_string(to_unix_timestamp!(.timestamp, unit: "nanoseconds"))
      # Every remaining field becomes an attribute, so SigNoz carries what
      # VictoriaLogs did. The body, timestamp and source_type already go
      # elsewhere (log body, timeUnixNano, resource attribute).
      attrs = []
      for_each(object!(.)) -> |key, value| {
        if !includes(["timestamp", "message", "msg", "source_type"], key) {
          val = to_string(value) ?? encode_json(value)
          attrs = push(attrs, {"key": key, "value": {"stringValue": val}})
        }
      }
      . = {
        "resourceLogs": [{
          "resource": {
            "attributes": [
              {"key": "host.name", "value": {"stringValue": "unifi"}},
              {"key": "source_type", "value": {"stringValue": "unifi"}}
            ]
          },
          "scopeLogs": [{
            "scope": {},
            "logRecords": [{
              "timeUnixNano": ts_ns,
              "body": {"stringValue": body},
              "attributes": attrs
            }]
          }]
        }]
      }

  pi_journal_otlp:
    type: remap
    inputs:
      - pi_journal_tag
    source: |
      body = to_string(.message) ?? ""
      ts_ns = to_string(to_unix_timestamp!(.timestamp, unit: "nanoseconds"))
      # Every remaining field becomes an attribute, so SigNoz carries what
      # VictoriaLogs did. The body, timestamp and source_type already go
      # elsewhere (log body, timeUnixNano, resource attribute).
      attrs = []
      for_each(object!(.)) -> |key, value| {
        if !includes(["timestamp", "message", "msg", "source_type"], key) {
          val = to_string(value) ?? encode_json(value)
          attrs = push(attrs, {"key": key, "value": {"stringValue": val}})
        }
      }
      . = {
        "resourceLogs": [{
          "resource": {
            "attributes": [
              {"key": "host.name", "value": {"stringValue": "rpi5-1"}},
              {"key": "source_type", "value": {"stringValue": "pi-journal"}}
            ]
          },
          "scopeLogs": [{
            "scope": {},
            "logRecords": [{
              "timeUnixNano": ts_ns,
              "body": {"stringValue": body},
              "attributes": attrs
            }]
          }]
        }]
      }

  # Talos kernel log -> OTLP. `host` is the sending node's IP (the socket
  # source sets it), mapped to the Kubernetes node name so SigNoz's
  # k8s.node.name matches what the kubelet-side logs use. A node missing from
  # the map falls back to its IP; add new nodes here (and see the "Talos
  # kernel logs" section of talos/README.md).
  talos_kernel_otlp:
    type: remap
    inputs:
      - talos_kernel
    source: |
      nodes = {
        "192.168.102.31": "talos-worker-1",
        "192.168.102.32": "talos-worker-2",
        "192.168.102.34": "talos-worker-mbp"
      }
      ip = to_string(.host) ?? ""
      node, err = string(get!(nodes, [ip]))
      if err != null { node = ip }
      body = strip_whitespace(to_string(.msg) ?? "")
      ts = parse_timestamp(to_string(get!(., ["talos-time"])) ?? "", format: "%+") ?? now()
      ts_ns = to_string(to_unix_timestamp(ts, unit: "nanoseconds"))
      . = {
        "resourceLogs": [{
          "resource": {
            "attributes": [
              {"key": "host.name", "value": {"stringValue": node}},
              {"key": "k8s.node.name", "value": {"stringValue": node}},
              {"key": "source_type", "value": {"stringValue": "talos-kernel"}}
            ]
          },
          "scopeLogs": [{
            "scope": {},
            "logRecords": [{
              "timeUnixNano": ts_ns,
              "severityText": to_string(get!(., ["priority"])) ?? "",
              "body": {"stringValue": body},
              "attributes": [
                {"key": "facility", "value": {"stringValue": to_string(get!(., ["facility"])) ?? ""}},
                {"key": "seq", "value": {"stringValue": to_string(get!(., ["seq"])) ?? ""}}
              ]
            }]
          }]
        }]
      }

sinks:
  # SigNoz is the only destination. Logs also went to VictoriaLogs until
  # 2026-10-01 (dual-shipped since 2026-09-22 while SigNoz was on trial); its
  # three elasticsearch sinks are gone from here. One combined OTLP sink covers
  # all four sources: the *_otlp transforms above reshape each event into
  # OTLP log records, carrying every field as an attribute. See
  # argocd/README.md's SigNoz section and
  # argocd/apps/signoz/httproute-otel.yaml for the ingestion endpoint —
  # unauthenticated on purpose (machine-to-machine OTLP, not a human page).
  signoz_otel:
    type: opentelemetry
    inputs:
      - docker_otlp
      - unifi_otlp
      - pi_journal_otlp
      - talos_kernel_otlp
    protocol:
      type: http
      uri: https://otel.jakerobb.org/v1/logs
      method: post
      encoding:
        codec: otlp
