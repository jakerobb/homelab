sources:
  docker:
    type: docker_logs
    docker_host: unix:///var/run/docker.sock
    exclude_containers:
      - vector
      - victorialogs

  unifi_syslog:
    type: socket
    mode: udp
    address: 0.0.0.0:514
    decoding:
      codec: bytes

  pi_journal:
    type: journald
    current_boot_only: true
    # Don't double-ingest Docker stdout; the `docker` source already has it.
    exclude_units:
      - docker.service
      - containerd.service

transforms:
  unifi_cef:
    type: remap
    inputs:
      - unifi_syslog
    source: |
      raw = string!(.message)
      # Guard with contains() first: find() returns null when the substring
      # is absent, and `null >= 0` throws. Most syslog lines are NOT CEF.
      if contains(raw, "CEF:0|") {
        idx = find(raw, "CEF:0|")
        parsed, err = parse_cef(slice!(raw, start: idx))
        if err == null {
          . = merge(., parsed)
        }
        del(.message)
      } else {
        parsed, err = parse_syslog(raw)
        if err == null {
          rcv = .timestamp          # Vector's receive time
          . = merge(., parsed)
          .timestamp = rcv          # prefer receive time over parsed time
        }
      }
      .source_type = "unifi"

  pi_journal_tag:
    type: remap
    inputs:
      - pi_journal
    source: |
      .source_type = "pi-journal"
      .host = "rpi5-1"
      # Surface the systemd unit as a clean, stream-friendly field.
      # journald source exposes it as _SYSTEMD_UNIT (may be absent for kernel).
      .unit = to_string(._SYSTEMD_UNIT) ?? "kernel"

sinks:
  vlogs:
    type: elasticsearch
    inputs:
      - docker
    endpoints:
      - http://victorialogs:9428/insert/elasticsearch/
    mode: bulk
    api_version: v8
    compression: gzip
    healthcheck:
      enabled: false
    query:
      _msg_field: message
      _time_field: timestamp
      _stream_fields: source_type,host,container_name

  vl_unifi:
    type: elasticsearch
    inputs:
      - unifi_cef
    endpoints:
      - http://victorialogs:9428/insert/elasticsearch/
    mode: bulk
    api_version: v8
    compression: gzip
    healthcheck:
      enabled: false
    query:
      _msg_field: msg,message,name
      _time_field: timestamp
      _stream_fields: source_type,deviceVendor,deviceProduct

  vl_pi_journal:
    type: elasticsearch
    inputs:
      - pi_journal_tag
    endpoints:
      - http://victorialogs:9428/insert/elasticsearch/
    mode: bulk
    api_version: v8
    compression: gzip
    healthcheck:
      enabled: false
    query:
      _msg_field: message
      _time_field: timestamp
      _stream_fields: source_type,host,unit
