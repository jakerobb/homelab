x-dns: &dns
  dns:
    - 192.168.102.2

services:
  caddy:
    <<: *dns
    image: ghcr.io/caddybuilds/caddy-cloudflare:2.11.4
    container_name: caddy
    restart: unless-stopped
    network_mode: host
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

  homeassistant:
    <<: *dns
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:2026.9.4
    privileged: true
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=America/Detroit
      - OFFICE_UPS_NUT_PASSWORD=__from-file__
    volumes:
      - ./homeassistant:/config
      - /run/dbus:/run/dbus:ro
      - ./resolv-host.conf:/etc/resolv.conf:ro
    # Added directly on rpi5-1 at some point, never backfilled here until
    # the docker-compose/ split-brain cleanup (2026-09-20) — found via a
    # live diff against the deployed compose file. RPi5 GPIO UART, presumably
    # for a serial-connected integration (not one of the standalone
    # Zigbee2MQTT/Z-Wave JS UI containers, which own their own USB dongles).
    devices:
      - /dev/ttyAMA0
      - /dev/serial0

  scrypted:
    <<: *dns
    container_name: scrypted
    image: koush/scrypted:v0.147.0-noble-full
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=America/Detroit
    volumes:
      - ./scrypted:/server/volume

  modbus-controller:
    <<: *dns
    container_name: modbus-controller
    image: jakerobb/modbus-eth-controller:20251201
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./modbus-programs:/etc/modbus:ro
      - ./resolv-host.conf:/etc/resolv.conf:ro

  nut-upsd:
    <<: *dns
    image: instantlinux/nut-upsd:2.8.5-r1
    container_name: nut-upsd
    restart: unless-stopped
    privileged: true
    volumes:
      - ./nut-conf:/etc/nut/local
      - ./secrets/nut-upsd-password:/run/secrets/nut-upsd-password
      - /dev/bus/usb:/dev/bus/usb
    environment:
      # Use the user defined in upsd.users for monitoring.
      - API_USER=${NUT_USER}
    ports:
      - "3493:3493"

  nut-webui:
    <<: *dns
    container_name: nut-webui
    restart: unless-stopped
    depends_on:
      - nut-upsd
    # Upstream only publishes `latest` (no version tags), so this is pinned by
    # digest instead; Renovate opens a PR when `latest` moves.
    image: edgd1er/webnut:latest@sha256:bb41f38d03c7129b720c4a2549dcc2ccd12918993bfca313a1551284d0a5b22b
    environment:
      - UPS_HOST=nut-upsd
      - UPS_PORT=3493
      - UPS_USER=${NUT_USER}
      - UPS_PASSWORD=${NUT_PASSWORD}
    ports:
      - "6543:6543"

  change-detection:
    <<: *dns
    network_mode: host
    image: dgtlmoon/changedetection.io:0.60.7
    container_name: change-detection
    environment:
      - PLAYWRIGHT_DRIVER_URL=ws://192.168.102.2:3000/?stealth=1&--disable-web-security=true&blockAds=true
    ports:
      - 9898:5000
    volumes:
      - ./change-detection:/datastore
      - ./resolv-host.conf:/etc/resolv.conf:ro
    restart: unless-stopped
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "delta"
      #tsdproxy.container_port: 9898
    depends_on:
      browserless:
        condition: service_started

  browserless:
    <<: *dns
    volumes:
      - ./resolv-host.conf:/etc/resolv.conf:ro
    network_mode: host
    image: ghcr.io/browserless/chromium:v2.56.7
    container_name: browserless
    environment:
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1024
      - SCREEN_DEPTH=16
      - ENABLE_DEBUGGER=false
      - TIMEOUT=60000
      - CONCURRENT=10
      - NO_COLOR=1
      - FORCE_COLOR=0
      - DEBUG_COLORS=no
    ports:
      - 3000:3000
    restart: unless-stopped

  # optimizer + network-optimizer-speedtest migrated to the k8s cluster
  # 2026-09-28 (one pod, both containers) — see manifests/network-optimizer/
  # and argocd/README.md's NetworkOptimizer section. compose-deploy's
  # --remove-orphans stops the old containers on merge; ./data, ./logs and
  # ./ssh-keys on rpi5-1 were copied into the cluster's PVC first and can be
  # deleted by hand once the migration is confirmed.

  # Migrated to the k8s cluster 2026-09-20 — see argocd/apps/ntfy/ and
  # argocd/README.md's ntfy section. Not removed until the cluster-hosted
  # replacement is confirmed reachable at https://ntfy.jakerobb.org and the
  # stale pre-migration Cloudflare DNS record is cleared (that record
  # predates external-dns and isn't touched by it automatically); pull the
  # ./ntfy/cache and ./ntfy/conf directories on rpi5-1 by hand afterward,
  # they aren't reused by the k8s deployment.

  unbound:
    <<: *dns
    image: klutchell/unbound:1.26.1
    container_name: unbound
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./unbound/custom.conf.d:/etc/unbound/custom.conf.d

  influxdb:
    <<: *dns
    container_name: influxdb
    image: influxdb:2.9.1
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - TZ=America/Detroit
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_ORG=home
      - DOCKER_INFLUXDB_INIT_BUCKET=telegraf
      - DOCKER_INFLUXDB_INIT_RETENTION=7d
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN}
    volumes:
      - ./influxdb/data:/var/lib/influxdb2
      - ./influxdb/config:/etc/influxdb2

  grafana:
    <<: *dns
    container_name: grafana
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    depends_on:
      - influxdb
    ports:
      - "3001:3000"
    environment:
      - TZ=America/Detroit
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://grafana.jakerobb.org
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,victoriametrics-logs-datasource
    volumes:
      - ./grafana:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning:ro

  telegraf:
    <<: *dns
    container_name: telegraf
    image: telegraf:1.40.1
    restart: unless-stopped
    user: "telegraf:990"
    depends_on:
      - influxdb
    environment:
      - TZ=America/Detroit
      - INFLUXDB_TOKEN=${INFLUXDB_ADMIN_TOKEN}
      - HOST_ETC=/hostfs/etc
      - HOST_PROC=/hostfs/proc
      - HOST_SYS=/hostfs/sys
      - HOST_VAR=/hostfs/var
      - HOST_RUN=/hostfs/run
      - HOST_MOUNT_PREFIX=/hostfs
      - NUT_USER=${NUT_USER}
      - NUT_PASSWORD=${NUT_PASSWORD}
      - UNIFI_TOKEN=${UNIFI_TOKEN}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /run/udev:/run/udev:ro
      - /dev:/dev:ro
      - /:/hostfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./telegraf/scripts:/etc/telegraf/scripts:ro
      - /usr/bin/jq:/usr/bin/jq:ro
      - /lib/aarch64-linux-gnu/libjq.so.1:/lib/aarch64-linux-gnu/libjq.so.1:ro
      - /lib/aarch64-linux-gnu/libonig.so.5:/lib/aarch64-linux-gnu/libonig.so.5:ro

  nut-influx-relay:
    <<: *dns
    container_name: nut-influx-relay
    image: jakerobb/nut-influx-relay:20260421
    restart: unless-stopped
    depends_on:
      - influxdb
    environment:
#      - LOG_LEVEL=debug
      - TZ=America/Detroit
      - INFLUXDB_TOKEN=${NUT_RELAY_INFLUXDB_TOKEN}
      - NUT_USER=${NUT_USER}
      - NUT_PASSWORD=${NUT_PASSWORD}
    volumes:
      - ./nut-influx-relay/config.yaml:/etc/nut-influx-relay/config.yaml:ro
    ports:
      - "8085:8080"

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: mosquitto
    restart: unless-stopped
    <<: *dns
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    ports:
      - "1883:1883"

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:2.14.1
    container_name: zigbee2mqtt
    restart: unless-stopped
    <<: *dns
    depends_on:
      - mosquitto
    volumes:
      - ./zigbee2mqtt/data:/app/data
    ports:
      - "8090:8080"
    environment:
      - TZ=America/Detroit

  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:8.1.0
    container_name: matter-server
    restart: unless-stopped
    network_mode: host
    security_opt:
      - apparmor=unconfined
    volumes:
      - ./matter-server/data:/data
      - /run/dbus:/run/dbus:ro

  zwave-js-ui:
    container_name: zwave-js-ui
    image: zwavejs/zwave-js-ui:11.24.1
    restart: unless-stopped
    ports:
      - "8091:8091"   # Web UI
      - "3010:3000"   # WebSocket for HA
    volumes:
      - ./zwave-js-ui:/usr/src/app/store
    environment:
      - TZ=America/Detroit

  victorialogs:
    image: victoriametrics/victoria-logs:v1.52.0
    container_name: victorialogs
    restart: unless-stopped
    command:
      - -storageDataPath=/vlogs
      - -retentionPeriod=90d
      - '-syslog.streamFields.udp=[]'
      - '-syslog.ignoreFields.udp=["app_name"]'
      # - -syslog.useLocalTimestamp.udp    # uncomment if UniFi timestamps drift (the tz caveat from before)
    ports:
      - "9428:9428"        # HTTP API + web UI — consider binding to localhost or fronting via Caddy
    volumes:
      - victorialogs-data:/vlogs           # swap to a bind path if you want it in your backup set

  vector:
    image: timberio/vector:0.58.0-debian
    container_name: vector
    restart: unless-stopped
    depends_on:
      - victorialogs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /run/log/journal:/run/log/journal:ro   # volatile, if present
    # If Vector can't read the socket (root:docker), grant the gid:
    # group_add:
    #   - "999"   # getent group docker | cut -d: -f3
    ports:
      - "514:514/udp"

volumes:
  caddy_data:
  caddy_config:
  victorialogs-data:
