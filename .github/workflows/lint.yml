# Repo-wide static checks. GitHub-hosted runners only — none of this needs
# the homelab network or any secrets, so it's safe on any PR (outside
# contributors' runs still need approval, per the repo setting).
#
# One job, not one per check: every check takes seconds, and Actions bills
# each job rounded up to a whole minute, so six jobs cost ~6 min a run vs ~2.
# PRs only — a merge to main re-runs checks the PR already passed.
name: lint

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=github-releases depName=helm/helm
      HELM_VERSION: v4.3.0
      # renovate: datasource=github-releases depName=yannh/kubeconform
      KUBECONFORM_VERSION: v0.8.0
    steps:
      # --- Setup: everything the checks need, before any check runs, so a
      # failing check can't skip setup for the ones after it.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: pip install pyyaml
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install kubeconform
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          curl -fsSLO "${base}/kubeconform-linux-amd64.tar.gz"
          curl -fsSL "${base}/CHECKSUMS" | grep ' kubeconform-linux-amd64.tar.gz$' | sha256sum -c -
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # --- Checks: each runs even if an earlier one failed (!cancelled()),
      # so one run reports every problem, same as separate jobs did.
      - name: SOPS files encrypted
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check-sops-encrypted.py

      - name: Renovate config
        if: ${{ !cancelled() }}
        uses: suzuki-shunsuke/github-action-renovate-config-validator@v2.2.0
        with:
          strict: "true"

      - name: Renovate can parse Applications
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check-renovate-parse.py

      # shellcheck is preinstalled on ubuntu-latest.
      - name: shellcheck
        if: ${{ !cancelled() }}
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

      # The same build docs.jakerobb.org runs (manifests/docs/), but --strict:
      # a broken link, a missing anchor, or a Markdown file left out of the
      # nav fails the PR instead of quietly shipping.
      - name: Docs site
        if: ${{ !cancelled() }}
        env:
          DOCS_GIT_DATES: "false"
          NO_MKDOCS_2_WARNING: "true"
        run: |
          pip install -r docs-site/requirements.txt
          mkdocs build --strict -f docs-site/mkdocs.yml -d "$RUNNER_TEMP/site"

      # Helm-templates every Application's chart with its own values, plus the
      # raw/kustomized manifests — see the script's docstring. A chart that
      # fails to render (bad version, values that break a template) fails here.
      - name: Render Kubernetes manifests
        id: render
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/render-manifests.py "$RUNNER_TEMP/rendered"

      # Kubernetes schemas plus the community CRD catalog (Gateway API,
      # cert-manager, prometheus-operator, ArgoCD, Cilium...). -strict rejects
      # unknown fields, i.e. typos. CustomResourceDefinitions themselves are
      # skipped: there's no upstream schema for that kind, and they're
      # chart-vendored anyway.
      - name: Validate Kubernetes manifests
        if: ${{ !cancelled() && steps.render.outcome == 'success' }}
        run: |
          kubeconform -strict -summary -output text \
            -skip CustomResourceDefinition \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "$RUNNER_TEMP/rendered"

      # Picks up .github/actionlint.yaml (self-hosted runner labels), and
      # shellchecks workflow run: blocks too.
      - name: actionlint
        if: ${{ !cancelled() }}
        uses: raven-actions/actionlint@v2
