# Repo-wide static checks. Runs on the in-cluster ARC scale set `arc-runner`
# (argocd/apps/arc-runners/) rather than a GitHub-hosted runner: the pods have
# no secrets, no cluster credentials, and no route to the LAN (NetworkPolicy),
# and the cluster's workers render the manifests ~3x faster than ubuntu-latest.
# Outside contributors' runs still need approval, per the repo setting.
#
# The runner image (images/arc-runner/) has every tool the checks use, so a
# job is just checkout plus the checks. Tool versions live in its Dockerfile.
#
# One job, not one per check: every check takes seconds, and each job pays
# for its own pod start.
# PRs only — a merge to main re-runs checks the PR already passed.
name: lint

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: arc-runner
    # pull-requests: write is only for the render-diff step's sticky PR comment.
    # A fork PR's token is read-only regardless, so that step (and lint) fails
    # there, on purpose.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --- Checks: each runs even if an earlier one failed (!cancelled()),
      # so one run reports every problem, same as separate jobs did.
      - name: SOPS files encrypted
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check-sops-encrypted.py

      - name: Renovate config
        if: ${{ !cancelled() }}
        run: renovate-config-validator --strict

      - name: Renovate can parse Applications
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/check-renovate-parse.py

      - name: shellcheck
        if: ${{ !cancelled() }}
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

      # The same build docs.jakerobb.org runs (manifests/docs/), but --strict:
      # a broken link, a missing anchor, or a Markdown file left out of the
      # nav fails the PR instead of quietly shipping.
      - name: Docs site
        if: ${{ !cancelled() }}
        env:
          DOCS_GIT_DATES: "false"
          NO_MKDOCS_2_WARNING: "true"
        run: |
          # A no-op unless the PR changes the pins the image was built with.
          pip install -r docs-site/requirements.txt
          mkdocs build --strict -f docs-site/mkdocs.yml -d "$RUNNER_TEMP/site"

      # Helm-templates every Application's chart with its own values, plus the
      # raw/kustomized manifests — see the script's docstring. A chart that
      # fails to render (bad version, values that break a template) fails here.
      - name: Render Kubernetes manifests
        id: render
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/render-manifests.py "$RUNNER_TEMP/rendered"

      # Kubernetes schemas plus the community CRD catalog (Gateway API,
      # cert-manager, prometheus-operator, ArgoCD, Cilium...). -strict rejects
      # unknown fields, i.e. typos. CustomResourceDefinitions themselves are
      # skipped: there's no upstream schema for that kind, and they're
      # chart-vendored anyway. AutoscalingRunnerSet (ARC) is skipped too: the
      # catalog's schema lags the chart (it rejects `listenerConfig`, which
      # chart 0.15.0 sets by default).
      #
      # The external-secrets.io schemas are pinned to a catalog commit from
      # 2026-10-08, listed before `main` so it wins for that group (other
      # groups 404 there and fall through). The catalog's
      # clustersecretstore_v1.json changed that day and kubeconform can no
      # longer load it ("could not find schema for ClusterSecretStore"). Drop
      # the pin once `main` validates again (try the command below without it).
      - name: Validate Kubernetes manifests
        if: ${{ !cancelled() && steps.render.outcome == 'success' }}
        run: |
          kubeconform -strict -summary -output text \
            -skip CustomResourceDefinition,AutoscalingRunnerSet \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/f3e4382095909ac60000da025f323ba44d4c738a/external-secrets.io/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "$RUNNER_TEMP/rendered"

      # The base branch rendered the same way, for the two steps below that
      # compare against it. Failing to render it only downgrades them (see each).
      - name: Render base branch
        id: base
        if: ${{ !cancelled() && steps.render.outcome == 'success' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git fetch --quiet --depth=1 origin "$BASE_REF" \
              && git worktree add --quiet "$RUNNER_TEMP/base" FETCH_HEAD \
              && python3 "$RUNNER_TEMP/base/scripts/ci/render-manifests.py" "$RUNNER_TEMP/rendered-base" >/dev/null; then
            echo "rendered=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Couldn't render $BASE_REF; the image check will cover every image and there will be no diff comment"
          fi

      # Every image the render references has to exist and be built for each
      # architecture its pod can land on (both, unless the pod pins
      # kubernetes.io/arch). A tag missing one is an ImagePullBackOff after
      # ArgoCD syncs the merge. Only images new vs. the base branch are fetched
      # from the registries, to stay under Docker Hub's anonymous pull limit,
      # which the cluster's own pulls share; without a base render, all of them
      # are. See scripts/ci/check-image-arch.py.
      - name: Image architectures
        if: ${{ !cancelled() && steps.render.outcome == 'success' }}
        run: |
          baseline=()
          if [ "${{ steps.base.outputs.rendered }}" = true ]; then
            baseline=(--baseline "$RUNNER_TEMP/rendered-base")
          fi
          python3 scripts/ci/check-image-arch.py "$RUNNER_TEMP/rendered" "${baseline[@]}"

      # What the PR changes in the rendered manifests: added, removed (ArgoCD
      # prunes), immutable-field changes, and a field-level diff, as one sticky
      # PR comment plus the job summary. A difference never fails the step, but
      # not being able to post the comment does, and so does a bug in the script:
      # a PR with no report shouldn't merge unnoticed (Renovate's auto-merge
      # included). See scripts/ci/diff-rendered.py.
      - name: Rendered manifest diff
        if: ${{ !cancelled() && steps.base.outputs.rendered == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/diff-rendered.py "$RUNNER_TEMP/rendered-base" "$RUNNER_TEMP/rendered" --comment

      # Picks up .github/actionlint.yaml (self-hosted runner labels), and
      # shellchecks workflow run: blocks too.
      - name: actionlint
        if: ${{ !cancelled() }}
        run: actionlint
