# Builds the ARC runner image (images/arc-runner/) and publishes it to ghcr.io.
# Runs on GitHub-hosted runners: the ARC pods have no Docker, and an image that
# builds itself in a pod running that image is a bad idea anyway.
#
# PRs build without pushing, so a broken Dockerfile (or a bad Renovate bump of
# one of its pinned tools) fails the PR. A merge to main pushes. Tags are
# `1.<run number>`, so Renovate can see newer ones and bump the scale set's
# pin in argocd/apps/arc-runners/application.yaml.
#
# amd64 only: the scale set pins amd64 nodes. Add linux/arm64 here (the
# Dockerfile supports it; QEMU makes the build several times slower) when the
# Pi worker should run jobs.
name: runner-image

on:
  pull_request:
    paths:
      - images/arc-runner/**
      - docs-site/requirements.txt
      - .github/workflows/runner-image.yml
  push:
    branches: [main]
    paths:
      - images/arc-runner/**
      - docs-site/requirements.txt
      - .github/workflows/runner-image.yml
  # Rebuild by hand, e.g. for new Ubuntu packages in the base image.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/jakerobb/homelab-arc-runner

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    # Pushing needs this; PR builds don't log in at all.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ github.event_name != 'pull_request' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/arc-runner/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:1.${{ github.run_number }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
