# Pins every node's resolvers instead of taking them from DHCP. Added
# 2026-09-30, before the in-cluster Unbound (192.168.102.130, hardware-agnostic
# VIP) went into the Server VLAN's DHCP. Nodes need DNS to pull the Unbound
# image, so they must never depend on Unbound running in the cluster.
#
# 192.168.102.2 is Compose's Unbound on rpi5-1; 1.1.1.1 is the fallback if it's
# down (it can't resolve .lan names, but nodes rarely need those). Not .3: that
# was the old Pi's Wi-Fi interface, retired in the 2026-10-06 jump box swap. The
# swap moved .2 to a new Pi, so this stays valid.
#
# Strategic merge. `talosctl patch machineconfig` appends to list fields, so
# re-applying this to a node that already has it would duplicate the entries
# (harmless, but untidy); check `talosctl get resolvers` first. See
# talos/README.md.
machine:
  network:
    nameservers:
      - 192.168.102.2
      - 1.1.1.1
