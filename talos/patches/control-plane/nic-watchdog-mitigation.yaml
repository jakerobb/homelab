apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rpi5-nic-mitigation
  namespace: node-tuning
  labels:
    app: rpi5-nic-mitigation
spec:
  selector:
    matchLabels:
      app: rpi5-nic-mitigation
  template:
    metadata:
      labels:
        app: rpi5-nic-mitigation
    spec:
      hostNetwork: true
      # Every arm64 node, not just control planes: the only arm64 hardware is
      # Raspberry Pi 5s (same onboard NIC), and the jump-box swap adds a Pi 5
      # worker (talos-worker-3). amd64 nodes have no `end0`.
      nodeSelector:
        kubernetes.io/arch: arm64
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: ethtool-mitigation
          image: nicolaka/netshoot:latest
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                ethtool -K end0 tso off gso off 2>&1
                ethtool --set-eee end0 eee off 2>&1 || true
                sleep 30
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add: ["NET_ADMIN"]
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
