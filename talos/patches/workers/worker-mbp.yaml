machine:
  network:
    hostname: talos-worker-mbp
  # UTM/QEMU under macOS on the 2018 MacBook Pro — a temporary stopgap worker
  # until the Mac Studio arrives (~Nov 2026), hence the hardware-identifying
  # name instead of the usual decoupled talos-worker-N convention (see
  # talos/README.md's "MS-A2 workers: decided values" for why every other
  # node is named that way). install.disk/image are overridden here rather
  # than left to the shared worker.yaml template because the disk device
  # name is hypervisor-specific: UTM's imported qcow2 shows up as /dev/sda
  # (SATA/AHCI emulation), not /dev/nvme0n1 like the Proxmox-based workers.
  # Schematic includes extraKernelArgs: [tsc=reliable] on top of the usual
  # iscsi-tools/util-linux-tools extensions — added 2026-09-22 to fix
  # recurring NodeClockNotSynchronising alerts. Root cause: under QEMU/UTM,
  # the hypervisor briefly pausing/scheduling the vCPU makes the kernel's
  # acpi_pm watchdog misread normal scheduling jitter as real TSC drift,
  # eventually demoting the clocksource ("Marking clocksource 'tsc' as
  # unstable") even though Talos's own NTP sync (time.cloudflare.com) was
  # never actually wrong — the alert was on node-exporter's lower-level
  # kernel timex metric, not Talos's NTP status. tsc=reliable is the
  # standard workaround for this exact false-positive-under-virtualization
  # pattern (tells the kernel to trust TSC and ignore the watchdog).
  # Confirmed this field only works via a schematic customization, not the
  # machine.install.extraKernelArgs machine-config field — Talos warns
  # "extra kernel arguments are not supported when booting using SDBoot"
  # and silently no-ops it. Only Proxmox-based workers unaffected (real
  # hardware host, no hypervisor scheduling jitter to misread).
  install:
    disk: /dev/sda
    image: factory.talos.dev/installer/0b0257c7d2fd5e4693af3859e726ce2216f60d8456d330009efb1ac249789386:v1.14.1
  # Needed for democratic-csi's iSCSI node driver, same as worker-1/worker-2
  # — see talos/README.md#iscsi-tools-extension-added-2026-09-15.
  kernel:
    modules:
      - name: iscsi_tcp
  kubelet:
    extraMounts:
      - destination: /etc/iscsi
        type: bind
        source: /etc/iscsi
        options:
          - bind
          - rshared
          - rw
      - destination: /var/lib/iscsi
        type: bind
        source: /var/lib/iscsi
        options:
          - bind
          - rshared
          - rw
