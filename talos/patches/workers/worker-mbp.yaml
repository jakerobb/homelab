machine:
  network:
    hostname: talos-worker-mbp
    # Static IPv6 default route via the UniFi gateway's link-local address (added 2026-10-28). The gateway's
    # Router Advertisements carry a 1800s lifetime but arrive less often than that on these nodes, and
    # nothing here re-solicits one, so the kernel's RA-learned default route lapsed and the node lost IPv6
    # to other VLANs (matter-server then couldn't reach the Nest at its ULA on Cloud IoT). Metric 2048 so
    # the RA-learned route (1024) still wins whenever it's present. Listing the interface turns off
    # Talos's implicit DHCP, hence the explicit `dhcp: true`. The link-local address is derived from the
    # gateway's MAC (1c:0b:8b:14:a5:d5); update it if the gateway is replaced.
    # Static ULA on the Server VLAN's prefix (added 2026-10-30), host part = the IPv4 last octet. The same
    # missing RAs mean SLAAC never renews the address either: it expired 24h after boot and matter-server
    # (hostNetwork) had no source address for the Nest or for Thread. The jump box holds ::2 on this prefix.
    interfaces:
      - interface: enp0s1
        dhcp: true
        addresses:
          - fd3d:b17d:9f8e:102::34/64
        routes:
          - network: "::/0"
            gateway: "fe80::1e0b:8bff:fe14:a5d5"
            metric: 2048
  # Host NIC link speed in Mbps (UTM VM on the MBP, 2.5GbE adapter). An integer rather than
  # "10GbE" so pods can use nodeAffinity's Gt/Lt operators: NetworkOptimizer
  # prefers the fastest node, and talos/cilium/l2-announcement-policy-10g.yaml
  # selects on it. Applied live, no reboot; see talos/README.md's
  # "Node NIC-speed labels".
  nodeLabels:
    homelab.jakerobb.org/nic-speed-mbps: "2500"
  # Accept Route Information Options in Router Advertisements (max prefix length 64; the kernel
  # default of 0 ignores them). Thread border routers on this VLAN (a HomePod mini, added 2026-10-27)
  # advertise a route to the Thread mesh's OMR prefix this way, which is how matter-server (hostNetwork,
  # any worker) reaches Thread devices. Per-interface because the kernel's `all` value doesn't apply to
  # this setting, hence the NIC name in this per-node file.
  sysctls:
    net.ipv6.conf.enp0s1.accept_ra_rt_info_max_plen: "64"
  # UTM/QEMU under macOS on the 2018 MacBook Pro — a temporary stopgap worker
  # until the Mac Studio arrives (~Nov 2026), hence the hardware-identifying
  # name instead of the usual decoupled talos-worker-N convention (see
  # talos/README.md's "MS-A2 workers: decided values" for why every other
  # node is named that way). install.disk/image are overridden here rather
  # than left to the shared worker.yaml template because the disk device
  # name is hypervisor-specific: UTM's imported qcow2 shows up as /dev/sda
  # (SATA/AHCI emulation), not /dev/nvme0n1 like the Proxmox-based workers.
  # Schematic includes extraKernelArgs: [tsc=reliable] (plus the kernel-log
  # one, see talos/README.md's "Talos kernel logs") on top of the usual
  # iscsi-tools/util-linux-tools extensions — added 2026-09-22 to fix
  # recurring NodeClockNotSynchronising alerts. Root cause: under QEMU/UTM,
  # the hypervisor briefly pausing/scheduling the vCPU makes the kernel's
  # acpi_pm watchdog misread normal scheduling jitter as real TSC drift,
  # eventually demoting the clocksource ("Marking clocksource 'tsc' as
  # unstable") even though Talos's own NTP sync (time.cloudflare.com) was
  # never actually wrong — the alert was on node-exporter's lower-level
  # kernel timex metric, not Talos's NTP status. tsc=reliable is the
  # standard workaround for this exact false-positive-under-virtualization
  # pattern (tells the kernel to trust TSC and ignore the watchdog).
  # Confirmed this field only works via a schematic customization, not the
  # machine.install.extraKernelArgs machine-config field — Talos warns
  # "extra kernel arguments are not supported when booting using SDBoot"
  # and silently no-ops it. Only Proxmox-based workers unaffected (real
  # hardware host, no hypervisor scheduling jitter to misread).
  install:
    disk: /dev/sda
    image: factory.talos.dev/installer/fc5e78730c2f3ed1f1939294d5cf2340c160d940f03994daf3ca4fbaf022f203:v1.14.2
  # Needed for democratic-csi's iSCSI node driver, same as worker-1/worker-2
  # — see talos/README.md#iscsi-tools-extension-added-2026-09-15.
  kernel:
    modules:
      - name: iscsi_tcp
  kubelet:
    extraMounts:
      - destination: /etc/iscsi
        type: bind
        source: /etc/iscsi
        options:
          - bind
          - rshared
          - rw
      - destination: /var/lib/iscsi
        type: bind
        source: /var/lib/iscsi
        options:
          - bind
          - rshared
          - rw
