machine:
  network:
    hostname: talos-worker-1
    # Static IPv6 default route via the UniFi gateway's link-local address (added 2026-10-28). The gateway's
    # Router Advertisements carry a 1800s lifetime but arrive less often than that on these nodes, and
    # nothing here re-solicits one, so the kernel's RA-learned default route lapsed and the node lost IPv6
    # to other VLANs (matter-server then couldn't reach the Nest at its ULA on Cloud IoT). Metric 2048 so
    # the RA-learned route (1024) still wins whenever it's present. Listing the interface turns off
    # Talos's implicit DHCP, hence the explicit `dhcp: true`. The link-local address is derived from the
    # gateway's MAC (1c:0b:8b:14:a5:d5); update it if the gateway is replaced.
    # Static ULA on the Server VLAN's prefix (added 2026-10-30), host part = the IPv4 last octet. The same
    # missing RAs mean SLAAC never renews the address either: it expired 24h after boot and matter-server
    # (hostNetwork) had no source address for the Nest or for Thread. The jump box holds ::2 on this prefix.
    interfaces:
      - interface: ens18
        dhcp: true
        addresses:
          - fd3d:b17d:9f8e:102::31/64
        routes:
          - network: "::/0"
            gateway: "fe80::1e0b:8bff:fe14:a5d5"
            metric: 2048
  # Host NIC link speed in Mbps (MS-A2 Proxmox VM, 10GbE uplink). An integer rather than
  # "10GbE" so pods can use nodeAffinity's Gt/Lt operators: NetworkOptimizer
  # prefers the fastest node, and talos/cilium/l2-announcement-policy-10g.yaml
  # selects on it. Applied live, no reboot; see talos/README.md's
  # "Node NIC-speed labels".
  nodeLabels:
    homelab.jakerobb.org/nic-speed-mbps: "10000"
  # Accept Route Information Options in Router Advertisements (max prefix length 64; the kernel
  # default of 0 ignores them). Thread border routers on this VLAN (a HomePod mini, added 2026-10-27)
  # advertise a route to the Thread mesh's OMR prefix this way, which is how matter-server (hostNetwork,
  # any worker) reaches Thread devices. Per-interface because the kernel's `all` value doesn't apply to
  # this setting, hence the NIC name in this per-node file.
  sysctls:
    net.ipv6.conf.ens18.accept_ra_rt_info_max_plen: "64"
  # Needed for democratic-csi's iSCSI node driver (added 2026-09-15) — see
  # talos/README.md#iscsi-tools-extension-added-2026-09-15. /etc/iscsi
  # genuinely exists on the node (the iscsi-tools extension creates it), but
  # kubelet runs in its own constrained mount namespace on Talos and doesn't
  # see it by default, so a plain hostPath volume mount fails with
  # "hostPath type check failed: /etc/iscsi is not a directory" even though
  # the path is real. extraMounts explicitly bind-mounts it into kubelet's
  # namespace so pods can see it too.
  kernel:
    modules:
      - name: iscsi_tcp
  kubelet:
    extraMounts:
      - destination: /etc/iscsi
        type: bind
        source: /etc/iscsi
        options:
          - bind
          - rshared
          - rw
      - destination: /var/lib/iscsi
        type: bind
        source: /var/lib/iscsi
        options:
          - bind
          - rshared
          - rw
