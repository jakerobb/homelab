ipam:
  mode: kubernetes            # Cilium uses the podCIDR Talos' controller-manager
                              # allocates from podSubnets (10.244.0.0/16) — they can't diverge

kubeProxyReplacement: true    # we disabled kube-proxy in the Talos config

# Added 2026-09-13: full eBPF host routing (bypassing iptables entirely) appears
# to require BPF-based masquerading too — with masquerading left on iptables
# (the default), Cilium was silently falling back to "Host: Legacy" routing,
# which had a gap handling externally-sourced (BGP-advertised LB) traffic:
# TCP handshake completed, zero data ever flowed. See talos/README.md.
bpf:
  masquerade: true

# No kube-proxy means no ClusterIP for the API server yet, so reach it via Talos
# KubePrism (the local LB you already have enabled on 7445) — solves the chicken-and-egg
k8sServiceHost: localhost
k8sServicePort: 7445

# BGP control plane — DISABLED 2026-09-13. The UCG Fiber has some kind of
# first-packet-only forwarding bug for BGP-learned routes (TCP handshake
# completes, zero data ever flows after) that we couldn't resolve after
# extensive investigation — see talos/README.md for the full writeup. Pivoted
# to L2 announcements instead, which sidesteps router-side dynamic routing
# entirely. The UCG's own BGP peering config (Policy Engine > Dynamic Routing)
# should also be removed there since it's no longer used.
bgpControlPlane:
  enabled: false

# L2 announcements: the LB pool IP just responds to ARP directly, making it
# look like a normal host on the LAN — no routing/BGP involved.
l2announcements:
  enabled: true

# Sized for our LB pool's max size (192.168.102.128/26, 64 addresses): Cilium's
# L2 announcement leader election renews its lease every leaseRenewDeadline
# (default 5s), needing roughly numServices/5 QPS. 64/5 ≈ 13 — rounded up with
# headroom since we're nowhere near 64 services today.
k8sClientRateLimit:
  qps: 20
  burst: 40

# Talos already mounts cgroup v2; don't let Cilium try to mount it
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# Talos runs a locked-down securityContext; grant Cilium exactly the caps it needs.
# BPF/PERFMON added 2026-09-13 alongside bpf.masquerade above, to unlock full
# eBPF host routing instead of the "Legacy" iptables-based fallback — a real
# improvement made along the way, even though it turned out not to be the
# cause of the actual external-traffic bug (see talos/README.md).
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - BPF
      - PERFMON
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# Ingress via Gateway API instead of a separate ingress-nginx-style controller —
# reuses the existing LB pool (lb-pool.yaml) and L2 announcement policy
# (l2-announcement-policy.yaml) for the Gateway's own LoadBalancer Service, so
# there's no second controller/data-plane to run. Requires the upstream Gateway
# API CRDs to be installed BEFORE this is applied (see talos/README.md) —
# otherwise the operator has nothing to watch. Setting this to true also flips
# on enable-envoy-config automatically and (with gatewayClass.create left at
# its default "auto") makes cilium-operator create the `cilium` GatewayClass
# once it sees the CRDs.
gatewayAPI:
  enabled: true
