# Namespace for Gateway API infra objects (the Gateway itself), kept separate
# from app namespaces the same way an ingress-nginx-style controller would
# live in its own namespace. Per-app HTTPRoutes live in the app's own
# namespace and attach to this Gateway via allowedRoutes below.
apiVersion: v1
kind: Namespace
metadata:
  name: gateway-system
---
# GatewayClass "cilium" is NOT defined here — cilium-operator creates it
# automatically once gatewayAPI.enabled=true (see values.yaml) and the
# Gateway API CRDs are present.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab-gateway
  namespace: gateway-system
spec:
  gatewayClassName: cilium
  listeners:
    # Kept alongside the https listener below (no forced redirect yet) —
    # revisit once every route has moved to https.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    # TLS decided 2026-09-13: real publicly-trusted certs via cert-manager +
    # Let's Encrypt DNS-01 (Cloudflare), not an internal CA — see
    # manifests/cert-manager-config/. The cert Secret lives in this same
    # namespace (gateway-system), so no ReferenceGrant is needed.
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-jakerobb-org-tls
      allowedRoutes:
        namespaces:
          from: All
