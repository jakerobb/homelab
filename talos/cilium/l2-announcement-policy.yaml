apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: homelab-l2-announce
spec:
  # Same principle as the old BGP setup: only nodes that actually run workload
  # pods should announce LoadBalancer IPs, not the tainted control-plane nodes.
  # Using the built-in role label instead of a manual bgp-speaker-style label
  # means new workers need zero extra labeling to participate.
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  # No `interfaces` restriction (found broken 2026-09-15): this originally
  # pinned announcements to `^eth0$`, but the MS-A2 Talos worker VMs' real
  # NIC is `ens18` (standard Proxmox virtio-net naming) — nothing ever
  # matched, so Cilium's L2 responder held the leader lease and reported
  # "Running" while silently never answering ARP for the LB IP. Confirmed via
  # tcpdump: ARP requests went out from the jump box, zero replies came back.
  # Omitting `interfaces` entirely announces over all of a node's interfaces
  # (Cilium default) — more robust than hardcoding a NIC name, especially
  # since future physical worker hardware may use yet another naming scheme.
  #
  # Services carrying the homelab.jakerobb.org/l2-announce label opt out of
  # this catch-all policy and are announced by a narrower one instead (for
  # now just l2-announcement-policy-10g.yaml). Otherwise both policies would
  # match and any worker could win the lease.
  serviceSelector:
    matchExpressions:
      - key: homelab.jakerobb.org/l2-announce
        operator: DoesNotExist
  externalIPs: false
  loadBalancerIPs: true
