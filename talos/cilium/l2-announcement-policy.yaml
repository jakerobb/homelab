apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: homelab-l2-announce
spec:
  # Same principle as the old BGP setup: only nodes that actually run workload
  # pods should announce LoadBalancer IPs, not the tainted control-plane nodes.
  # Using the built-in role label instead of a manual bgp-speaker-style label
  # means new workers need zero extra labeling to participate.
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  interfaces:
    - ^eth0$
  externalIPs: false
  loadBalancerIPs: true
